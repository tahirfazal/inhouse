  const [saving,setSaving]=useState(false);

  const fileRef=useRef(null), dragRef=useRef(null), svgRef=useRef(null), gRef=useRef(null), finishRef=useRef(null);

  const selEnts = entities.filter(e=>selIds.includes(e.id));
  const one = selEnts.length===1 ? selEnts[0] : null;

  function pushHistory(){ setUndoStack(u=>[...u.slice(-79), JSON.stringify(entities)]); setRedoStack([]); }
  function undo(){ if(!undoStack.length) return; setRedoStack(r=>[...r,JSON.stringify(entities)]);
    const snap=undoStack[undoStack.length-1]; setUndoStack(u=>u.slice(0,-1)); const o=JSON.parse(snap); setEntities(o);
    setSelIds(ids=>ids.filter(id=>o.some(e=>e.id===id))); }
  function redo(){ if(!redoStack.length) return; setUndoStack(u=>[...u,JSON.stringify(entities)]);
    const snap=redoStack[redoStack.length-1]; setRedoStack(r=>r.slice(0,-1)); setEntities(JSON.parse(snap)); }

  async function handleFile(file){
    try{
      const text=await file.text();
      const {layers,entities:ents}=parseDxf(text);
      if(!ents.length){ toastMsg("No POLYLINE/TEXT entities found in that file"); return; }
      const allPts=ents.flatMap(e=>e.pts);
      const bb=bbox(allPts);
      const minX=bb[0], maxY=bb[3];
      const conv = e=>({...e, pts:e.pts.map(p=>[p[0]-minX, maxY-p[1]])});
      const converted=ents.map(conv);
      const lm={}; Object.keys(layers).forEach(k=>lm[k]={color:layers[k].color});
      converted.forEach(e=>{ if(!lm[e.layer]) lm[e.layer]={color:7}; });
      setEntities(converted); setLayerMeta(lm);
      const vis={}; Object.keys(lm).forEach(k=>vis[k]=true); setLayerVis(vis);
      setOrigin({minX,maxY}); setFname(file.name); setSelIds([]); setUndoStack([]); setRedoStack([]);
      setTab("layers");
      toastMsg("Loaded "+file.name+" — "+converted.length+" entities, "+Object.keys(lm).length+" layers");
      setTimeout(()=>fitView(converted),50);
    }catch(err){ toastMsg("Could not parse that DXF: "+err.message); console.error(err); }
  }
  function onFileChange(e){ const f=e.target.files[0]; if(f) handleFile(f); e.target.value=""; }
  function onDrop(e){ e.preventDefault(); const f=e.dataTransfer.files[0]; if(f) handleFile(f); }

  function fitView(ents){
    ents = ents||entities; if(!ents.length || !svgRef.current) return;
    const bb=bbox(ents.flatMap(e=>e.pts));
    const w=bb[2]-bb[0]||1, h=bb[3]-bb[1]||1;
    const vw=svgRef.current.clientWidth-80, vh=svgRef.current.clientHeight-80;
    const z=Math.max(0.001, Math.min(vw/w, vh/h));
    setZoom(z); setPan({x:40-bb[0]*z, y:40-bb[1]*z});
  }

  function chooseTool(t){ setTool(t); setDraft(null); setMeasure(null); if(t!=="select") setSelIds([]); }
  function addEntity(e){ pushHistory(); setEntities(prev=>[...prev,e]); setSelIds([e.id]); setTool("select"); }
  function deleteSelection(){ if(!selIds.length) return; pushHistory(); setEntities(prev=>prev.filter(e=>!selIds.includes(e.id))); setSelIds([]); }
  function duplicateSelection(){ if(!selIds.length) return; pushHistory();
    const copies=selEnts.map(e=>{ const c=JSON.parse(JSON.stringify(e)); c.id=uid(); c.pts=c.pts.map(p=>[p[0]+4,p[1]+4]); return c; });
    setEntities(prev=>[...prev,...copies]); setSelIds(copies.map(c=>c.id)); }
  function updateOne(id,mutator){ setEntities(prev=>prev.map(e=> e.id===id? mutator(e) : e)); }
  function ensureLayer(name,color){ setLayerMeta(m=> m[name]? m : {...m,[name]:{color:color||7}});
    setLayerVis(v=> v[name]!==undefined ? v : {...v,[name]:true}); }

  useEffect(()=>{
    function onKey(e){
      const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
      if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
      if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="y"){ e.preventDefault(); redo(); return; }
      if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="d"&&selIds.length&&!typing){ e.preventDefault(); duplicateSelection(); return; }
      if(typing) return;
      if(e.key==="Escape"){ setDraft(null); setSelIds([]); setMeasure(null); return; }
      if(e.key==="Enter" && draft && finishRef.current){ e.preventDefault(); finishRef.current(); return; }
      if((e.key==="Delete"||e.key==="Backspace")&&selIds.length){ e.preventDefault(); deleteSelection(); return; }
      if(e.key==="v") setTool("select");
      if(selIds.length && e.key.startsWith("Arrow")){
        e.preventDefault();
        const d=(e.shiftKey?5:0.5);
        const dx=e.key==="ArrowLeft"?-d:e.key==="ArrowRight"?d:0, dy=e.key==="ArrowUp"?-d:e.key==="ArrowDown"?d:0;
        setEntities(prev=>prev.map(en=> selIds.includes(en.id)? {...en,pts:en.pts.map(p=>[p[0]+dx,p[1]+dy])} : en));
        clearTimeout(window._nk); window._nk=setTimeout(()=>pushHistory(),400);
      }
    }
    window.addEventListener("keydown",onKey);
    return ()=>window.removeEventListener("keydown",onKey);
  },[selIds,entities,undoStack,redoStack,draft]);

  function dl(blob,name){ const u=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=u; a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(u),4000); }

  function exportDxf(){
    if(!origin){ toastMsg("Load a DXF first"); return; }
    const worldEnts = entities.map(e=>({...e, pts:e.pts.map(p=>[p[0]+origin.minX, origin.maxY-p[1]])}));
    const txt = writeDxf(worldEnts, layerMeta);
    dl(new Blob([txt],{type:"application/dxf"}), fname.replace(/\.dxf$/i,"")+"-edited.dxf");
    toastMsg("Exported "+worldEnts.length+" entities to DXF");
  }

  function niceScaleBar(target){ const steps=[1,2,5,10,20,25,50,100,200,250,500,1000]; return steps.reduce((a,b)=>Math.abs(b-target)<Math.abs(a-target)?b:a); }

  async function exportPdf(){
    setSaving(true);
    try{
      const bb=bbox(entities.flatMap(e=>e.pts));
      const wM=bb[2]-bb[0], hM=bb[3]-bb[1];
      const marginPt=54, sheetW=1224, sheetH=792;
      const availW=sheetW-marginPt*2-220, availH=sheetH-marginPt*2;
      const scale=Math.min(availW/wM, availH/hM);
      const pdf=await PDFDocument.create();
      const page=pdf.addPage([sheetW,sheetH]);
      const font=await pdf.embedFont(StandardFonts.Helvetica);
      const fontB=await pdf.embedFont(StandardFonts.HelveticaBold);
      const ox=marginPt-bb[0]*scale, oy=marginPt-bb[1]*scale;
      const toPt=p=>[ox+p[0]*scale, oy+(hM-(p[1]-bb[1]))*scale];

      entities.filter(e=>layerVis[e.layer]!==false).forEach(e=>{
        const col=rgb(...hexToRgb01(aciColor((layerMeta[e.layer]||{}).color)));
        if(e.kind==="poly"){
          const pts=e.pts.map(toPt);
          const d="M "+pts.map(p=>p[0].toFixed(2)+" "+p[1].toFixed(2)).join(" L ")+(e.closed?" Z":"");
          page.drawSvgPath(d,{x:0,y:0,scale:1,borderColor:col,borderWidth:1,color:e.closed?col:undefined,opacity:e.closed?0.12:1,borderOpacity:0.9});
        }else{
          const p=toPt(e.pts[0]);
          page.drawText(e.text||"", {x:p[0], y:p[1], size:Math.max(5,e.height*scale*1.3), font, color:col});
        }
      });

      const tbX=sheetW-marginPt-190;
      page.drawRectangle({x:tbX,y:marginPt,width:190,height:sheetH-marginPt*2,borderColor:rgb(0.7,0.7,0.7),borderWidth:1});
      page.drawText("SITE PLAN EXPORT",{x:tbX+12,y:sheetH-marginPt-24,size:11,font:fontB});
      page.drawText(fname||"untitled.dxf",{x:tbX+12,y:sheetH-marginPt-40,size:8,font,color:rgb(0.4,0.4,0.4)});
      page.drawText("Scale  1:"+Math.round(1/scale*72/12),{x:tbX+12,y:sheetH-marginPt-58,size:8,font});
      page.drawText("Extent  "+wM.toFixed(1)+" x "+hM.toFixed(1)+" m",{x:tbX+12,y:sheetH-marginPt-70,size:8,font});
      page.drawText("Generated "+new Date().toISOString().slice(0,10),{x:tbX+12,y:sheetH-marginPt-82,size:8,font,color:rgb(0.4,0.4,0.4)});
      let ly=sheetH-marginPt-104;
      page.drawText("LAYERS",{x:tbX+12,y:ly,size:8,font:fontB,color:rgb(0.4,0.4,0.4)}); ly-=14;
      Object.keys(layerMeta).filter(k=>layerVis[k]!==false && entities.some(e=>e.layer===k)).slice(0,28).forEach(k=>{
        const col=rgb(...hexToRgb01(aciColor(layerMeta[k].color)));
        page.drawRectangle({x:tbX+12,y:ly-2,width:8,height:8,color:col});
        page.drawText(k.slice(0,24),{x:tbX+26,y:ly,size:6.5,font});
        ly-=11;
      });

      const barM = niceScaleBar(wM/6);
      const barPt = barM*scale;
      const bx=marginPt, by=marginPt+8;
      page.drawLine({start:{x:bx,y:by},end:{x:bx+barPt,y:by},thickness:1.5,color:rgb(0,0,0)});
      page.drawText(barM+" m",{x:bx,y:by+4,size:7,font});

      dl(new Blob([await pdf.save()],{type:"application/pdf"}), fname.replace(/\.dxf$/i,"")+"-siteplan.pdf");
      toastMsg("Exported site plan PDF");
    }catch(err){ toastMsg("PDF export failed: "+err.message); console.error(err); }
    setSaving(false);
  }

  const visibleEnts = entities.filter(e=>layerVis[e.layer]!==false);

  return (
    <div className="app dxf-theme">
      <TopBar
        loaded={!!entities.length} onOpen={()=>fileRef.current.click()}
        undoStack={undoStack} redoStack={redoStack} undo={undo} redo={redo}
        zoom={zoom} setZoom={setZoom} onFit={()=>fitView()}
        onExportDxf={exportDxf} onExportPdf={exportPdf} saving={saving}
      />
      <div className="rail">
        {TOOLS.map((grp,gi)=>(
          <div className="tgroup" key={gi}>
            <div className="glab">{grp.g}</div>
            {grp.items.map(id=>(
              <button key={id} className={"tool"+(tool===id?" on":"")} title={LABEL[id]} onClick={()=>chooseTool(id)}>
                <ToolIcon name={id}/><span>{LABEL[id]}</span>
              </button>
            ))}
          </div>
        ))}
      </div>

      <div className="viewer" onDragOver={e=>e.preventDefault()} onDrop={onDrop}>
        {!entities.length ? (
          <div className="emptyv">
            <div className="big">Drop a DXF here</div>
            <div className="sub">Site plans stay in this browser tab. Edit building footprints, yards, and labels by layer, then export back to DXF or a titled PDF sheet.</div>
            <button className="tb primary" onClick={()=>fileRef.current.click()}>Open DXF</button>
          </div>
        ) : (
          <Canvas
            entities={visibleEnts} allEntities={entities} setEntities={setEntities}
            layerMeta={layerMeta} tool={tool} selIds={selIds} setSelIds={setSelIds}
            draft={draft} setDraft={setDraft} zoom={zoom} setZoom={setZoom} pan={pan} setPan={setPan}
            pushHistory={pushHistory} dragRef={dragRef} svgRef={svgRef} gRef={gRef} finishRef={finishRef}
            setCoord={setCoord} addEntity={addEntity} rectLock={rectLock} measure={measure} setMeasure={setMeasure}
            newLayerName={newLayerName} ensureLayer={ensureLayer}
          />
        )}
      </div>

      <div className="side">
        <div className="tabs">
          {["layers","props","shapes"].map(t=>(
            <button key={t} className={"tab"+(tab===t?" on":"")} onClick={()=>setTab(t)}>{t==="layers"?"Layers":t==="props"?"Properties":"Shapes"}</button>
          ))}
        </div>
        {tab==="layers" && (
          <LayersPane layerMeta={layerMeta} layerVis={layerVis} setLayerVis={setLayerVis} entities={entities}
            onColor={(name,color)=>setLayerMeta(m=>({...m,[name]:{...m[name],color}}))}
            newLayerName={newLayerName} setNewLayerName={setNewLayerName}
            onAddLayer={()=>{ if(!newLayerName.trim()) return; ensureLayer(newLayerName.trim().toUpperCase()); setNewLayerName(""); }}
          />
        )}
        {tab==="props" && (
          <PropsPane one={one} selEnts={selEnts} layerMeta={layerMeta}
            onChangeLayer={v=>{ ensureLayer(v); updateOne(one.id, e=>({...e,layer:v})); pushHistory(); }}
            onChangeText={v=>{ updateOne(one.id, e=>({...e,text:v})); clearTimeout(window._tk); window._tk=setTimeout(pushHistory,500); }}
            onChangeHeight={v=>{ updateOne(one.id, e=>({...e,height:v})); pushHistory(); }}
            onChangeRotation={v=>{ updateOne(one.id, e=>({...e,rotation:v})); pushHistory(); }}
            rectLock={rectLock} setRectLock={setRectLock}
            onDelete={deleteSelection} onDuplicate={duplicateSelection}
          />
        )}
        {tab==="shapes" && (
          <ShapesPane entities={entities} selIds={selIds}
            onPick={(e,additive)=>{ setTool("select"); setTab("props");
              setSelIds(ids=> additive? (ids.includes(e.id)? ids.filter(i=>i!==e.id):[...ids,e.id]) : [e.id]); }}/>
        )}
      </div>

      <div className="status">
        <div className="mono">{entities.length? "Loaded  ·  "+entities.length+" entities" : "No document"}</div>
        <div className="mono">Tool: {LABEL[tool]}</div>
        <div className="mono">{selIds.length? selIds.length+" selected" : ""}</div>
        <div style={{flex:1}}></div>
        <div className="mono">{coord}</div>
      </div>

      <input ref={fileRef} type="file" accept=".dxf" style={{display:"none"}} onChange={onFileChange}/>
    </div>
  );
}

function TopBar({loaded,onOpen,undoStack,redoStack,undo,redo,zoom,setZoom,onFit,onExportDxf,onExportPdf,saving}){
  return (
    <div className="top">
      <div className="brand">Site<span>work</span></div>
      <button className="tb" onClick={onOpen}>Open DXF</button>
      <div className="sep"></div>
      <button className="tb icon" title="Undo (Ctrl+Z)" disabled={!undoStack.length} onClick={undo}>&#8630;</button>
      <button className="tb icon" title="Redo (Ctrl+Y)" disabled={!redoStack.length} onClick={redo}>&#8631;</button>
      <div className="sep"></div>
      <button className="tb icon" onClick={()=>setZoom(z=>Math.max(0.0005,z/1.25))} disabled={!loaded}>&minus;</button>
      <div className="mono" style={{minWidth:52,textAlign:"center"}}>{loaded? (zoom*100).toFixed(1)+"%" : "—"}</div>
      <button className="tb icon" onClick={()=>setZoom(z=>Math.min(50,z*1.25))} disabled={!loaded}>+</button>
      <button className="tb" onClick={onFit} disabled={!loaded}>Fit</button>
      <div style={{flex:1}}></div>
      <button className="tb" onClick={onExportDxf} disabled={!loaded}>Export DXF</button>
      <button className="tb primary" onClick={onExportPdf} disabled={!loaded||saving}>{saving?"Exporting…":"Export PDF"}</button>
    </div>
  );
}

function Canvas({entities,allEntities,setEntities,layerMeta,tool,selIds,setSelIds,draft,setDraft,zoom,setZoom,pan,setPan,
                 pushHistory,dragRef,svgRef,gRef,finishRef,setCoord,addEntity,rectLock,measure,setMeasure,newLayerName,ensureLayer}){
  const [marquee,setMarquee]=useState(null);

  function toWorld(e){
    const pt=svgRef.current.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY;
    const m=gRef.current.getScreenCTM(); if(!m) return [0,0];
    const p=pt.matrixTransform(m.inverse()); return [p.x,p.y];
  }

  function finishMulti(overridePts){
    if(!draft) return;
    const pts = overridePts || draft.pts.slice(0,-1);
    if(pts.length<3){ setDraft(null); return; }
    addEntity({id:uid(),kind:"poly",layer:draft.layer,pts,closed:true});
  }
  finishRef.current=finishMulti;

  function onWheel(e){
    e.preventDefault();
    const rect=svgRef.current.getBoundingClientRect();
    const mx=e.clientX-rect.left, my=e.clientY-rect.top;
    const wx=(mx-pan.x)/zoom, wy=(my-pan.y)/zoom;
    const nz=Math.max(0.0005, Math.min(50, zoom*(e.deltaY<0?1.12:1/1.12)));
    setZoom(nz); setPan({x:mx-wx*nz, y:my-wy*nz});
  }

  function onDown(e){
    if(e.button!==0) return;
    const p=toWorld(e);

    if(tool==="pan"){ dragRef.current={mode:"pan",start:[e.clientX,e.clientY],pan0:pan}; svgRef.current.setPointerCapture(e.pointerId); return; }
    if(tool==="measure"){
      if(!measure) setMeasure({a:p,b:p}); else setMeasure(null);
      return;
    }
    if(tool==="select"){
      const h=e.target.closest("[data-h]");
      if(h && selIds.length===1){
        const a=allEntities.find(x=>x.id===selIds[0]);
        dragRef.current={mode:"handle",a,i:+h.dataset.h,orig:JSON.parse(JSON.stringify(a.pts))};
        svgRef.current.setPointerCapture(e.pointerId); return;
      }
      const g=e.target.closest("[data-id]");
      if(g){
        const id=g.dataset.id;
        let ids;
        if(e.shiftKey||e.ctrlKey||e.metaKey) ids=selIds.includes(id)? selIds.filter(i=>i!==id):[...selIds,id];
        else ids=selIds.includes(id)?selIds:[id];
        setSelIds(ids);
        const orig={}; allEntities.forEach(a=>{ if(ids.includes(a.id)) orig[a.id]=JSON.parse(JSON.stringify(a.pts)); });
        dragRef.current={mode:"move",ids,start:p,orig};
        svgRef.current.setPointerCapture(e.pointerId); return;
      }
      if(!(e.shiftKey||e.ctrlKey||e.metaKey)) setSelIds([]);
      dragRef.current={mode:"marquee",start:p,additive:e.shiftKey||e.ctrlKey||e.metaKey,base:selIds};
      setMarquee({x0:p[0],y0:p[1],x1:p[0],y1:p[1]});
      svgRef.current.setPointerCapture(e.pointerId); return;
    }
    if(tool==="rect"){
      const layer = newLayerName.trim() ? newLayerName.trim().toUpperCase() : (Object.keys(layerMeta)[0]||"NEW_LAYER");
      ensureLayer(layer);
      setDraft({id:uid(),kind:"poly",layer,pts:[p,p.slice()],closed:true});
      dragRef.current={mode:"rect",start:p};
      svgRef.current.setPointerCapture(e.pointerId); return;
    }
    if(tool==="polygon"){
      const layer = newLayerName.trim() ? newLayerName.trim().toUpperCase() : (Object.keys(layerMeta)[0]||"NEW_LAYER");
      ensureLayer(layer);
      if(!draft) setDraft({id:uid(),kind:"poly",layer,pts:[p,p.slice()],closed:true});
      else{
        const pts=draft.pts.slice();
        if(pts.length>2 && dist(pts[0],p)<8/zoom){ finishMulti(); return; }
        pts[pts.length-1]=p; pts.push(p.slice());
        setDraft(d=>({...d,pts}));
      }
      return;
    }
    if(tool==="text"){
      const layer = newLayerName.trim() ? newLayerName.trim().toUpperCase() : (Object.keys(layerMeta)[0]||"NEW_LAYER");
      ensureLayer(layer);
      const label = prompt("Label text:","LABEL");
      if(label!=null && label.trim()){
        addEntity({id:uid(),kind:"text",layer,pts:[p],text:label.trim(),height:3,rotation:0});
      }
      return;
    }
  }

  function onMove(e){
    const p=toWorld(e);
    setCoord("X "+p[0].toFixed(2)+"m  Y "+p[1].toFixed(2)+"m");
    const drag=dragRef.current;
    if(!drag){
      if(draft && draft.pts.length>1 && tool==="polygon"){
        const pts=draft.pts.slice(); pts[pts.length-1]=p; setDraft(d=>({...d,pts}));
      }
      if(measure) setMeasure(m=> m? {...m,b:p} : m);
      return;
    }
    if(drag.mode==="pan"){
      setPan({x:drag.pan0.x+(e.clientX-drag.start[0]), y:drag.pan0.y+(e.clientY-drag.start[1])});
      return;
    }
    if(drag.mode==="marquee"){ setMarquee(m=>({...m,x1:p[0],y1:p[1]})); return; }
    if(drag.mode==="move"){
      const dx=p[0]-drag.start[0], dy=p[1]-drag.start[1];
      setEntities(prev=>prev.map(a=> drag.orig[a.id]? {...a,pts:drag.orig[a.id].map(q=>[q[0]+dx,q[1]+dy])} : a));
      return;
    }
    if(drag.mode==="handle"){
      const a=drag.a;
      if(rectLock && a.closed && isAxisRect(drag.orig)){
        const bb=bbox(drag.orig); const opp=[[bb[2],bb[3]],[bb[0],bb[3]],[bb[0],bb[1]],[bb[2],bb[1]]][drag.i];
        const nbb=[Math.min(opp[0],p[0]),Math.min(opp[1],p[1]),Math.max(opp[0],p[0]),Math.max(opp[1],p[1])];
        const newPts=[[nbb[0],nbb[1]],[nbb[2],nbb[1]],[nbb[2],nbb[3]],[nbb[0],nbb[3]]];
        setEntities(prev=>prev.map(x=> x.id===a.id? {...x,pts:newPts}:x));
      }else{
        const newPts=drag.orig.map((q,i)=> i===drag.i? p : q);
        setEntities(prev=>prev.map(x=> x.id===a.id? {...x,pts:newPts}:x));
      }
      return;
    }
    if(drag.mode==="rect" && draft){
      const bb=[Math.min(drag.start[0],p[0]),Math.min(drag.start[1],p[1]),Math.max(drag.start[0],p[0]),Math.max(drag.start[1],p[1])];
      setDraft(d=>({...d, pts:[[bb[0],bb[1]],[bb[2],bb[1]],[bb[2],bb[3]],[bb[0],bb[3]]]}));
      return;
    }
  }

  function onUp(e){
    const drag=dragRef.current; if(!drag) return;
    dragRef.current=null;
    try{ svgRef.current.releasePointerCapture(e.pointerId); }catch(err){}
    if(drag.mode==="marquee"){
      const m=marquee; setMarquee(null); if(!m) return;
      const r=[Math.min(m.x0,m.x1),Math.min(m.y0,m.y1),Math.max(m.x0,m.x1),Math.max(m.y0,m.y1)];
      if(Math.abs(r[2]-r[0])<0.3 && Math.abs(r[3]-r[1])<0.3) return;
      const hit=entities.filter(a=>{ const bb=bbox(a.pts); return !(bb[2]<r[0]||bb[0]>r[2]||bb[3]<r[1]||bb[1]>r[3]); }).map(a=>a.id);
      setSelIds(drag.additive? Array.from(new Set([...drag.base,...hit])) : hit);
      if(hit.length) toastMsg(hit.length+" selected");
      return;
    }
    if(drag.mode==="move"||drag.mode==="handle"){ pushHistory(); return; }
    if(drag.mode==="rect"){
      if(!draft) return;
      const bb=bbox(draft.pts);
      if(Math.abs(bb[2]-bb[0])<0.2 || Math.abs(bb[3]-bb[1])<0.2){ setDraft(null); return; }
      addEntity({id:draft.id,kind:"poly",layer:draft.layer,pts:draft.pts,closed:true});
      setDraft(null);
    }
  }
  function onDbl(){ if(draft && tool==="polygon") finishMulti(); }

  const selEnts = allEntities.filter(a=>selIds.includes(a.id));

  return (
    <svg ref={svgRef} className={"cvs "+(tool==="select"?"cursor-select":tool==="pan"?"cursor-pan":"cursor-draw")}
      onWheel={onWheel} onPointerDown={onDown} onPointerMove={onMove} onPointerUp={onUp} onDoubleClick={onDbl}
      onPointerLeave={()=>setCoord("—")}>
      <g ref={gRef} transform={`translate(${pan.x},${pan.y}) scale(${zoom})`}>
        {entities.map(e=>(
          <EntSvg key={e.id} e={e} color={aciColor((layerMeta[e.layer]||{}).color)} zoom={zoom}/>
        ))}
        {draft && <EntSvg e={draft} color="#57b8ff" zoom={zoom} opacity={0.8}/>}
        {selEnts.map(a=>{ const bb=bbox(a.pts); return (
          <rect key={"o"+a.id} x={bb[0]-0.3} y={bb[1]-0.3} width={bb[2]-bb[0]+0.6} height={bb[3]-bb[1]+0.6}
            fill="none" stroke="#57b8ff" strokeWidth={1/zoom} strokeDasharray={(2/zoom)+" "+(1.4/zoom)}/>); })}
        {selEnts.length===1 && <Handles a={selEnts[0]} zoom={zoom}/>}
        {marquee && (
          <rect x={Math.min(marquee.x0,marquee.x1)} y={Math.min(marquee.y0,marquee.y1)}
            width={Math.abs(marquee.x1-marquee.x0)} height={Math.abs(marquee.y1-marquee.y0)}
            fill="#57b8ff" fillOpacity="0.1" stroke="#57b8ff" strokeWidth={1/zoom} strokeDasharray={(2/zoom)+" "+(1.4/zoom)}/>
        )}
        {measure && (
          <g>
            <line x1={measure.a[0]} y1={measure.a[1]} x2={measure.b[0]} y2={measure.b[1]} stroke="#f0a92e" strokeWidth={1.4/zoom} strokeDasharray={(3/zoom)+" "+(2/zoom)}/>
            <circle cx={measure.a[0]} cy={measure.a[1]} r={3/zoom} fill="#f0a92e"/>
            <circle cx={measure.b[0]} cy={measure.b[1]} r={3/zoom} fill="#f0a92e"/>
            <text x={(measure.a[0]+measure.b[0])/2} y={(measure.a[1]+measure.b[1])/2-4/zoom} fontSize={12/zoom}
              fill="#2F6280" textAnchor="middle" fontFamily="monospace">{dist(measure.a,measure.b).toFixed(2)} m / {(dist(measure.a,measure.b)*3.28084).toFixed(1)} ft</text>
          </g>
        )}
      </g>
    </svg>
  );
}
function EntSvg({e,color,zoom,opacity}){
  if(e.kind==="poly"){
    return (
      <g opacity={opacity}>
        {e.closed && <path d={ptsToD(e.pts,true)} fill={color} fillOpacity="0.16" stroke="none"/>}
        <path d={ptsToD(e.pts,e.closed)} fill="none" stroke={color} strokeWidth={1.4/zoom} strokeLinejoin="round"/>
        <path data-id={e.id} d={ptsToD(e.pts,e.closed)} fill={e.closed?"transparent":"none"} stroke="transparent"
          strokeWidth={Math.max(1.4,7/zoom)} style={{pointerEvents: e.closed? "fill":"stroke"}}/>
      </g>
    );
  }
  return (
    <g opacity={opacity}>
      <text data-id={e.id} x={e.pts[0][0]} y={e.pts[0][1]} fontSize={e.height} fill={color}
        fontFamily="Helvetica, Arial, sans-serif" transform={e.rotation? `rotate(${-e.rotation} ${e.pts[0][0]} ${e.pts[0][1]})`:undefined}
        style={{pointerEvents:"visible"}}>{e.text}</text>
    </g>
  );
}
function Handles({a,zoom}){
  const r=4/zoom;
  return (
    <g>
      {a.pts.map((p,i)=>(
        <rect key={i} data-h={i} x={p[0]-r} y={p[1]-r} width={r*2} height={r*2}
          fill="#57b8ff" stroke="#0f1216" strokeWidth={1/zoom} style={{cursor:"pointer"}}/>
      ))}
    </g>
  );
}

function LayersPane({layerMeta,layerVis,setLayerVis,entities,onColor,newLayerName,setNewLayerName,onAddLayer}){
  const names=Object.keys(layerMeta).sort();
  const counts={}; entities.forEach(e=>{ counts[e.layer]=(counts[e.layer]||0)+1; });
  return (
    <div className="pane">
      <div className="layertools">
        <button className="tb" style={{flex:1}} onClick={()=>{ const v={}; names.forEach(n=>v[n]=true); setLayerVis(v); }}>Show all</button>
        <button className="tb" style={{flex:1}} onClick={()=>{ const v={}; names.forEach(n=>v[n]=false); setLayerVis(v); }}>Hide all</button>
      </div>
      {names.map(name=>(
        <div className="layerrow" key={name}>
          <input type="checkbox" checked={layerVis[name]!==false} onChange={e=>setLayerVis(v=>({...v,[name]:e.target.checked}))}/>
          <input type="color" className="swdot" value={aciColor(layerMeta[name].color)}
            onChange={ev=>onColor(name, closestAci(ev.target.value))} title="Override this layer's color"/>
          <div className={"layername"+(layerVis[name]===false?" dim":"")} title={name}>{name}</div>
          <div className="layercount">{counts[name]||0}</div>
        </div>
      ))}
      <div className="sec">
        <h4>Add layer</h4>
        <div className="row"><input type="text" placeholder="e.g. DC_BUILDING_PH2" value={newLayerName}
          onChange={e=>setNewLayerName(e.target.value)} onKeyDown={e=>{ if(e.key==="Enter") onAddLayer(); }}/>
        <button className="tb" onClick={onAddLayer}>Add</button></div>
        <div className="hint">New shapes drawn with Rectangle, Polygon or Label go onto this layer name if set — otherwise the first existing layer.</div>
      </div>
      <div className="sec"><h4>Colors</h4>
        <div className="hint">Colors are read from the DXF's AutoCAD color index (ACI). Common indices (1–9, 250–255) map exactly; others are an approximation for legibility, not the exact AutoCAD palette.</div>
      </div>
    </div>
  );
}

function PropsPane({one,selEnts,layerMeta,onChangeLayer,onChangeText,onChangeHeight,onChangeRotation,rectLock,setRectLock,onDelete,onDuplicate}){
  if(!selEnts.length) return (
    <div className="pane">
      <div className="empty">Select a shape or label on the canvas — or drag a box to select several.</div>
      <div className="sec"><h4>Editing</h4>
        <label className="chk"><input type="checkbox" checked={rectLock} onChange={e=>setRectLock(e.target.checked)}/> Keep rectangles square when dragging a corner</label>
        <div className="hint" style={{marginTop:8}}>
          <b>Select:</b> drag empty space to rubber-band select, shift-click to add/remove.<br/>
          <b>Pan:</b> use the Pan tool, or scroll to zoom toward the cursor.<br/>
          <b>Draw:</b> Rectangle drags a box. Polygon clicks each vertex, then double-click or Enter to close.<br/>
          <b>Nudge:</b> arrow keys move selection 0.5&nbsp;m, Shift+arrow moves 5&nbsp;m.
        </div>
      </div>
    </div>
  );
  if(!one) return (
    <div className="pane">
      <div className="sec"><h4>{selEnts.length} shapes selected</h4>
        <div className="row"><button className="tb" onClick={onDuplicate}>Duplicate</button><button className="tb" onClick={onDelete}>Delete</button></div>
      </div>
    </div>
  );
  const isPoly = one.kind==="poly";
  const area = isPoly && one.closed ? shoelace(one.pts) : 0;
  const perim = isPoly ? (()=>{ let L=0; for(let i=0;i<one.pts.length;i++){ const a=one.pts[i], b=one.pts[(i+1)%one.pts.length]; if(i<one.pts.length-1||one.closed) L+=dist(a,b); } return L; })() : 0;
  return (
    <div className="pane">
      <div className="sec"><h4>{isPoly? (one.closed?"Closed shape":"Line") : "Label"}</h4>
        <div className="row"><label>Layer</label>
          <select value={one.layer} onChange={e=>onChangeLayer(e.target.value)}>
            {Object.keys(layerMeta).sort().map(n=><option key={n}>{n}</option>)}
          </select>
        </div>
        {!isPoly && (
          <>
            <div className="row"><label>Text</label><input type="text" value={one.text} onChange={e=>onChangeText(e.target.value)}/></div>
            <div className="row"><label>Height (m)</label><input type="number" step="0.1" value={one.height} onChange={e=>onChangeHeight(parseFloat(e.target.value)||1)}/></div>
            <div className="row"><label>Rotation °</label><input type="number" step="1" value={one.rotation} onChange={e=>onChangeRotation(parseFloat(e.target.value)||0)}/></div>
          </>
        )}
      </div>
      {isPoly && (
        <div className="sec"><h4>Geometry</h4>
          <div className="stat">
            Perimeter &nbsp;<b>{perim.toFixed(2)} m</b> &nbsp;({(perim*3.28084).toFixed(1)} ft)<br/>
            {one.closed && <React.Fragment>
              Area &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<b>{area.toFixed(1)} m²</b><br/>
              &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;{(area/M2_PER_SQFT).toFixed(0)} sq ft<br/>
              &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;{(area/M2_PER_ACRE).toFixed(3)} acres
            </React.Fragment>}
          </div>
        </div>
      )}
      <div className="sec">
        <label className="chk"><input type="checkbox" checked={rectLock} onChange={e=>setRectLock(e.target.checked)}/> Keep rectangles square when dragging a corner</label>
      </div>
      <div className="sec"><div className="row"><button className="tb" onClick={onDuplicate}>Duplicate</button><button className="tb" onClick={onDelete}>Delete</button></div></div>
    </div>
  );
}

function ShapesPane({entities,selIds,onPick}){
  if(!entities.length) return <div className="pane"><div className="empty">Nothing loaded yet.</div></div>;
  return (
    <div className="pane">
      {entities.map(e=>(
        <div key={e.id} className={"shrow"+(selIds.includes(e.id)?" on":"")} onClick={ev=>onPick(e,ev.shiftKey||ev.ctrlKey||ev.metaKey)}>
          <div style={{width:9,height:9,borderRadius:2,background:"#57b8ff"}}></div>
          <div><div className="shname">{e.kind==="text"? (e.text||"(label)") : (e.closed?"Polygon":"Line")}</div><div className="shlayer">{e.layer}</div></div>
        </div>
      ))}
    </div>
  );
}

return App;
})();

/* =====================================================================
   SHELL — mode switcher, both apps stay mounted
   ===================================================================== */
function Shell(){
  const [mode,setMode]=useState("pdf");
  return (
    <div className="shell">
      <div className="modebar">
        <div className="modebrand">InHouse</div>
        <div className="vertag" title="Fieldset build version">{VERSION}</div>
        <button className={"modebtn pdf"+(mode==="pdf"?" on":"")} onClick={()=>setMode("pdf")}>
          <span className="dot"></span>PDF Markup
        </button>
        <button className={"modebtn dxf"+(mode==="dxf"?" on":"")} onClick={()=>setMode("dxf")}>
          <span className="dot"></span>DXF Site Plan
        </button>
      </div>
      <div className={"modebody"+(mode==="pdf"?" active":"")}>
        <div className="modefill"><RedlineApp/></div>
      </div>
      <div className={"modebody"+(mode==="dxf"?" active":"")}>
        <div className="modefill"><SiteworkApp/></div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Shell/>);
</script>
</body>
</html>
