<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>InHouse — PDF Markup &amp; DXF Site Plan</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
:root{
  --bg:#E7E1D4; --panel:#F2EDE3; --panel2:#EAE4D7; --line:#D9D1BF; --line2:#C6BCA6;
  --ink:#262320; --muted:#7C7466; --faint:#9A9182; --field:#FCF9F2;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.6,.3,1);
}
.redline-theme{ --accent:#A8462A; --accent-dim:#F0DFD8; --workspace:#DED7C7; }
.dxf-theme{ --accent:#2F6280; --accent-dim:#DAE4EC; --workspace:#DED7C7; }
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:13px;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;transition:background .12s var(--ease),border-color .12s var(--ease),color .12s var(--ease),transform .06s var(--ease)}
button:active:not(:disabled){transform:translateY(1px)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#root{height:100%}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:#C6BCA6;border-radius:6px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#B0A48B}

/* ---- shell / mode switcher ---- */
.shell{height:100%;display:grid;grid-template-rows:34px 1fr}
.modebar{grid-row:1;display:flex;align-items:center;gap:0;background:var(--panel);border-bottom:1px solid var(--line);padding:0 8px}
.modebrand{font-weight:600;letter-spacing:.24em;font-size:11px;text-transform:uppercase;color:var(--ink);padding-right:10px;margin-right:8px;border-right:1px solid var(--line)}
.vertag{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:#8A6F52;background:#EFE7D6;border:1px solid #DCCFB6;
  border-radius:20px;padding:1px 8px;margin-right:12px}
.modebtn{height:24px;padding:0 14px;border-radius:20px;border:1px solid transparent;background:transparent;color:var(--muted);font-size:11px;letter-spacing:.04em;display:inline-flex;align-items:center;gap:7px;margin-right:4px}
.modebtn:hover{background:var(--panel2);color:var(--ink)}
.modebtn .dot{width:6px;height:6px;border-radius:50%;background:#BEB4A2}
.modebtn.on.pdf{background:#F0DFD8;border-color:#D6B4A6;color:#8E3B22}
.modebtn.on.pdf .dot{background:#A8462A}
.modebtn.on.dxf{background:#DAE4EC;border-color:#AEC4D3;color:#2A5670}
.modebtn.on.dxf .dot{background:#2F6280}
.modebody{grid-row:2;position:relative;overflow:hidden;display:none}
.modebody.active{display:block}
.modefill{position:absolute;inset:0}

.app{display:grid;grid-template-rows:44px 1fr 26px;grid-template-columns:66px 1fr 272px;height:100%}
.top{grid-column:1/4;display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line)}
.rail{grid-row:2;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:6px 0}
.viewer{grid-row:2;background:var(--workspace);overflow:auto;position:relative}
.side{grid-row:2;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.status{grid-column:1/4;background:var(--panel);border-top:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 12px;font-family:var(--mono);font-size:11px;color:var(--muted)}

.brand{font-weight:600;letter-spacing:.2em;font-size:12px;text-transform:uppercase;padding-right:10px;margin-right:4px;border-right:1px solid var(--line);color:var(--ink)}
.brand span{color:var(--accent)}
.tb{position:relative;background:var(--field);border:1px solid var(--line2);color:var(--ink);height:28px;padding:0 10px;border-radius:5px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.tb:hover:not(:disabled){background:#fff;border-color:var(--accent);color:var(--accent)}
.tb.primary{background:var(--accent);border-color:var(--accent);color:#FCF9F2}
.tb.primary:hover:not(:disabled){filter:brightness(1.1);color:#fff}
.tb:disabled{opacity:.38;cursor:default}
.tb.icon{padding:0;width:28px;justify-content:center}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.mono{font-family:var(--mono);font-size:11px;color:var(--muted)}
.numin{width:46px;height:24px;background:var(--field);border:1px solid var(--line2);border-radius:4px;text-align:center;font-family:var(--mono);color:var(--ink)}

/* Alt-held shortcut badges */
.kbadge{position:absolute;top:-7px;right:-6px;background:var(--ink);color:#F7F2E8;font-family:var(--mono);
  font-size:9px;line-height:1;padding:2px 4px;border-radius:3px;pointer-events:none;z-index:5;letter-spacing:.02em;
  box-shadow:0 1px 3px #0003}
.altnote{position:fixed;left:50%;top:44px;transform:translateX(-50%);z-index:65;background:var(--ink);color:#F7F2E8;
  font-size:11px;padding:5px 14px;border-radius:20px;pointer-events:none;box-shadow:0 4px 16px #0003}

.tgroup{padding:4px 0;border-bottom:1px solid var(--line)}
.tgroup:last-child{border-bottom:0}
.glab{font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);text-align:center;padding:4px 0 2px}
.tool{position:relative;width:54px;height:46px;margin:2px auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:transparent;border:1px solid transparent;border-radius:6px;color:var(--muted)}
.tool svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tool span{font-size:8.5px;letter-spacing:.03em}
.tool:hover{background:var(--panel2);border-color:var(--line);color:var(--ink)}
.tool.on{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
.tool.armed{border-color:var(--accent);border-style:dashed;color:var(--accent)}

.tabs{display:flex;border-bottom:1px solid var(--line);flex:0 0 auto}
.tab{flex:1;height:34px;background:transparent;border:0;border-bottom:2px solid transparent;color:var(--muted);font-size:10px;letter-spacing:.13em;text-transform:uppercase}
.tab:hover{color:var(--ink);background:var(--panel2)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);background:var(--field)}
.pane{flex:1;overflow-y:auto}
.sec{padding:10px 12px;border-bottom:1px solid var(--line)}
.sec h4{margin:0 0 8px;font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--faint);font-weight:600}
.row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.row:last-child{margin-bottom:0}
.row label{width:70px;flex:0 0 auto;color:var(--muted);font-size:11px}
.row input[type=range]{flex:1;accent-color:var(--accent);min-width:0}
.row input[type=color]{width:30px;height:24px;padding:0;background:none;border:1px solid var(--line2);border-radius:4px;cursor:pointer}
.row input[type=number],.row input[type=text],.row select{flex:1;min-width:0;height:24px;background:var(--field);border:1px solid var(--line2);border-radius:4px;padding:0 6px}
.row input:focus,.row select:focus,.row textarea:focus{border-color:var(--accent);outline:none}
.row textarea{flex:1;min-height:56px;background:var(--field);border:1px solid var(--line2);border-radius:4px;padding:5px 6px;resize:vertical;font-size:12px;line-height:1.45}
.val{font-family:var(--mono);font-size:11px;color:var(--muted);width:36px;text-align:right;flex:0 0 auto}
.chk{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11px;cursor:pointer}
.chk input{accent-color:var(--accent);cursor:pointer}
.swatches{display:flex;gap:5px;flex-wrap:wrap}
.sw{width:19px;height:19px;border-radius:4px;border:1px solid #00000026;padding:0}
.sw:hover{outline:2px solid var(--accent);outline-offset:1px}
.hint{color:var(--muted);font-size:10.5px;line-height:1.55}
.empty{padding:22px 14px;color:var(--faint);font-size:11.5px;line-height:1.6;text-align:center}
.stat{font-family:var(--mono);font-size:11px;color:var(--ink);line-height:1.9}
.stat b{color:var(--accent)}

/* segmented button group (text align / B I U S) */
.seg{display:flex;gap:4px;flex:1;flex-wrap:wrap}
.segb{flex:0 0 auto;min-width:28px;height:26px;padding:0 8px;border:1px solid var(--line2);background:var(--field);
  color:var(--muted);border-radius:5px;display:inline-flex;align-items:center;justify-content:center;font-size:12px}
.segb:hover{border-color:var(--accent);color:var(--accent);background:#fff}
.segb.on{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
.segb svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round}

.mk{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.mk:hover{background:var(--panel2)}
.mk.on{background:var(--accent-dim)}
.mkdot{width:11px;height:11px;border-radius:3px;border:1px solid #00000026}
.mkt{font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mks{font-size:10px;color:var(--muted);font-family:var(--mono)}
.mkp{font-family:var(--mono);font-size:10px;color:var(--faint)}

.layerrow{display:grid;grid-template-columns:16px 20px 1fr 32px;gap:8px;align-items:center;padding:5px 12px;border-bottom:1px solid var(--line);font-size:11.5px}
.layerrow:hover{background:var(--panel2)}
.layerrow input[type=checkbox]{accent-color:var(--accent)}
.swdot{width:19px;height:19px;border-radius:4px;border:1px solid #00000026;cursor:pointer;padding:0}
.layername{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:default}
.layername.dim{color:var(--faint)}
.layercount{font-family:var(--mono);font-size:10px;color:var(--faint);text-align:right}
.layertools{display:flex;gap:4px;padding:6px 12px}

.shrow{display:grid;grid-template-columns:11px 1fr auto;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.shrow:hover{background:var(--panel2)}
.shrow.on{background:var(--accent-dim)}
.shname{font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shlayer{font-size:10px;color:var(--muted);font-family:var(--mono)}

.pagewrap{padding:16px 0 60px;display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
.page{position:relative;background:#fff;box-shadow:0 1px 3px #0000001f,0 8px 26px #00000014,0 0 0 1px #00000012;flex:0 0 auto}
.page canvas{display:block;width:100%;height:100%}
.page svg.ovl{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.calbadge{position:absolute;right:0;top:-16px;font-family:var(--mono);font-size:10px;color:var(--accent);letter-spacing:.05em}
.editbox{width:100%;height:100%;border:0;outline:1.5px solid var(--accent);background:transparent;color:#111;
  font-family:Helvetica,Arial,sans-serif;padding:0 1px;resize:none;line-height:1.15;overflow:hidden;
  white-space:pre;letter-spacing:0;box-sizing:border-box}
.editbox.cover{background:#fff}
.editbox::selection{background:rgba(168,70,42,.28)}

.emptyv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--muted);text-align:center;padding:20px}
.emptyv .big{font-size:15px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink)}
.emptyv .sub{font-size:12px;max-width:440px;line-height:1.7}
.cvs{width:100%;height:100%;touch-action:none;display:block}
.cursor-select{cursor:default}
.cursor-draw{cursor:crosshair}
.cursor-pan{cursor:grab}
.cursor-bucket{cursor:cell}
.cursor-text{cursor:text}
.cursor-format{cursor:copy}

.ctxmenu{position:fixed;z-index:70;min-width:212px;background:var(--field);border:1px solid var(--line2);
  border-radius:7px;padding:4px;box-shadow:0 10px 34px #0000002e;font-size:11.5px}
.ctxmenu button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:20px;
  background:none;border:0;color:var(--ink);text-align:left;padding:6px 9px;border-radius:4px;
  cursor:pointer;font-size:11.5px;font-family:inherit}
.ctxmenu button:hover:not(:disabled){background:var(--accent-dim);color:var(--accent)}
.ctxmenu button:disabled{color:#B7AE9C;cursor:default}
.ctxmenu .k{font-family:var(--mono);font-size:10px;opacity:.55;white-space:nowrap}
.ctxmenu .csep{height:1px;background:var(--line);margin:4px 2px}
.ctxmenu .chead{padding:5px 9px 6px;color:var(--faint);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
#modal{position:fixed;inset:0;background:rgba(38,35,30,.38);display:flex;align-items:center;justify-content:center;z-index:50}
.card{background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:18px 20px;width:360px;box-shadow:0 20px 60px #0000003d}
.card h3{margin:0 0 4px;font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--accent)}
.card p{margin:0 0 14px;color:var(--muted);font-size:11.5px;line-height:1.6}
.card .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
#toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);background:var(--ink);color:#F7F2E8;border:0;border-radius:20px;padding:9px 18px;font-size:12px;opacity:0;transition:opacity .18s;pointer-events:none;z-index:60;box-shadow:0 6px 24px #0000003d}
#toast.on{opacity:1}

/* layers panel */
.lyr{display:flex;align-items:center;gap:5px;padding:3px 4px;border:1px solid transparent;border-radius:5px;margin-bottom:2px}
.lyr.on{border-color:var(--accent);background:var(--accent-dim)}
.lyrbtn{background:var(--field);border:1px solid var(--line2);color:var(--muted);border-radius:4px;width:22px;height:22px;
  font-size:11px;line-height:1;cursor:pointer;flex:0 0 auto;padding:0}
.lyrbtn:hover:not(:disabled){color:var(--accent);border-color:var(--accent)}
.lyrbtn:disabled{opacity:.3;cursor:default}
.lyrname{flex:1;min-width:0;background:var(--field);border:1px solid var(--line2);border-radius:4px;color:var(--ink);
  font-size:11.5px;padding:3px 6px;font-family:inherit}
.lyrname:disabled{background:transparent;border-color:transparent;color:var(--muted)}
.lyrn{font-family:var(--mono);font-size:10.5px;color:var(--muted);min-width:22px;text-align:right;cursor:pointer}

/* symbol picker */
.symgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.symbtn{display:flex;flex-direction:column;align-items:center;gap:3px;background:var(--field);border:1px solid var(--line2);
  border-radius:5px;padding:6px 3px;cursor:pointer;color:var(--muted)}
.symbtn:hover{color:var(--accent);border-color:var(--accent)}
.symbtn.on{color:var(--accent);border-color:var(--accent);background:var(--accent-dim)}
.symbtn svg{width:26px;height:26px;display:block}
.symbtn span{font-size:8.5px;letter-spacing:.04em;text-align:center;line-height:1.2}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast"></div>

<script type="text/babel" data-presets="react">
const {useState,useEffect,useRef} = React;

/* shared, trivially-identical helpers used by the shell */
const VERSION="v5";

/* Only three font families survive a PDF round-trip without embedding a whole
   typeface, so those are the three offered. Everything maps cleanly onto the
   PDF standard-14 set, bold/italic included. */
const FONTS=[
  {k:"sans",  name:"Helvetica / Arial", css:"Helvetica, Arial, sans-serif"},
  {k:"serif", name:"Times",             css:"'Times New Roman', Times, serif"},
  {k:"mono",  name:"Courier",           css:"'Courier New', Courier, monospace"}
];
const FONTCSS={sans:FONTS[0].css, serif:FONTS[1].css, mono:FONTS[2].css};
function fontCssOf(st){ return FONTCSS[(st&&st.font)||"sans"] || FONTCSS.sans; }
/* Guess a family from whatever PDF.js reports, so retyped text keeps its look. */
function guessFamily(name){
  const n=String(name||"").toLowerCase();
  if(/courier|mono|consol/.test(n)) return "mono";
  if(/times|serif|georgia|garamond|book|roman|minion|cambria/.test(n) && !/sans/.test(n)) return "serif";
  return "sans";
}
function guessBold(name){ return /bold|black|heavy|semib|demi/.test(String(name||"").toLowerCase()); }
function guessItalic(name){ return /italic|oblique/.test(String(name||"").toLowerCase()); }
function toastMsg(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("on");
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("on"),2200); }

/* =====================================================================
   REDLINE — PDF markup & measurement (isolated module, own closure)
   ===================================================================== */
const RedlineApp = (function(){
const PDFJS = window.pdfjsLib;
PDFJS.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const {PDFDocument, rgb, StandardFonts, degrees} = window.PDFLib;

const uid = () => Math.random().toString(36).slice(2,10);
const UNITS=["ft","in","m","cm","mm","yd","mi","km"];
const DEFSCALE={factor:1/72, unit:"in", prec:2};
function dist(a,b){ return Math.hypot(b[0]-a[0], b[1]-a[1]); }
function polyLen(p,closed){ let L=0; for(let i=0;i<p.length-1;i++) L+=dist(p[i],p[i+1]); if(closed&&p.length>2) L+=dist(p[p.length-1],p[0]); return L; }
function polyArea(p){ let a=0; for(let i=0;i<p.length;i++){const q=p[(i+1)%p.length]; a+=p[i][0]*q[1]-q[0]*p[i][1];} return Math.abs(a)/2; }
function bbox(p){ const xs=p.map(q=>q[0]), ys=p.map(q=>q[1]); return [Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys)]; }
function boxesOverlap(a,b){ return !(a[2]<b[0] || a[0]>b[2] || a[3]<b[1] || a[1]>b[3]); }
function boxInside(inner,outer){ return inner[0]>=outer[0] && inner[1]>=outer[1] && inner[2]<=outer[2] && inner[3]<=outer[3]; }
function fmtLen(lenPt,s){ return (lenPt*s.factor).toFixed(s.prec)+" "+s.unit; }
function fmtArea(aPt,s){ return (aPt*s.factor*s.factor).toFixed(s.prec)+" sq "+s.unit; }
function hex2rgb(h){ h=h.replace("#",""); if(h.length===3) h=h.split("").map(c=>c+c).join(""); return [parseInt(h.slice(0,2),16)/255,parseInt(h.slice(2,4),16)/255,parseInt(h.slice(4,6),16)/255]; }
function ptsToD(p,close){ if(!p.length) return ""; return "M "+p.map(q=>q[0].toFixed(2)+" "+q[1].toFixed(2)).join(" L ")+(close?" Z":""); }
function snapAngle(a,b){ const dx=b[0]-a[0], dy=b[1]-a[1]; const ang=Math.round(Math.atan2(dy,dx)/(Math.PI/12))*(Math.PI/12), L=Math.hypot(dx,dy);
  return [a[0]+L*Math.cos(ang), a[1]+L*Math.sin(ang)]; }
function wrapLines(text,size,maxW){
  const c = wrapLines._c || (wrapLines._c = document.createElement("canvas").getContext("2d"));
  c.font = size+"px Helvetica, Arial, sans-serif";
  const out=[];
  (text||"").split("\n").forEach(para=>{
    if(!para){ out.push(""); return; }
    let line="";
    para.split(/\s+/).forEach(w=>{ const t=line? line+" "+w : w;
      if(c.measureText(t).width>maxW && line){ out.push(line); line=w; } else line=t; });
    out.push(line);
  });
  return out;
}
function cloudPoints(pts,r,closed){
  let poly=pts.slice();
  if(closed && poly.length>2){ let a=0; for(let i=0;i<poly.length;i++){const q=poly[(i+1)%poly.length]; a+=poly[i][0]*q[1]-q[0]*poly[i][1];} if(a<0) poly.reverse(); }
  const out=[]; const n=closed?poly.length:poly.length-1; const SEG=9;
  for(let i=0;i<n;i++){
    const p=poly[i], q=poly[(i+1)%poly.length]; const dx=q[0]-p[0], dy=q[1]-p[1], L=Math.hypot(dx,dy);
    if(L<0.01) continue;
    const count=Math.max(1,Math.round(L/(r*2))), step=L/count, ux=dx/L, uy=dy/L, rad=step/2;
    for(let k=0;k<count;k++){
      const cx=p[0]+ux*step*(k+0.5), cy=p[1]+uy*step*(k+0.5), a0=Math.atan2(-uy,-ux);
      for(let s=0;s<=SEG;s++){ const ang=a0-Math.PI*(s/SEG); out.push([cx+rad*Math.cos(ang), cy+rad*Math.sin(ang)]); }
    }
  }
  return out;

function ellipsePoints(p0,p1,n){

      if(P.length>=3){

        let d=a2-a1; while(d>Math.PI)d-=2*Math.PI; while(d<-Math.PI)d+=2*Math.PI;
        const r=Math.min(34,dist(v,P[0])*0.5,dist(v,P[2])*0.5), arc=[];
        for(let i=0;i<=24;i++){ const t=a1+d*i/24; arc.push([v[0]+r*Math.cos(t),v[1]+r*Math.sin(t)]); }
        out.strokes.push({pts:arc,closed:false});
        const mid=a1+d/2;
        out.texts.push({x:v[0]+(r+13)*Math.cos(mid),y:v[1]+(r+13)*Math.sin(mid),size:st.fontSize,color:st.stroke,
          center:true,badge:true,lines:[(Math.abs(d)*180/Math.PI).toFixed(1)+"\u00B0"]});
      }
      break; }
    case "stamp": {
      const [x0,y0,x1,y1]=bbox(P); const r=[[x0,y0],[x1,y0],[x1,y1],[x0,y1]];
      if(st.filled) out.fills.push({pts:r,color:st.fill,op:st.fillOpacity});
      if(st.width>0) out.strokes.push({pts:r,closed:true});
      out.texts.push({x:(x0+x1)/2,y:(y0+y1)/2+st.fontSize*0.35,size:st.fontSize,color:st.stroke,
        center:true,lines:[a.text||"STAMP"]});
      break; }
    case "symbol": {
      const [x0,y0,x1,y1]=bbox(P); const w=(x1-x0)||1, h=(y1-y0)||1;
      const S=SYMBOLS[a.sym]||SYMBOLS.north;
      const M=q=>[x0+q[0]*w, y0+q[1]*h];
      S.paths.forEach(pp=>{ const pts=pp.pts.map(M);
        if(pp.fill) out.fills.push({pts,color:st.stroke,op:st.opacity});
        else out.strokes.push({pts,closed:!!pp.closed}); });
      (S.texts||[]).forEach(t=> out.texts.push({x:x0+t.x*w, y:y0+t.y*h, size:st.fontSize,
        color:st.stroke, center:true, lines:[t.s]}));
      break; }
    case "ptext": {
      const [x0,y0,x1,y1]=bbox(P);
      const line=(a.text||"").split("\n")[0];
      const xE=Math.max(x1, x0+measureTextW(line,st.fontSize,st));
      out.fills.push({pts:[[x0-1.5,y0-1.5],[xE+2.5,y0-1.5],[xE+2.5,y1+2],[x0-1.5,y1+2]],
        color:st.fill,op:st.fillOpacity});
      if(st.width>0) out.strokes.push({pts:[[x0,y0],[xE,y0],[xE,y1],[x0,y1]],closed:true});
      out.texts.push({x:x0,y:y1,size:st.fontSize,color:st.stroke,lines:[line],
        font:st.font,bold:st.bold,italic:st.italic,underline:st.underline,strike:st.strike});
      break; }
  }
  /* Every text run inherits the markup's font flags unless it set its own. */
  out.texts.forEach(t=>{ if(t.font===undefined){ t.font=st.font; t.bold=st.bold; t.italic=st.italic; } });
  /* Rotation. Outlines and fills are rotated point-by-point, but text keeps its
     upright anchor and carries the angle + true centre instead — the renderer
     and the PDF writer both spin the glyphs about that centre, so the letters
     actually turn with the box rather than sliding around it. */
  const rotA=(st.rotation||0)*Math.PI/180;
  if(rotA){
    const c=bbCenter(P), R=q=>rotPt(q,c[0],c[1],rotA);
    out.strokes.forEach(s2=>{ s2.pts=s2.pts.map(R); });
    out.fills.forEach(f=>{ f.pts=f.pts.map(R); });
    out.arrows=out.arrows.map(t=>t.map(R));
    out.texts.forEach(t=>{ t.rot={a:st.rotation||0, cx:c[0], cy:c[1]}; });
  }
  return out;
}
function toPdf(p,rot,Wu,Hu){
  switch(rot){ case 90: return [p[1],p[0]]; case 180: return [Wu-p[0],p[1]]; case 270: return [Wu-p[1],Hu-p[0]]; default: return [p[0],Hu-p[1]]; }
}
function pdfPath(pts,rot,Wu,Hu,close){ const q=pts.map(p=>{ const t=toPdf(p,rot,Wu,Hu); return t[0].toFixed(2)+","+(-t[1]).toFixed(2); });
  return "M "+q.join(" L ")+(close?" Z":""); }

function ToolIcon({name}){ return <svg viewBox="0 0 24 24" dangerouslySetInnerHTML={{__html: ICON[name]}}></svg>; }
/* The little key chip that appears on a button while Alt is held down. */
function KB({k,on}){ return (on && k) ? <span className="kbadge">{k}</span> : null; }

/* Right-click menu. Closes on any outside pointer press, Escape, scroll or
   window resize, and clamps itself inside the viewport. */
function ContextMenu({x,y,head,items,onClose}){
  const ref=useRef(null);
  const [pos,setPos]=useState({left:x,top:y});
  useEffect(()=>{
    const el=ref.current;
    if(el){
      const r=el.getBoundingClientRect();
      const vw=window.innerWidth, vh=window.innerHeight;
      setPos({ left:Math.max(6,Math.min(x, vw-r.width-6)),
               top: Math.max(6,Math.min(y, vh-r.height-6)) });
    }
    const away=ev=>{ if(!ref.current||!ref.current.contains(ev.target)) onClose(); };
    const key=ev=>{ if(ev.key==="Escape"){ ev.stopPropagation(); onClose(); } };
    document.addEventListener("pointerdown",away,true);
    document.addEventListener("keydown",key,true);
    window.addEventListener("resize",onClose);
    window.addEventListener("wheel",onClose,{passive:true});
    return ()=>{
      document.removeEventListener("pointerdown",away,true);
      document.removeEventListener("keydown",key,true);
      window.removeEventListener("resize",onClose);
      window.removeEventListener("wheel",onClose);
    };
  },[x,y]);
  return (
    <div className="ctxmenu" ref={ref} style={pos} onContextMenu={e=>e.preventDefault()}>
      {head && <div className="chead">{head}</div>}
      {items.map((it,i)=> it.sep
        ? <div className="csep" key={"s"+i}/>
        : <button key={i} disabled={!!it.off} onClick={()=>{ onClose(); it.go&&it.go(); }}>
            <span>{it.t}</span>{it.k && <span className="k">{it.k}</span>}
          </button>)}
    </div>
  );
}

function App(){

  const [fname,setFname]=useState("");
  const [current,setCurrent]=useState(1);
  const [zoom,setZoom]=useState(1);
  const [viewRot,setViewRot]=useState(0);
  const [tool,setTool]=useState("select");
  const [ann,setAnn]=useState([]);
  const [scales,setScales]=useState({});
  const [selIds,setSelIds]=useState([]);
  const [draft,setDraft]=useState(null);
  const [style,setStyle]=useState(DEFSTYLE);
  const [lockTool,setLockTool]=useState(true);   /* sticky tools, Bluebeam-style */
  const [author,setAuthor]=useState("");
  const [tab,setTab]=useState("props");
  const [coord,setCoord]=useState("—");
  const [undoStack,setUndoStack]=useState([]);
  const [redoStack,setRedoStack]=useState([]);
  const [calModal,setCalModal]=useState(null);
  const [saving,setSaving]=useState(false);
  const [editing,setEditing]=useState(null);
  const [layers,setLayers]=useState([{name:"Default",visible:true,locked:false}]);
  const [activeLayer,setActiveLayer]=useState("Default");
  const [grid,setGrid]=useState({on:false,snap:false,size:36});
  const [tolerance,setTolerance]=useState(28);
  const [stampText,setStampText]=useState("APPROVED");
  const [symKey,setSymKey]=useState("north");
  const [textItems,setTextItems]=useState([]);
  const [batchModal,setBatchModal]=useState(false);
  const [ctx,setCtx]=useState(null);   /* right-click menu: {x,y,hasSel} */
  const hadSelRef=useRef(0);

  const fileInputRef=useRef(null), layerInputRef=useRef(null), bytesRef=useRef(null), dragRef=useRef(null), finishRef=useRef(null);
  const viewerRef=useRef(null);
  const fmtRef=useRef(null);                    /* the look the format painter is holding */
  const [fmtArmed,setFmtArmed]=useState(false);
  const [altHint,setAltHint]=useState(false);   /* Alt held \u2192 flash every shortcut */
  const curScale = scales[current] || DEFSCALE;
  const selAnns = ann.filter(a=>selIds.includes(a.id));
  const one = selAnns.length===1 ? selAnns[0] : null;

  /* ------------------------------------------------------------------
     HISTORY
     A change is recorded as the state BEFORE it happened. Atomic actions
     call pushHistory() up front; continuous actions (drag, slider, typing)
     call beginChange() on the first event and commitChange() when they
     settle, so one drag = one undo step and undo actually reverses it.
     ------------------------------------------------------------------ */
  const HISTMAX=200;
  const pendRef=useRef(null);      // pre-change snapshot for a continuous edit
  const commitTRef=useRef(null);   // debounce timer for commitChange

  function beginChange(){
    if(pendRef.current===null) pendRef.current=JSON.stringify({ann,scales});
  }
  function commitChange(){
    clearTimeout(commitTRef.current);
    const snap=pendRef.current;
    if(snap===null) return;
    pendRef.current=null;
    setUndoStack(u=>[...u.slice(-(HISTMAX-1)), snap]);
    setRedoStack([]);
  }
  function commitChangeSoon(ms){
    clearTimeout(commitTRef.current);
    commitTRef.current=setTimeout(commitChange, ms||400);
  }
  function cancelChange(){ clearTimeout(commitTRef.current); pendRef.current=null; }

  function pushHistory(prevAnn,prevScales){
    commitChange();  // never let a pending continuous edit jump the queue
    const snap=JSON.stringify({ann:prevAnn!==undefined?prevAnn:ann, scales:prevScales!==undefined?prevScales:scales});
    setUndoStack(u=>[...u.slice(-(HISTMAX-1)), snap]);
    setRedoStack([]);
  }
  function undo(){
    commitChange();
    setUndoStack(u=>{
      if(!u.length) return u;
      const snap=u[u.length-1];
      const o=JSON.parse(snap);
      setRedoStack(r=>[...r.slice(-(HISTMAX-1)), JSON.stringify({ann,scales})]);
      setAnn(o.ann); setScales(o.scales); setEditing(null);
      setSelIds(ids=>ids.filter(id=>o.ann.some(a=>a.id===id)));
      return u.slice(0,-1);
    });
  }
  function redo(){
    setRedoStack(r=>{
      if(!r.length) return r;
      const snap=r[r.length-1];
      const o=JSON.parse(snap);
      setUndoStack(u=>[...u.slice(-(HISTMAX-1)), JSON.stringify({ann,scales})]);
      setAnn(o.ann); setScales(o.scales); setEditing(null);
      setSelIds(ids=>ids.filter(id=>o.ann.some(a=>a.id===id)));
      return r.slice(0,-1);
    });
  }

  async function handleFile(file){
    try{
      const buf=await file.arrayBuffer(); const bytes=new Uint8Array(buf);
      bytesRef.current=bytes.slice();
      const pdf=await PDFJS.getDocument({data:bytes.slice()}).promise;
      const meta=[];
      for(let i=1;i<=pdf.numPages;i++){
        const page=await pdf.getPage(i); const vp=page.getViewport({scale:1});
        meta.push({num:i,width:vp.width,height:vp.height,rotate:page.rotate||0,pageObj:page});
      }
      setDoc(pdf); setPageMeta(meta); setFname(file.name);
      setAnn([]); setScales({}); setSelIds([]); setUndoStack([]); setRedoStack([]);
      setCurrent(1); setZoom(1); setViewRot(0); setEditing(null);
      toastMsg("Loaded "+file.name+" — "+pdf.numPages+" pages");
    }catch(err){ toastMsg("Could not open that PDF: "+err.message); }
  }
  function onFileChange(e){ const f=e.target.files[0]; if(f) handleFile(f); e.target.value=""; }
  function onDrop(e){ e.preventDefault(); const f=e.dataTransfer.files[0]; if(f&&f.type==="application/pdf") handleFile(f); }

  function chooseTool(t){
    commitChange();
    const carry = (t==="format" && selIds.length===1) ? selIds[0] : null;
    setTool(t); setDraft(null); setEditing(null); if(t!=="select") setSelIds([]);
    if(t==="format"){
      if(carry) grabFormat(carry);
      else if(fmtRef.current) toastMsg("Format painter loaded \u2014 click markups to paint, Esc to empty it");
      else toastMsg("Click a markup to pick up its look, then click others to paint it on");
    }
    if(t==="textedit") toastMsg(textItems.length
      ? textItems.length+" editable lines \u2014 click one (or just double-click text with Select)"
      : "No editable text layer on this page");
  }

  /* Extract page text once per page (used by both Select double-click and the
     Edit PDF Text tool). Contiguous runs sharing a baseline are merged into one
     editable line so that deleting characters reflows the whole sentence. */
  useEffect(()=>{
    let dead=false;
    const pm=pageMeta[current-1];
    if(!pm){ setTextItems([]); return; }
    (async()=>{
      try{
        const vp=pm.pageObj.getViewport({scale:1});
        const tc=await pm.pageObj.getTextContent();
        const U=PDFJS.Util;
        const styles=tc.styles||{};
        const raw=tc.items.filter(it=>it.str && it.str.trim()).map(it=>{
          const m=U.transform(vp.transform,it.transform);
          const h=Math.hypot(m[2],m[3])||Math.abs(m[3])||10;
          /* Whatever PDF.js can tell us about the original typeface, so the
             replacement text comes back in the same family rather than
             defaulting to Helvetica every time. */
          const sty=styles[it.fontName]||{};
          const nm=(sty.fontFamily||"")+" "+(it.fontName||"");
          const w=it.width || measureTextW(it.str,h,{font:guessFamily(nm)});
          return {str:it.str, x:m[4], y:m[5], w, h,
                  font:guessFamily(nm), bold:guessBold(nm), italic:guessItalic(nm)};
        });
        raw.sort((a,b)=> (a.y-b.y) || (a.x-b.x));
        const lines=[];
        raw.forEach(it=>{
          const L=lines[lines.length-1];
          if(L){
            const last=L.runs[L.runs.length-1];
            const sameBase=Math.abs(it.y-L.y) <= Math.max(1.2, L.h*0.30);
            const sizeOk=Math.abs(it.h-L.h) <= L.h*0.28;
            const gap=it.x-(last.x+last.w);
            if(sameBase && sizeOk && gap > -L.h*0.6 && gap < L.h*0.62){
              const needSpace = gap > L.h*0.10 && !/\s$/.test(L.str) && !/^\s/.test(it.str);
              L.str += (needSpace?" ":"") + it.str;
              L.runs.push(it);
              L.w = Math.max(L.w, (it.x+it.w) - L.x);
              return;
            }
          }
          lines.push({str:it.str, x:it.x, y:it.y, w:it.w, h:it.h, runs:[it],
                      font:it.font, bold:it.bold, italic:it.italic});
        });
        if(!dead) setTextItems(lines);
      }catch(err){ if(!dead) setTextItems([]); }
    })();
    return ()=>{ dead=true; };
  },[current,pageMeta]);

  function addAnnotation(a){
    pushHistory(ann,scales);
    const withLayer={...a, layer:a.layer||activeLayer};
    setAnn(prev=>[...prev,withLayer]); setSelIds([withLayer.id]);
    if(!lockTool && a.type!=="ptext") setTool("select");
    if(a.type==="text"||a.type==="callout"||a.type==="ptext"){ setEditing(a.id); if(a.type!=="ptext") setTab("props"); }
  }
  function addLayer(){
    let n=1, name;
    do{ name="Layer "+n++; }while(layers.some(l=>l.name===name));

  }
  function removeLayer(name){
    if(name==="Default"){ toastMsg("The Default layer can't be removed"); return; }
    pushHistory(ann,scales);
    setAnn(prev=>prev.map(a=> a.layer===name ? {...a,layer:"Default"} : a));
    setLayers(ls=>ls.filter(l=>l.name!==name));
    if(activeLayer===name) setActiveLayer("Default");
  }
  function renameLayer(oldName,newName){
    newName=(newName||"").trim();
    if(!newName || newName===oldName || oldName==="Default") return;
    if(layers.some(l=>l.name===newName)){ toastMsg("A layer with that name already exists"); return; }
    pushHistory(ann,scales);
    setAnn(prev=>prev.map(a=> a.layer===oldName ? {...a,layer:newName} : a));
    setLayers(ls=>ls.map(l=> l.name===oldName ? {...l,name:newName} : l));
    if(activeLayer===oldName) setActiveLayer(newName);
  }
  function moveSelectionToLayer(name){
    if(!selIds.length) return;
    pushHistory(ann,scales);
    setAnn(prev=>prev.map(a=> selIds.includes(a.id) ? {...a,layer:name} : a));
    toastMsg(selIds.length+" markup"+(selIds.length===1?"":"s")+" moved to "+name);
  }
  function batchCopy(from,to){
    const src=(selIds.length? ann.filter(a=>selIds.includes(a.id)) : ann.filter(a=>a.page===current));
    if(!src.length){ toastMsg("Nothing to copy"); return; }
    const lo=Math.max(1,Math.min(from,to)), hi=Math.min(pageMeta.length,Math.max(from,to));

    for(let p=lo;p<=hi;p++){
      if(src.every(a=>a.page===p)) continue;
      src.forEach(a=>{ const c=JSON.parse(JSON.stringify(a)); c.id=uid(); c.page=p; copies.push(c); });
    }
    if(!copies.length){ toastMsg("No pages to copy onto"); return; }
    pushHistory(ann,scales);
    setAnn(prev=>[...prev,...copies]);
    toastMsg(copies.length+" markups copied across pages "+lo+"\u2013"+hi);

  function applyStyleToSelection(k,v){

  function deleteSelection(){

  }
  function pasteFormat(){

    if(!selIds.length){ toastMsg("Select the markups to paint"); return; }
    applyFormat(selIds);
  }
  function clearFormat(){ fmtRef.current=null; setFmtArmed(false); toastMsg("Format painter emptied"); }
  /* Clicking a markup with the painter active: the first click fills the brush,
     every click after that paints. */
  function onFormatClick(id){
    if(!fmtRef.current){ grabFormat(id); return; }

  }

  function openCtx(clientX,clientY,hasSel){ setCtx({x:clientX,y:clientY,hasSel:!!hasSel}); }

  /* Selecting something pulls the Properties tab forward, the way a docked
     properties panel would. Layers is left alone because "move selection to
     layer" is an action you perform there with a selection already made. */
  useEffect(()=>{
    if(selIds.length && !hadSelRef.current && tab!=="layers") setTab("props");
    hadSelRef.current=selIds.length;
  },[selIds]);

  /* ---- stacking order (paint order == array order) ---- */
  function reorderSelection(mode){
    if(!selIds.length){ toastMsg("Select a markup first"); return; }
    pushHistory(ann,scales);
    setAnn(prev=>{
      const sel=prev.filter(a=>selIds.includes(a.id));
      const rest=prev.filter(a=>!selIds.includes(a.id));
      if(mode==="front") return [...rest,...sel];
      if(mode==="back")  return [...sel,...rest];
      const arr=prev.slice();
      if(mode==="forward"){
        for(let i=arr.length-2;i>=0;i--)
          if(selIds.includes(arr[i].id) && !selIds.includes(arr[i+1].id)){ const t=arr[i]; arr[i]=arr[i+1]; arr[i+1]=t; }
      }else{
        for(let i=1;i<arr.length;i++)
          if(selIds.includes(arr[i].id) && !selIds.includes(arr[i-1].id)){ const t=arr[i]; arr[i]=arr[i-1]; arr[i-1]=t; }
      }
      return arr;
    });
    toastMsg(mode==="front"?"Brought to front":mode==="back"?"Sent to back":mode==="forward"?"Brought forward":"Sent backward");
  }

  /* ---- clipboard (in-app, survives page switches) ---- */
  const clipRef=useRef([]);
  function copySelection(quiet){
    if(!selIds.length) return false;
    clipRef.current=ann.filter(a=>selIds.includes(a.id)).map(a=>JSON.parse(JSON.stringify(a)));
    if(!quiet) toastMsg(clipRef.current.length+" copied");
    return true;
  }
  function cutSelection(){ if(copySelection(true)){ const k=selIds.length; deleteSelection(); toastMsg(k+" cut"); } }
  function pasteClipboard(){
    if(!clipRef.current.length){ toastMsg("Clipboard is empty"); return; }
    pushHistory(ann,scales);
    const copies=clipRef.current.map(a=>{
      const c=JSON.parse(JSON.stringify(a)); c.id=uid(); c.page=current;
      c.pts=c.pts.map(p=>[p[0]+16,p[1]+16]); return c; });
    setAnn(prev=>[...prev,...copies]);
    setSelIds(copies.map(c=>c.id)); setTool("select");
    toastMsg(copies.length+" pasted onto page "+current);
  }

  function setText(id,v){
    beginChange();
    setAnn(prev=>prev.map(a=> a.id===id ? {...a, text:v} : a));
    commitChangeSoon(600);
  }
  /* leaving the inline editor settles the undo step immediately */
  function setEditingCommit(v){ if(v===null) commitChange(); setEditing(v); }

  /* Mouse wheel zooms about the pointer, so whatever is under the cursor stays
     under the cursor. Shift+wheel falls back to plain scrolling. The listener is
     attached natively because React registers wheel handlers passively, which
     would make preventDefault silently do nothing. */
  useEffect(()=>{
    const el=viewerRef.current; if(!el) return;
    function onWheel(e){
      if(e.shiftKey) return;

      const cx=px+el.scrollLeft, cy=py+el.scrollTop;
      const step=e.deltaY<0 ? 1.12 : 1/1.12;
      setZoom(z=>{
        const nz=Math.max(0.1,Math.min(8,z*step));
        if(Math.abs(nz-z)<1e-6) return z;
        const k=nz/z;
        requestAnimationFrame(()=>{ el.scrollLeft=cx*k-px; el.scrollTop=cy*k-py; });
        return nz;
      });
    }
    el.addEventListener("wheel",onWheel,{passive:false});
    return ()=>el.removeEventListener("wheel",onWheel);
  },[]);

  /* Hold Alt and every button shows the key that fires it. */
  useEffect(()=>{
    function down(e){ if(e.key==="Alt"){ e.preventDefault(); setAltHint(true); } }
    function up(e){ if(e.key==="Alt") setAltHint(false); }
    function off(){ setAltHint(false); }
    window.addEventListener("keydown",down);
    window.addEventListener("keyup",up);
    window.addEventListener("blur",off);
    return ()=>{ window.removeEventListener("keydown",down);
      window.removeEventListener("keyup",up); window.removeEventListener("blur",off); };
  },[]);

  useEffect(()=>{
    function onKey(e){
      /* While an inline text editor is open it owns the keyboard completely:
         Delete/Backspace/Escape/Enter must reach the caret, not the app. */
      if(editing) return;
      const ae=document.activeElement;
      const typing=/^(INPUT|TEXTAREA|SELECT)$/.test((ae&&ae.tagName)||"") || !!(ae&&ae.isContentEditable);
      const mod=e.ctrlKey||e.metaKey;
      const k=(e.key||"").toLowerCase();

      /* Ctrl-combinations are suppressed inside form fields so the browser's
         own text editing (undo, select-all, paste) keeps working there. */
      if(mod && !typing){
        if(k==="z"){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
        if(k==="y"){ e.preventDefault(); redo(); return; }
        if(k==="a" && doc){ e.preventDefault(); setTool("select");
          setSelIds(ann.filter(a=>a.page===current).map(a=>a.id)); return; }
        if(k==="d" && selIds.length){ e.preventDefault(); duplicateSelection(); return; }
        if(k==="c" && e.shiftKey){ e.preventDefault(); copyFormat(); return; }
        if(k==="v" && e.shiftKey){ e.preventDefault(); pasteFormat(); return; }
        if(k==="o"){ e.preventDefault(); fileInputRef.current.click(); return; }
        if(k==="s" && doc){ e.preventDefault(); saveAsPdf(); return; }
        if(k==="c" && selIds.length){ e.preventDefault(); copySelection(); return; }
        if(k==="x" && selIds.length){ e.preventDefault(); cutSelection(); return; }
        if(k==="v"){ e.preventDefault(); pasteClipboard(); return; }
        if(e.key==="]"||e.key==="}"){ e.preventDefault(); reorderSelection(e.shiftKey?"front":"forward"); return; }
        if(e.key==="["||e.key==="{"){ e.preventDefault(); reorderSelection(e.shiftKey?"back":"backward"); return; }
        if(k==="0"){ e.preventDefault(); setZoom(1); return; }
        if(e.key==="="||e.key==="+"){ e.preventDefault(); setZoom(z=>Math.min(8,z*1.25)); return; }
        if(e.key==="-"||e.key==="_"){ e.preventDefault(); setZoom(z=>Math.max(0.1,z/1.25)); return; }
        return;
      }
      if(typing || mod) return;

      /* Escape unwinds one layer at a time rather than throwing everything away */
      if(e.key==="Escape"){
        if(tool==="format" && fmtRef.current){ clearFormat(); return; }
        if(draft){ setDraft(null); return; }
        if(selIds.length){ setSelIds([]); return; }
        if(tool!=="select") chooseTool("select");
        return;
      }
      if(e.key==="Enter" && draft && finishRef.current){ e.preventDefault(); finishRef.current(); return; }
      if((e.key==="Delete"||e.key==="Backspace") && selIds.length){ e.preventDefault(); deleteSelection(); return; }
      if(e.key==="PageDown"){ e.preventDefault(); setCurrent(c=>Math.min(pageMeta.length||1,c+1)); setSelIds([]); return; }
      if(e.key==="PageUp"){ e.preventDefault(); setCurrent(c=>Math.max(1,c-1)); setSelIds([]); return; }
      if(TOOLKEY[k] && !e.altKey){ e.preventDefault(); chooseTool(TOOLKEY[k]); return; }
      if(selIds.length && e.key.startsWith("Arrow")){
        e.preventDefault();
        const d=e.shiftKey?10:1;
        const dx=e.key==="ArrowLeft"?-d:e.key==="ArrowRight"?d:0, dy=e.key==="ArrowUp"?-d:e.key==="ArrowDown"?d:0;
        beginChange();
        setAnn(prev=>prev.map(a=> selIds.includes(a.id)? {...a,pts:a.pts.map(p=>[p[0]+dx,p[1]+dy])} : a));
        commitChangeSoon(500);
      }
    }
    window.addEventListener("keydown",onKey);
    return ()=>window.removeEventListener("keydown",onKey);
  },[selIds,ann,scales,undoStack,redoStack,draft,doc,current,editing,tool,pageMeta]);

  function dl(blob,name){ const u=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=u; a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(u),4000); }

  async function saveAsPdf(){
    if(!bytesRef.current) return;
    setSaving(true);
    try{
      const pdf=await PDFDocument.load(bytesRef.current,{ignoreEncryption:true});
      /* Fonts are embedded on demand and cached, so a sheet that only uses
         Helvetica never carries Times or Courier along for the ride. */
      const FMAP={
        sans: {"":"Helvetica","B":"HelveticaBold","I":"HelveticaOblique","BI":"HelveticaBoldOblique"},
        serif:{"":"TimesRoman","B":"TimesRomanBold","I":"TimesRomanItalic","BI":"TimesRomanBoldItalic"},
        mono: {"":"Courier","B":"CourierBold","I":"CourierOblique","BI":"CourierBoldOblique"}
      };
      const fontCache={};
      async function fontFor(t){
        const fam=(t&&t.font)||"sans", sfx=((t&&t.bold)?"B":"")+((t&&t.italic)?"I":"");
        const key=fam+"|"+sfx;
        if(!fontCache[key]){
          const nm=(FMAP[fam]||FMAP.sans)[sfx]||"Helvetica";
          fontCache[key]=await pdf.embedFont(StandardFonts[nm]||StandardFonts.Helvetica);
        }
        return fontCache[key];
      }
      const pages=pdf.getPages();
      for(const a of ann){
        const pg=pages[a.page-1]; if(!pg) continue;
        const {width:Wu,height:Hu}=pg.getSize();
        const rot=((pg.getRotation().angle%360)+360)%360;
        const st=Object.assign({},DEFSTYLE,a.style), col=rgb(...hex2rgb(st.stroke));
        const G=geom({...a, scale:scales[a.page]||DEFSCALE});
        G.fills.forEach(f=> pg.drawSvgPath(pdfPath(f.pts,rot,Wu,Hu,true),{x:0,y:0,scale:1,color:rgb(...hex2rgb(f.color)),opacity:f.op,borderWidth:0}));
        G.strokes.forEach(s=>{ if(s.pts.length<2||st.width<=0) return;
          pg.drawSvgPath(pdfPath(s.pts,rot,Wu,Hu,s.closed),{x:0,y:0,scale:1,borderColor:col,borderWidth:st.width,
            borderOpacity:st.opacity,borderLineCap:1,borderDashArray: st.dash?[st.dash*3,st.dash*2]:undefined}); });
        G.arrows.forEach(t=> pg.drawSvgPath(pdfPath(t,rot,Wu,Hu,true),{x:0,y:0,scale:1,color:col,opacity:st.opacity,borderWidth:0}));
        for(const t of G.texts){
          const tf=await fontFor(t);
          const rA=t.rot? t.rot.a : 0, rad=rA*Math.PI/180;
          const place=q=> t.rot ? rotPt(q,t.rot.cx,t.rot.cy,rad) : q;
          if(t.badge){
            const w=Math.max(...t.lines.map(l=>tf.widthOfTextAtSize(l,t.size)))+8, h=t.lines.length*t.size*1.2+5;
            const x0=t.x-(t.center?w/2:0), y0=t.y-(t.center?h/2:0);
            pg.drawSvgPath(pdfPath([[x0,y0],[x0+w,y0],[x0+w,y0+h],[x0,y0+h]].map(place),rot,Wu,Hu,true),
              {x:0,y:0,scale:1,color:rgb(1,1,1),opacity:0.86,borderColor:col,borderWidth:0.5,borderOpacity:0.5});
          }
          const tcol=rgb(...hex2rgb(t.color));
          t.lines.forEach((ln,i)=>{
            if(!ln) return;
            const y=t.badge&&t.center ? t.y-(t.lines.length*t.size*1.2)/2+t.size*0.95+i*t.size*1.2 : t.y+i*t.size*1.2;
            const w=tf.widthOfTextAtSize(ln,t.size);
            const mid = t.center || t.align==="center", right = !t.center && t.align==="right";
            const x = mid ? t.x-w/2 : right ? t.x-w : t.x;
            const D=toPdf(place([x,y]),rot,Wu,Hu);
            pg.drawText(ln,{x:D[0],y:D[1],size:t.size,font:tf,color:tcol,opacity:st.opacity,rotate:degrees(rot-rA)});
            /* underline / strike-through are drawn as hairline bars so they
               rotate and export exactly like the glyphs above them */
            if(t.underline||t.strike){
              const bar=(off)=>{
                const th=Math.max(0.5,t.size*0.06);
                const q1=place([x,y+off]), q2=place([x+w,y+off]);
                const dx=q2[0]-q1[0], dy=q2[1]-q1[1], L=Math.hypot(dx,dy)||1;
                const ux=-dy/L*th/2, uy=dx/L*th/2;
                pg.drawSvgPath(pdfPath([[q1[0]-ux,q1[1]-uy],[q2[0]-ux,q2[1]-uy],[q2[0]+ux,q2[1]+uy],[q1[0]+ux,q1[1]+uy]],rot,Wu,Hu,true),
                  {x:0,y:0,scale:1,color:tcol,opacity:st.opacity,borderWidth:0});
              };
              if(t.underline) bar(t.size*0.17);
              if(t.strike)    bar(-t.size*0.28);
            }
          });
        }
      }
      dl(new Blob([await pdf.save()],{type:"application/pdf"}), fname.replace(/\.pdf$/i,"")+"-markup.pdf");
      toastMsg("Saved "+ann.length+" markups into a new PDF");
    }catch(err){ toastMsg("Save failed: "+err.message); console.error(err); }
    setSaving(false);
  }
  function saveLayer(){
    if(!ann.length && !Object.keys(scales).length){ toastMsg("Nothing to save yet"); return; }
    dl(new Blob([JSON.stringify({v:2,file:fname,ann,scales,layers},null,1)],{type:"application/json"}), fname.replace(/\.pdf$/i,"")+".markup.json");
  }
  async function loadLayer(e){
    const f=e.target.files[0]; if(!f) return;
    try{ const o=JSON.parse(await f.text()); pushHistory(ann,scales);
      const incoming=o.ann||[];
      setAnn(incoming); setScales(o.scales||{}); setSelIds([]);
      const names=Array.from(new Set(incoming.map(a=>a.layer||"Default")));
      const restored=(o.layers&&o.layers.length)? o.layers.slice() : [{name:"Default",visible:true,locked:false}];
      names.forEach(n=>{ if(!restored.some(l=>l.name===n)) restored.push({name:n,visible:true,locked:false}); });
      if(!restored.some(l=>l.name==="Default")) restored.unshift({name:"Default",visible:true,locked:false});
      setLayers(restored); setActiveLayer("Default");
      toastMsg("Markup layer loaded ("+(o.ann||[]).length+")"); }
    catch(err){ toastMsg("That file isn't a Redline markup layer"); }
    e.target.value="";
  }
  function exportCsv(){
    const head="Page,Layer,Type,Subject,Author,Created,Measurement,Text\n";
    const body=ann.map(a=>{
      const sc=scales[a.page]||DEFSCALE; let m="";
      if(a.type==="mdist") m=fmtLen(polyLen(a.pts,false),sc);
      else if(a.type==="marea"||a.type==="polygon"||a.type==="rect") m=fmtArea(polyArea(a.type==="rect"?(function(){const b=bbox(a.pts);return [[b[0],b[1]],[b[2],b[1]],[b[2],b[3]],[b[0],b[3]]];})():a.pts),sc);
      const q=s=>'"'+String(s||"").replace(/"/g,'""')+'"';
      return [a.page,q(a.layer||"Default"),LABEL[a.type],q(a.subject),q(a.author),a.created,q(m),q(a.text)].join(",");
    }).join("\n");
    dl(new Blob([head+body],{type:"text/csv"}), fname.replace(/\.pdf$/i,"")+"-markups.csv");
  }

        <div className="sep"></div>

        <div className="mono" style={{minWidth:48,textAlign:"center"}}>{Math.round(zoom*100)}%</div>
        <button className="tb icon" title="Zoom in (Ctrl+=, or scroll the wheel up)" onClick={()=>setZoom(z=>Math.min(8,z*1.25))}>+<KB k="^+" on={altHint}/></button>
        <button className="tb" onClick={()=>setZoom(1)}>100%<KB k="^0" on={altHint}/></button>
        <button className="tb icon" title="Rotate view 90°" onClick={()=>setViewRot(r=>(r+90)%360)}>&#10227;</button>
