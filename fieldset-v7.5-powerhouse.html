];
const LABEL={select:"Select",pan:"Pan",rect:"Rectangle",polygon:"Polygon",text:"Label",measure:"Distance"};
function ToolIcon({name}){ return <svg viewBox="0 0 24 24" dangerouslySetInnerHTML={{__html:ICON[name]}}></svg>; }

const M2_PER_ACRE=4046.8564224, M2_PER_SQFT=0.09290304;

function App(){
  const [entities,setEntities]=useState([]);
  const [layerMeta,setLayerMeta]=useState({});
  const [layerVis,setLayerVis]=useState({});
  const [fname,setFname]=useState("");
  const [origin,setOrigin]=useState(null);
  const [tool,setTool]=useState("select");
  const [selIds,setSelIds]=useState([]);
  const [draft,setDraft]=useState(null);
  const [zoom,setZoom]=useState(1);
  const [pan,setPan]=useState({x:60,y:60});
  const [tab,setTab]=useState("layers");
  const [coord,setCoord]=useState("—");
  const [undoStack,setUndoStack]=useState([]);
  const [redoStack,setRedoStack]=useState([]);
  const [rectLock,setRectLock]=useState(true);
  const [measure,setMeasure]=useState(null);
  const [newLayerName,setNewLayerName]=useState("");
  const [saving,setSaving]=useState(false);

  const fileRef=useRef(null), dragRef=useRef(null), svgRef=useRef(null), gRef=useRef(null), finishRef=useRef(null);

  const selEnts = entities.filter(e=>selIds.includes(e.id));
  const one = selEnts.length===1 ? selEnts[0] : null;

  function pushHistory(){ setUndoStack(u=>[...u.slice(-79), JSON.stringify(entities)]); setRedoStack([]); }
  function undo(){ if(!undoStack.length) return; setRedoStack(r=>[...r,JSON.stringify(entities)]);
    const snap=undoStack[undoStack.length-1]; setUndoStack(u=>u.slice(0,-1)); const o=JSON.parse(snap); setEntities(o);
    setSelIds(ids=>ids.filter(id=>o.some(e=>e.id===id))); }
  function redo(){ if(!redoStack.length) return; setUndoStack(u=>[...u,JSON.stringify(entities)]);
    const snap=redoStack[redoStack.length-1]; setRedoStack(r=>r.slice(0,-1)); setEntities(JSON.parse(snap)); }

  async function handleFile(file){
    try{
      const text=await file.text();
      const {layers,entities:ents}=parseDxf(text);
      if(!ents.length){ toastMsg("No POLYLINE/TEXT entities found in that file"); return; }
      const allPts=ents.flatMap(e=>e.pts);
      const bb=bbox(allPts);
      const minX=bb[0], maxY=bb[3];
      const conv = e=>({...e, pts:e.pts.map(p=>[p[0]-minX, maxY-p[1]])});
      const converted=ents.map(conv);
      const lm={}; Object.keys(layers).forEach(k=>lm[k]={color:layers[k].color});
      converted.forEach(e=>{ if(!lm[e.layer]) lm[e.layer]={color:7}; });
      setEntities(converted); setLayerMeta(lm);
      const vis={}; Object.keys(lm).forEach(k=>vis[k]=true); setLayerVis(vis);
      setOrigin({minX,maxY}); setFname(file.name); setSelIds([]); setUndoStack([]); setRedoStack([]);
      setTab("layers");
      toastMsg("Loaded "+file.name+" — "+converted.length+" entities, "+Object.keys(lm).length+" layers");
      setTimeout(()=>fitView(converted),50);
    }catch(err){ toastMsg("Could not parse that DXF: "+err.message); console.error(err); }
  }
  function onFileChange(e){ const f=e.target.files[0]; if(f) handleFile(f); e.target.value=""; }
  function onDrop(e){ e.preventDefault(); const f=e.dataTransfer.files[0]; if(f) handleFile(f); }

  function fitView(ents){
    ents = ents||entities; if(!ents.length || !svgRef.current) return;
    const bb=bbox(ents.flatMap(e=>e.pts));
    const w=bb[2]-bb[0]||1, h=bb[3]-bb[1]||1;
    const vw=svgRef.current.clientWidth-80, vh=svgRef.current.clientHeight-80;
    const z=Math.max(0.001, Math.min(vw/w, vh/h));
    setZoom(z); setPan({x:40-bb[0]*z, y:40-bb[1]*z});
  }

  function chooseTool(t){ setTool(t); setDraft(null); setMeasure(null); if(t!=="select") setSelIds([]); }
  function addEntity(e){ pushHistory(); setEntities(prev=>[...prev,e]); setSelIds([e.id]); setTool("select"); }
  function deleteSelection(){ if(!selIds.length) return; pushHistory(); setEntities(prev=>prev.filter(e=>!selIds.includes(e.id))); setSelIds([]); }
  function duplicateSelection(){ if(!selIds.length) return; pushHistory();
    const copies=selEnts.map(e=>{ const c=JSON.parse(JSON.stringify(e)); c.id=uid(); c.pts=c.pts.map(p=>[p[0]+4,p[1]+4]); return c; });
    setEntities(prev=>[...prev,...copies]); setSelIds(copies.map(c=>c.id)); }
  function updateOne(id,mutator){ setEntities(prev=>prev.map(e=> e.id===id? mutator(e) : e)); }
  function ensureLayer(name,color){ setLayerMeta(m=> m[name]? m : {...m,[name]:{color:color||7}});
    setLayerVis(v=> v[name]!==undefined ? v : {...v,[name]:true}); }

  useEffect(()=>{
    function onKey(e){
      const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
      if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
      if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="y"){ e.preventDefault(); redo(); return; }
      if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="d"&&selIds.length&&!typing){ e.preventDefault(); duplicateSelection(); return; }
      if(typing) return;
      if(e.key==="Escape"){ setDraft(null); setSelIds([]); setMeasure(null); return; }
      if(e.key==="Enter" && draft && finishRef.current){ e.preventDefault(); finishRef.current(); return; }
      if((e.key==="Delete"||e.key==="Backspace")&&selIds.length){ e.preventDefault(); deleteSelection(); return; }
      if(e.key==="v") setTool("select");
      if(selIds.length && e.key.startsWith("Arrow")){
        e.preventDefault();
        const d=(e.shiftKey?5:0.5);
        const dx=e.key==="ArrowLeft"?-d:e.key==="ArrowRight"?d:0, dy=e.key==="ArrowUp"?-d:e.key==="ArrowDown"?d:0;
        setEntities(prev=>prev.map(en=> selIds.includes(en.id)? {...en,pts:en.pts.map(p=>[p[0]+dx,p[1]+dy])} : en));
        clearTimeout(window._nk); window._nk=setTimeout(()=>pushHistory(),400);
      }
    }
    window.addEventListener("keydown",onKey);
    return ()=>window.removeEventListener("keydown",onKey);
  },[selIds,entities,undoStack,redoStack,draft]);

  function dl(blob,name){ const u=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=u; a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(u),4000); }

  function exportDxf(){
    if(!origin){ toastMsg("Load a DXF first"); return; }
    const worldEnts = entities.map(e=>({...e, pts:e.pts.map(p=>[p[0]+origin.minX, origin.maxY-p[1]])}));
    const txt = writeDxf(worldEnts, layerMeta);
    dl(new Blob([txt],{type:"application/dxf"}), fname.replace(/\.dxf$/i,"")+"-edited.dxf");
    toastMsg("Exported "+worldEnts.length+" entities to DXF");
  }

  function niceScaleBar(target){ const steps=[1,2,5,10,20,25,50,100,200,250,500,1000]; return steps.reduce((a,b)=>Math.abs(b-target)<Math.abs(a-target)?b:a); }

  async function exportPdf(){
    setSaving(true);
    try{
      const bb=bbox(entities.flatMap(e=>e.pts));
      const wM=bb[2]-bb[0], hM=bb[3]-bb[1];
      const marginPt=54, sheetW=1224, sheetH=792;
      const availW=sheetW-marginPt*2-220, availH=sheetH-marginPt*2;
      const scale=Math.min(availW/wM, availH/hM);
      const pdf=await PDFDocument.create();
      const page=pdf.addPage([sheetW,sheetH]);
      const font=await pdf.embedFont(StandardFonts.Helvetica);
      const fontB=await pdf.embedFont(StandardFonts.HelveticaBold);
      const ox=marginPt-bb[0]*scale, oy=marginPt-bb[1]*scale;
      const toPt=p=>[ox+p[0]*scale, oy+(hM-(p[1]-bb[1]))*scale];

      entities.filter(e=>layerVis[e.layer]!==false).forEach(e=>{
        const col=rgb(...hexToRgb01(aciColor((layerMeta[e.layer]||{}).color)));
        if(e.kind==="poly"){
          const pts=e.pts.map(toPt);
          const d="M "+pts.map(p=>p[0].toFixed(2)+" "+p[1].toFixed(2)).join(" L ")+(e.closed?" Z":"");
          page.drawSvgPath(d,{x:0,y:0,scale:1,borderColor:col,borderWidth:1,color:e.closed?col:undefined,opacity:e.closed?0.12:1,borderOpacity:0.9});
        }else{
          const p=toPt(e.pts[0]);
          page.drawText(e.text||"", {x:p[0], y:p[1], size:Math.max(5,e.height*scale*1.3), font, color:col});
        }
      });

      const tbX=sheetW-marginPt-190;
      page.drawRectangle({x:tbX,y:marginPt,width:190,height:sheetH-marginPt*2,borderColor:rgb(0.7,0.7,0.7),borderWidth:1});
      page.drawText("SITE PLAN EXPORT",{x:tbX+12,y:sheetH-marginPt-24,size:11,font:fontB});
      page.drawText(fname||"untitled.dxf",{x:tbX+12,y:sheetH-marginPt-40,size:8,font,color:rgb(0.4,0.4,0.4)});
      page.drawText("Scale  1:"+Math.round(1/scale*72/12),{x:tbX+12,y:sheetH-marginPt-58,size:8,font});
      page.drawText("Extent  "+wM.toFixed(1)+" x "+hM.toFixed(1)+" m",{x:tbX+12,y:sheetH-marginPt-70,size:8,font});
      page.drawText("Generated "+new Date().toISOString().slice(0,10),{x:tbX+12,y:sheetH-marginPt-82,size:8,font,color:rgb(0.4,0.4,0.4)});
      let ly=sheetH-marginPt-104;
      page.drawText("LAYERS",{x:tbX+12,y:ly,size:8,font:fontB,color:rgb(0.4,0.4,0.4)}); ly-=14;
      Object.keys(layerMeta).filter(k=>layerVis[k]!==false && entities.some(e=>e.layer===k)).slice(0,28).forEach(k=>{
        const col=rgb(...hexToRgb01(aciColor(layerMeta[k].color)));
        page.drawRectangle({x:tbX+12,y:ly-2,width:8,height:8,color:col});
        page.drawText(k.slice(0,24),{x:tbX+26,y:ly,size:6.5,font});
        ly-=11;
      });

      const barM = niceScaleBar(wM/6);
      const barPt = barM*scale;
      const bx=marginPt, by=marginPt+8;
      page.drawLine({start:{x:bx,y:by},end:{x:bx+barPt,y:by},thickness:1.5,color:rgb(0,0,0)});
      page.drawText(barM+" m",{x:bx,y:by+4,size:7,font});

      dl(new Blob([await pdf.save()],{type:"application/pdf"}), fname.replace(/\.dxf$/i,"")+"-siteplan.pdf");
      toastMsg("Exported site plan PDF");
    }catch(err){ toastMsg("PDF export failed: "+err.message); console.error(err); }
    setSaving(false);
  }

  const visibleEnts = entities.filter(e=>layerVis[e.layer]!==false);

  return (
    <div className="app dxf-theme">
      <TopBar
        loaded={!!entities.length} onOpen={()=>fileRef.current.click()}
        undoStack={undoStack} redoStack={redoStack} undo={undo} redo={redo}
        zoom={zoom} setZoom={setZoom} onFit={()=>fitView()}
        onExportDxf={exportDxf} onExportPdf={exportPdf} saving={saving}
      />
      <div className="rail">
        {TOOLS.map((grp,gi)=>(
          <div className="tgroup" key={gi}>
            <div className="glab">{grp.g}</div>
            {grp.items.map(id=>(
              <button key={id} className={"tool"+(tool===id?" on":"")} title={LABEL[id]} onClick={()=>chooseTool(id)}>
                <ToolIcon name={id}/><span>{LABEL[id]}</span>
              </button>
            ))}
          </div>
        ))}
      </div>

      <div className="viewer" onDragOver={e=>e.preventDefault()} onDrop={onDrop}>
        {!entities.length ? (
          <div className="emptyv">
            <div className="big">Drop a DXF here</div>
            <div className="sub">Site plans stay in this browser tab. Edit building footprints, yards, and labels by layer, then export back to DXF or a titled PDF sheet.</div>
            <button className="tb primary" onClick={()=>fileRef.current.click()}>Open DXF</button>
          </div>
        ) : (
          <Canvas
            entities={visibleEnts} allEntities={entities} setEntities={setEntities}
            layerMeta={layerMeta} tool={tool} selIds={selIds} setSelIds={setSelIds}
            draft={draft} setDraft={setDraft} zoom={zoom} setZoom={setZoom} pan={pan} setPan={setPan}
            pushHistory={pushHistory} dragRef={dragRef} svgRef={svgRef} gRef={gRef} finishRef={finishRef}
            setCoord={setCoord} addEntity={addEntity} rectLock={rectLock} measure={measure} setMeasure={setMeasure}
            newLayerName={newLayerName} ensureLayer={ensureLayer}
          />
        )}
      </div>

      <div className="side">
        <div className="tabs">
          {["layers","props","shapes"].map(t=>(
            <button key={t} className={"tab"+(tab===t?" on":"")} onClick={()=>setTab(t)}>{t==="layers"?"Layers":t==="props"?"Properties":"Shapes"}</button>
          ))}
        </div>
        {tab==="layers" && (
          <LayersPane layerMeta={layerMeta} layerVis={layerVis} setLayerVis={setLayerVis} entities={entities}
            onColor={(name,color)=>setLayerMeta(m=>({...m,[name]:{...m[name],color}}))}
            newLayerName={newLayerName} setNewLayerName={setNewLayerName}
            onAddLayer={()=>{ if(!newLayerName.trim()) return; ensureLayer(newLayerName.trim().toUpperCase()); setNewLayerName(""); }}
          />
        )}
        {tab==="props" && (
          <PropsPane one={one} selEnts={selEnts} layerMeta={layerMeta}
            onChangeLayer={v=>{ ensureLayer(v); updateOne(one.id, e=>({...e,layer:v})); pushHistory(); }}
            onChangeText={v=>{ updateOne(one.id, e=>({...e,text:v})); clearTimeout(window._tk); window._tk=setTimeout(pushHistory,500); }}
            onChangeHeight={v=>{ updateOne(one.id, e=>({...e,height:v})); pushHistory(); }}
            onChangeRotation={v=>{ updateOne(one.id, e=>({...e,rotation:v})); pushHistory(); }}
            rectLock={rectLock} setRectLock={setRectLock}
            onDelete={deleteSelection} onDuplicate={duplicateSelection}
          />
        )}
        {tab==="shapes" && (
          <ShapesPane entities={entities} selIds={selIds}
            onPick={(e,additive)=>{ setTool("select"); setTab("props");
              setSelIds(ids=> additive? (ids.includes(e.id)? ids.filter(i=>i!==e.id):[...ids,e.id]) : [e.id]); }}/>
        )}
      </div>

      <div className="status">
        <div className="mono">{entities.length? "Loaded  ·  "+entities.length+" entities" : "No document"}</div>
        <div className="mono">Tool: {LABEL[tool]}</div>
        <div className="mono">{selIds.length? selIds.length+" selected" : ""}</div>
        <div style={{flex:1}}></div>
        <div className="mono">{coord}</div>
      </div>

      <input ref={fileRef} type="file" accept=".dxf" style={{display:"none"}} onChange={onFileChange}/>
    </div>
  );
}

function TopBar({loaded,onOpen,undoStack,redoStack,undo,redo,zoom,setZoom,onFit,onExportDxf,onExportPdf,saving}){
  return (
    <div className="top">
      <div className="brand">Site<span>work</span></div>
      <button className="tb" onClick={onOpen}>Open DXF</button>
      <div className="sep"></div>
      <button className="tb icon" title="Undo (Ctrl+Z)" disabled={!undoStack.length} onClick={undo}>&#8630;</button>
      <button className="tb icon" title="Redo (Ctrl+Y)" disabled={!redoStack.length} onClick={redo}>&#8631;</button>
      <div className="sep"></div>
      <button className="tb icon" onClick={()=>setZoom(z=>Math.max(0.0005,z/1.25))} disabled={!loaded}>&minus;</button>
      <div className="mono" style={{minWidth:52,textAlign:"center"}}>{loaded? (zoom*100).toFixed(1)+"%" : "—"}</div>
      <button className="tb icon" onClick={()=>setZoom(z=>Math.min(50,z*1.25))} disabled={!loaded}>+</button>
      <button className="tb" onClick={onFit} disabled={!loaded}>Fit</button>
      <div style={{flex:1}}></div>
      <button className="tb" onClick={onExportDxf} disabled={!loaded}>Export DXF</button>
      <button className="tb primary" onClick={onExportPdf} disabled={!loaded||saving}>{saving?"Exporting…":"Export PDF"}</button>
    </div>
  );
}

function Canvas({entities,allEntities,setEntities,layerMeta,tool,selIds,setSelIds,draft,setDraft,zoom,setZoom,pan,setPan,
                 pushHistory,dragRef,svgRef,gRef,finishRef,setCoord,addEntity,rectLock,measure,setMeasure,newLayerName,ensureLayer}){
  const [marquee,setMarquee]=useState(null);

  function toWorld(e){
    const pt=svgRef.current.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY;
    const m=gRef.current.getScreenCTM(); if(!m) return [0,0];
    const p=pt.matrixTransform(m.inverse()); return [p.x,p.y];
  }

  function finishMulti(overridePts){
    if(!draft) return;
    const pts = overridePts || draft.pts.slice(0,-1);
    if(pts.length<3){ setDraft(null); return; }
    addEntity({id:uid(),kind:"poly",layer:draft.layer,pts,closed:true});
  }
  finishRef.current=finishMulti;

  function onWheel(e){
    e.preventDefault();
    const rect=svgRef.current.getBoundingClientRect();
    const mx=e.clientX-rect.left, my=e.clientY-rect.top;
    const wx=(mx-pan.x)/zoom, wy=(my-pan.y)/zoom;
    const nz=Math.max(0.0005, Math.min(50, zoom*(e.deltaY<0?1.12:1/1.12)));
    setZoom(nz); setPan({x:mx-wx*nz, y:my-wy*nz});
  }

  function onDown(e){
    if(e.button!==0) return;
    const p=toWorld(e);

    if(tool==="pan"){ dragRef.current={mode:"pan",start:[e.clientX,e.clientY],pan0:pan}; svgRef.current.setPointerCapture(e.pointerId); return; }
    if(tool==="measure"){
      if(!measure) setMeasure({a:p,b:p}); else setMeasure(null);
      return;
    }
    if(tool==="select"){
      const h=e.target.closest("[data-h]");
      if(h && selIds.length===1){
        const a=allEntities.find(x=>x.id===selIds[0]);
        dragRef.current={mode:"handle",a,i:+h.dataset.h,orig:JSON.parse(JSON.stringify(a.pts))};
        svgRef.current.setPointerCapture(e.pointerId); return;
      }
      const g=e.target.closest("[data-id]");
      if(g){
        const id=g.dataset.id;
        let ids;
        if(e.shiftKey||e.ctrlKey||e.metaKey) ids=selIds.includes(id)? selIds.filter(i=>i!==id):[...selIds,id];
        else ids=selIds.includes(id)?selIds:[id];
        setSelIds(ids);
        const orig={}; allEntities.forEach(a=>{ if(ids.includes(a.id)) orig[a.id]=JSON.parse(JSON.stringify(a.pts)); });
        dragRef.current={mode:"move",ids,start:p,orig};
        svgRef.current.setPointerCapture(e.pointerId); return;
      }
      if(!(e.shiftKey||e.ctrlKey||e.metaKey)) setSelIds([]);
      dragRef.current={mode:"marquee",start:p,additive:e.shiftKey||e.ctrlKey||e.metaKey,base:selIds};
      setMarquee({x0:p[0],y0:p[1],x1:p[0],y1:p[1]});
      svgRef.current.setPointerCapture(e.pointerId); return;
    }
    if(tool==="rect"){
      const layer = newLayerName.trim() ? newLayerName.trim().toUpperCase() : (Object.keys(layerMeta)[0]||"NEW_LAYER");
      ensureLayer(layer);
      setDraft({id:uid(),kind:"poly",layer,pts:[p,p.slice()],closed:true});
      dragRef.current={mode:"rect",start:p};
      svgRef.current.setPointerCapture(e.pointerId); return;
    }
    if(tool==="polygon"){
      const layer = newLayerName.trim() ? newLayerName.trim().toUpperCase() : (Object.keys(layerMeta)[0]||"NEW_LAYER");
      ensureLayer(layer);
      if(!draft) setDraft({id:uid(),kind:"poly",layer,pts:[p,p.slice()],closed:true});
      else{
        const pts=draft.pts.slice();
        if(pts.length>2 && dist(pts[0],p)<8/zoom){ finishMulti(); return; }
        pts[pts.length-1]=p; pts.push(p.slice());
        setDraft(d=>({...d,pts}));
      }
      return;
    }
    if(tool==="text"){
      const layer = newLayerName.trim() ? newLayerName.trim().toUpperCase() : (Object.keys(layerMeta)[0]||"NEW_LAYER");
      ensureLayer(layer);
      const label = prompt("Label text:","LABEL");
      if(label!=null && label.trim()){
        addEntity({id:uid(),kind:"text",layer,pts:[p],text:label.trim(),height:3,rotation:0});
      }
      return;
    }
  }

  function onMove(e){
    const p=toWorld(e);
    setCoord("X "+p[0].toFixed(2)+"m  Y "+p[1].toFixed(2)+"m");
    const drag=dragRef.current;
    if(!drag){
      if(draft && draft.pts.length>1 && tool==="polygon"){
        const pts=draft.pts.slice(); pts[pts.length-1]=p; setDraft(d=>({...d,pts}));
      }
      if(measure) setMeasure(m=> m? {...m,b:p} : m);
      return;
    }
    if(drag.mode==="pan"){
      setPan({x:drag.pan0.x+(e.clientX-drag.start[0]), y:drag.pan0.y+(e.clientY-drag.start[1])});
      return;
    }
    if(drag.mode==="marquee"){ setMarquee(m=>({...m,x1:p[0],y1:p[1]})); return; }
    if(drag.mode==="move"){
      const dx=p[0]-drag.start[0], dy=p[1]-drag.start[1];
      setEntities(prev=>prev.map(a=> drag.orig[a.id]? {...a,pts:drag.orig[a.id].map(q=>[q[0]+dx,q[1]+dy])} : a));
      return;
    }
    if(drag.mode==="handle"){
      const a=drag.a;
      if(rectLock && a.closed && isAxisRect(drag.orig)){
        const bb=bbox(drag.orig); const opp=[[bb[2],bb[3]],[bb[0],bb[3]],[bb[0],bb[1]],[bb[2],bb[1]]][drag.i];
        const nbb=[Math.min(opp[0],p[0]),Math.min(opp[1],p[1]),Math.max(opp[0],p[0]),Math.max(opp[1],p[1])];
        const newPts=[[nbb[0],nbb[1]],[nbb[2],nbb[1]],[nbb[2],nbb[3]],[nbb[0],nbb[3]]];
        setEntities(prev=>prev.map(x=> x.id===a.id? {...x,pts:newPts}:x));
      }else{
        const newPts=drag.orig.map((q,i)=> i===drag.i? p : q);
        setEntities(prev=>prev.map(x=> x.id===a.id? {...x,pts:newPts}:x));
      }
      return;
    }
    if(drag.mode==="rect" && draft){
      const bb=[Math.min(drag.start[0],p[0]),Math.min(drag.start[1],p[1]),Math.max(drag.start[0],p[0]),Math.max(drag.start[1],p[1])];
      setDraft(d=>({...d, pts:[[bb[0],bb[1]],[bb[2],bb[1]],[bb[2],bb[3]],[bb[0],bb[3]]]}));
      return;
    }
  }

  function onUp(e){
    const drag=dragRef.current; if(!drag) return;
    dragRef.current=null;
    try{ svgRef.current.releasePointerCapture(e.pointerId); }catch(err){}

/* =====================================================================
   LAYOUT — edit the real vector geometry inside an existing PDF.

   How it works, in one paragraph, because the approach is unusual:
   the page content stream is split into its individual drawing blocks,
   grouped into layers by colour, and edited by INJECTING a transform
   matrix in front of a block rather than rewriting its coordinates. The
   original path data therefore survives byte-for-byte. What you see on
   screen is not a redrawing of the PDF — it is the edited PDF itself,
   re-rendered, so the preview and the export cannot disagree.
   ===================================================================== */
const LayoutApp = (function(){

const {PDFDocument, PDFName, PDFArray, decodePDFRawStream, StandardFonts, degrees, rgb} = window.PDFLib;
const NUM = "-?\\d*\\.?\\d+(?:[eE][-+]?\\d+)?";
const R = (p,f)=>new RegExp(p,f);

/* ---------- matrices (same [a b c d e f] order as PDF's cm) ---------- */
const IDENT=[1,0,0,1,0,0];
function mul(m,n){ return [ m[0]*n[0]+m[2]*n[1], m[1]*n[0]+m[3]*n[1],
                            m[0]*n[2]+m[2]*n[3], m[1]*n[2]+m[3]*n[3],
                            m[0]*n[4]+m[2]*n[5]+m[4], m[1]*n[4]+m[3]*n[5]+m[5] ]; }
function isIdent(m){ return !m || (m[0]===1&&m[1]===0&&m[2]===0&&m[3]===1&&m[4]===0&&m[5]===0); }
function apply(m,p){ return m? [m[0]*p[0]+m[2]*p[1]+m[4], m[1]*p[0]+m[3]*p[1]+m[5]] : p; }
function inv(m){ const d=m[0]*m[3]-m[1]*m[2]; if(Math.abs(d)<1e-12)return IDENT; return [m[3]/d,-m[1]/d,-m[2]/d,m[0]/d,(m[2]*m[5]-m[3]*m[4])/d,(m[1]*m[4]-m[0]*m[5])/d]; }
/* A move/rotate/scale expressed about an arbitrary pivot. */
function xform(dx,dy,deg,sc,cx,cy){
  const a=deg*Math.PI/180, c=Math.cos(a), s=Math.sin(a);
  const Rm=[c*sc,s*sc,-s*sc,c*sc,0,0];
  return mul([1,0,0,1,cx+dx,cy+dy], mul(Rm,[1,0,0,1,-cx,-cy]));
}
function decompose(m){
  if(!m) return {dx:0,dy:0,rot:0,scale:1};
  const sc=Math.hypot(m[0],m[1])||1;
  return {rot:Math.atan2(m[1],m[0])*180/Math.PI, scale:sc, dx:m[4], dy:m[5]};
}
function fnum(n){ const v=Math.round(n*1e6)/1e6; return Object.is(v,-0)?"0":String(v); }

/* ---------- content-stream parsing ---------- */
/* Split into top-level q…Q blocks. Anything between them is page-level
   graphics state that must be re-emitted verbatim, or colours downstream shift. */
function segment(src){
  const out=[]; const stack=[]; const pieces=[]; let prev=0;
  const re=R("(?:^|[^A-Za-z0-9/])([qQ])(?![A-Za-z0-9])","g");
  let m;
  while((m=re.exec(src))){
    const at=m.index+m[0].length-1;
    if(m[1]==="q"){
      if(!stack.length && at>prev){ const g=src.slice(prev,at); if(g.trim()) pieces.push({fixed:g}); }
      stack.push(at);
    }else if(stack.length){
      const s=stack.pop();
      if(!stack.length){ pieces.push({block:[s,at+1]}); prev=at+1; }
    }
  }
  if(prev<src.length){ const g=src.slice(prev); if(g.trim()) pieces.push({fixed:g}); }
  return pieces;
}

function lastMatch(body,pat){ const a=[...body.matchAll(R(pat,"g"))]; return a.length?a[a.length-1]:null; }

function readPaint(body){
  const o={};
  let m=lastMatch(body,"("+NUM+")\\s+("+NUM+")\\s+("+NUM+")\\s+rg(?![A-Za-z])");
  if(m) o.fill=[+m[1],+m[2],+m[3]];
  m=lastMatch(body,"("+NUM+")\\s+("+NUM+")\\s+("+NUM+")\\s+RG(?![A-Za-z])");
  if(m) o.stroke=[+m[1],+m[2],+m[3]];
  if(!o.fill){ m=lastMatch(body,"("+NUM+")\\s+g(?![A-Za-z])"); if(m) o.fill=[+m[1],+m[1],+m[1]]; }
  if(!o.stroke){ m=lastMatch(body,"("+NUM+")\\s+G(?![A-Za-z])"); if(m) o.stroke=[+m[1],+m[1],+m[1]]; }
  m=lastMatch(body,"("+NUM+")\\s+w(?![A-Za-z])"); o.width=m? +m[1] : 1;

}

/* Path geometry, used for hit-testing and outlines only — never for export. */
function readGeom(body){
  let g=body.replace(R("^\\s*q\\s*"+NUM+"\\s+"+NUM+"\\s+"+NUM+"\\s+"+NUM+"\\s+re\\s+W\\s+n"),"");
  const d=[], pts=[];
  const tok=R("("+NUM+")\\s+("+NUM+")\\s+(m|l)(?![A-Za-z])"
    +"|("+NUM+")\\s+("+NUM+")\\s+("+NUM+")\\s+("+NUM+")\\s+("+NUM+")\\s+("+NUM+")\\s+c(?![A-Za-z])"
    +"|("+NUM+")\\s+("+NUM+")\\s+("+NUM+")\\s+("+NUM+")\\s+re(?![A-Za-z])"
    +"|(?:^|[^A-Za-z])(h)(?![A-Za-z])","g");
  let t;
  while((t=tok.exec(g))){
    if(t[3]){ d.push((t[3]==="m"?"M":"L")+t[1]+" "+t[2]); pts.push([+t[1],+t[2]]); }
    else if(t[9]!==undefined){ d.push("C"+t[4]+" "+t[5]+" "+t[6]+" "+t[7]+" "+t[8]+" "+t[9]);
      pts.push([+t[4],+t[5]],[+t[6],+t[7]],[+t[8],+t[9]]); }
    else if(t[13]!==undefined){ const x=+t[10],y=+t[11],w=+t[12],h=+t[13];
      d.push("M"+x+" "+y+"L"+(x+w)+" "+y+"L"+(x+w)+" "+(y+h)+"L"+x+" "+(y+h)+"Z");
      pts.push([x,y],[x+w,y],[x+w,y+h],[x,y+h]); }
    else if(t[14]) d.push("Z");
  }
  return {d:d.join(" "), pts};
}

/* Text lives in nested q … cm BT … ET Q groups, so each label can be picked
   out individually rather than the whole title block moving as one lump. */
function textPieces(body){
  /* Extract on-page text so each label becomes a selectable, movable object.
     Real-world PDFs (ReportLab, most CAD plotters) put BT..ET DIRECTLY inside
     one q..Q block (not a nested one) and carry position in the text matrix Tm
     rather than a graphics-state cm; font size is often a Tf in a separate,
     empty BT..ET just before. We scan BT..ET spans, track the running size, and
     prefer Tm (falling back to the nearest preceding cm). The verbatim BT..ET is
     kept as the object body so render/export stay exact; only the bbox is derived. */
  const inner=body.replace(R("^\\s*q"),"  ").replace(R("Q\\s*$"),"  ");
  const out=[]; let last=0, curSize=10;
  const btre=R("BT([\\s\\S]*?)ET","g");
  const cmre=R("("+NUM+")\\s+("+NUM+")\\s+("+NUM+")\\s+("+NUM+")\\s+("+NUM+")\\s+("+NUM+")\\s+cm","g");
  let m;
  while((m=btre.exec(inner))){
    const seg=m[1], segStart=m.index, segEnd=btre.lastIndex;
    if(segStart>last){ const g=inner.slice(last,segStart); if(g.trim()) out.push({fixed:g}); }
    last=segEnd;
    const tf=seg.match(R("/\\w+\\s+("+NUM+")\\s+Tf")); if(tf) curSize=+tf[1];
    const strs=[...seg.matchAll(/\((?:\\.|[^\\()])*\)/g)].map(x=>x[0].slice(1,-1).replace(/\\([()\\])/g,"$1"));
    const label=strs.join("").replace(/\s+/g," ").trim();
    if(!label){ out.push({fixed:m[0]}); continue; }
    let x=0,y=0,sy=1;
    const tm=seg.match(R("("+NUM+")\\s+("+NUM+")\\s+("+NUM+")\\s+("+NUM+")\\s+("+NUM+")\\s+("+NUM+")\\s+Tm"));
    if(tm){ x=+tm[5]; y=+tm[6]; sy=Math.abs(+tm[4])||1; }
    else{ const pre=inner.slice(0,segEnd); const cms=[...pre.matchAll(cmre)];
      if(cms.length){ const c=cms[cms.length-1]; x=+c[5]; y=+c[6]; sy=Math.abs(+c[4])||1; } }
    const size=curSize*sy;
    const w=Math.max(size*0.9, label.length*size*0.6);
    out.push({body:m[0], isText:true, label, bb:[x, y-size*0.28, x+w, y+size*0.92]});
  }
  if(last<inner.length){ const g=inner.slice(last); if(g.trim()) out.push({fixed:g}); }
  return out;
}

function parseStream(src){
  const objs=[], fixed=[];
  segment(src).forEach(p=>{
    if(p.fixed){ fixed.push({at:objs.length, s:p.fixed}); return; }
    const body=src.slice(p.block[0],p.block[1]);
    const hasText=/[^A-Za-z]BT(?![A-Za-z])/.test(body);
    if(hasText){
      const parts=textPieces(body);
      /* keep the block's own wrapper so graphics state still nests correctly */
      fixed.push({at:objs.length, s:"q"});
      parts.forEach(pt=>{
        if(pt.fixed){ fixed.push({at:objs.length, s:pt.fixed}); return; }
        objs.push({body:pt.body, kind:"text", label:pt.label, bb:pt.bb,
          d:rectPath(pt.bb), pts:bbPts(pt.bb), paint:{fill:[0.1,0.1,0.1],op:"f",width:0}});
      });
      fixed.push({at:objs.length, s:"Q"});
      return;
    }
    const paint=readPaint(body);
    const geom=readGeom(body);
    const isImg=/[^A-Za-z]Do(?![A-Za-z])/.test(body) && !geom.pts.length;
    const bb=bbox(geom.pts);
    objs.push({body, kind:isImg?"image":"vector", d:geom.d, pts:geom.pts, bb, paint});
  });
  return {objs, fixed};
}
function rectPath(b){ return "M"+b[0]+" "+b[1]+"L"+b[2]+" "+b[1]+"L"+b[2]+" "+b[3]+"L"+b[0]+" "+b[3]+"Z"; }
function bbPts(b){ return [[b[0],b[1]],[b[2],b[1]],[b[2],b[3]],[b[0],b[3]]]; }
function bbox(pts){
  if(!pts||!pts.length) return null;
  let a=1e18,b=1e18,c=-1e18,d=-1e18;
  for(const p of pts){ if(p[0]<a)a=p[0]; if(p[1]<b)b=p[1]; if(p[0]>c)c=p[0]; if(p[1]>d)d=p[1]; }
  return [a,b,c,d];
}
function bboxOf(o,m){ return bbox((o.pts||[]).map(p=>apply(m,p))); }
function unionBB(list){
  const all=[]; list.forEach(b=>{ if(b){ all.push([b[0],b[1]],[b[2],b[3]]); } });
  return bbox(all);
}

/* ---------- rebuild ---------- */
function escPdfText(v){ return String(v||"").replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)"); }

  const a=Math.atan2(to[1]-from[1],to[0]-from[0]), s=0.42, L=Math.max(3,size);

/* ---------- health check ---------- */
/* Not every PDF decomposes this cleanly. Say so plainly rather than
   silently handing back a mangled drawing. */
function assess(parsed){
  const v=parsed.objs.filter(o=>o.kind==="vector");
  const withGeom=v.filter(o=>o.bb).length;
  const total=parsed.objs.length;
  if(!total) return {ok:false, msg:"No drawing objects found on this page."};
  if(!v.length) return {ok:false, msg:"This page has no editable vector geometry \u2014 it looks like a scan or a flattened image."};
  const ratio=withGeom/v.length;
  if(ratio<0.6) return {ok:false, msg:"Only "+Math.round(ratio*100)+"% of the shapes on this page could be read cleanly. Moving layers here would likely damage the drawing."};
  if(ratio<0.92) return {ok:true, warn:true, msg:Math.round((1-ratio)*100)+"% of shapes could not be read \u2014 they will stay put and cannot be selected."};

/* Existing-PDF labels are frequently exported as many small filled vector

   letter edge and usually selects nothing. Cluster those glyphs (and any real
   text runs) into label groups up front so a click anywhere on a label grabs
   the whole thing and it moves as one unit. */
function detectLabels(objs){

    if(!o.bb) return;
    const w=o.bb[2]-o.bb[0], h=o.bb[3]-o.bb[1];
    if(w<=0||h<=0) return;

    const glyph=o.kind==="vector"&&filled&&h>=2&&h<=34&&w<=34;

  for(let k=0;k<n;k++) parent[k]=k;
  const find=a=>{ while(parent[a]!==a){ parent[a]=parent[parent[a]]; a=parent[a]; } return a; };
  const uni=(a,b)=>{ a=find(a); b=find(b); if(a!==b) parent[a]=b; };
  for(let a=0;a<n;a++) for(let b=a+1;b<n;b++){
    const A=idx[a],B=idx[b];
    const H=Math.max(A.h,B.h), hmin=Math.max(0.01,Math.min(A.h,B.h));
    if(H/hmin>2.6) continue;
    const gx=Math.max(A.bb[0],B.bb[0])-Math.min(A.bb[2],B.bb[2]);
    const gy=Math.max(A.bb[1],B.bb[1])-Math.min(A.bb[3],B.bb[3]);
    if(gx<=H*1.3 && gy<=H*1.1) uni(a,b);

  for(let k=0;k<n;k++){ const r=find(k); (bucket[r]=bucket[r]||[]).push(idx[k].i); }

    if(ids.length>=4) out.push({id:"lbl"+r+Math.random().toString(36).slice(2,6), ids, label:true}); });
  return out;
}

      const o=objs[i],w=b[2]-b[0],h=b[3]-b[1],ocx=(b[0]+b[2])/2,ocy=(b[1]+b[3])/2;
      const filled=!!(o.paint&&o.paint.op&&/f|B|b/i.test(o.paint.op));
      return o.kind==="vector"&&filled&&w<gw*.24&&h<gh*.20&&Math.abs(ocx-cx)<gw*.42&&Math.abs(ocy-cy)<gh*.28;
    }).map(x=>x[0]);
    /* Require several outline fragments: one small shape alone is equipment,
       while a converted label normally contains many character components. */
    const labelSet=new Set([...textIds,...(glyphs.length>=4?glyphs:[])]);
    /* If the selection is basically JUST a label, the user means to rotate that
       label itself, so don't hold it upright. Only keep labels upright when they
       ride along inside a larger structure (building pad, parcel, etc.). */
    const nonLabel=ids.filter(i=>!labelSet.has(i)).length;

  function objectDelta(D,i,meta,cur,upright){
    if(!(upright&&upright.has(i))) return D;

    const c=[(b[0]+b[2])/2,(b[1]+b[3])/2], q=apply(D,c);

  function commit(D,idsOverride,meta){
    const ids=(idsOverride||sel).filter(i=>isAlive(i)&&!lockedIds.has(i));
    if(!ids.length || isIdent(D)) return;
    const upright=uprightLabelIds(ids,meta);
    push();
    setState(prev=>{
      const n={...prev};
      ids.forEach(i=>{ const cur=(n[i]&&n[i].m)||IDENT, delta=objectDelta(D,i,meta,cur,upright); n[i]={...(n[i]||{}), m:mul(delta,cur)}; });
      return n;
    });
  }
  function nudge(dx,dy){ commit([1,0,0,1,dx,dy]); }
  function rotateBy(deg){
    if(!selBB) return;
    const cx=(selBB[0]+selBB[2])/2,cy=(selBB[1]+selBB[3])/2;
    commit(xform(0,0,deg,1,cx,cy),null,{kind:"rotate",keepLabelsUpright});
  }
  function scaleBy(f){
    if(!selBB) return;

  }
  function resetSel(){
    if(!sel.length) return;
    push(); setState(prev=>{ const n={...prev}; sel.forEach(i=>{ if(n[i]) n[i]={...n[i], m:IDENT}; }); return n; });
  }
  function setLayerVisible(L,v){
    push();
    setLayers(ls=>ls.map(x=>x.key===L.key?{...x,visible:v}:x));
    setState(prev=>{ const n={...prev}; L.ids.forEach(i=>{ n[i]={...(n[i]||{}), layerHidden:!v}; }); return n; });
  }
  function setLayerColor(L,hex){
    const c=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)/255);
    push();
    setLayers(ls=>ls.map(x=>x.key===L.key?{...x,hex}:x));
    setState(prev=>{ const n={...prev};
      L.ids.forEach(i=>{ const o=objs[i]; n[i]={...(n[i]||{})};
        if(o.paint.fill) n[i].fill=c;
        if(o.paint.stroke && !o.paint.fill) n[i].stroke=c; });
      return n; });
  }
  function renameLayer(L,name){ setLayers(ls=>ls.map(x=>x.key===L.key?{...x,name}:x)); }

  /* ---------- pointer editing ---------- */
  function toPage(e){
    const r=svgRef.current.getBoundingClientRect();
    return [ (e.clientX-r.left)/zoom, pageH-(e.clientY-r.top)/zoom ];
  }
  function onDown(e){
    if(!parsed)return;
    if(e.button===1 || (e.button===0&&spaceRef.current)){
      const el=wrapRef.current; dragRef.current={kind:"pan",client:[e.clientX,e.clientY],scroll:[el.scrollLeft,el.scrollTop]}; svgRef.current.setPointerCapture(e.pointerId); e.preventDefault(); return;
    }
    if(e.button!==0)return;
    if(tool!=="select"){
      if(tool==="pen"){const p=snapAll(toPage(e));dragRef.current={kind:"pen",pts:[p]};setDraft({shape:"pen",pts:[p]});svgRef.current.setPointerCapture(e.pointerId);return;}
      const p=snapAll(toPage(e));
      if(tool==="text"){ const ts=Math.max(6,+shapeStyle.textSize||12); const bb=[p[0],p[1],p[0]+Math.max(60,8*ts*0.6),p[1]+ts]; const idx=objs.length; addTextObj(bb,""); setEditing({idx,mode:"new",t:Date.now()}); setSnapHint(null); return; }
      if(tool==="dim"||tool==="dimcal"){ dragRef.current={kind:"dim",mode:tool,start:p}; setDraft({shape:"dim",a:p,b:p}); svgRef.current.setPointerCapture(e.pointerId); return; }
      dragRef.current={kind:"draw",shape:tool,start:p}; setDraft(tool==="curve"?{shape:"curve",pts:[p,p.slice(),p.slice()]}:{shape:tool,a:p,b:p});
      svgRef.current.setPointerCapture(e.pointerId); return;
    }
    const editHandle=e.target.closest("[data-edit-handle]");
    if(editHandle&&sel.length===1){const i=sel[0],o=objs[i];if(o&&o.synthetic&&["line","curve","pen","arrow","connector"].includes(o.syntheticType)){dragRef.current={kind:"editpt",i,pt:+editHandle.dataset.editHandle,orig:o.pts.map(z=>z.slice())};svgRef.current.setPointerCapture(e.pointerId);return;}}
    const handle=e.target.closest("[data-handle]");
    if(handle && selBB){
      const cx=(selBB[0]+selBB[2])/2, cy=(selBB[1]+selBB[3])/2;
      dragRef.current={kind:handle.dataset.handle, start:toPage(e), cx, cy,
        bb:selBB.slice(), r0:Math.hypot(selBB[2]-cx,selBB[3]-cy)};
      svgRef.current.setPointerCapture(e.pointerId); return;
    }
    const hit=e.target.closest("[data-i]");
    if(hit){
      const i=+hit.dataset.i;
      if(lockedIds.has(i)){ toastMsg("That layer is locked"); return; }
      const additive=e.shiftKey||e.ctrlKey||e.metaKey;
      if(additive && selSet.has(i)){ pick(i,true); return; }
      let dragIds;
      if(selSet.has(i)) dragIds=sel.slice();
      else if(mode==="layer"){
        const L=layerOf(i); if(!L||L.locked)return;
        dragIds=L.ids.filter(k=>objs[k].bb&&isAlive(k)&&!lockedIds.has(k));
      }else{
        const G=groupFor(i); dragIds=(G?G.ids:[i]).filter(k=>isAlive(k)&&!lockedIds.has(k));
      }
      if(additive) dragIds=Array.from(new Set([...sel,...dragIds]));
      setSel(dragIds);
      dragRef.current={kind:"move", ids:dragIds, start:toPage(e)};
      svgRef.current.setPointerCapture(e.pointerId); return;
    }
    const p=toPage(e);
    if(!(e.shiftKey||e.ctrlKey)) setSel([]);
    dragRef.current={kind:"marquee",start:p,base:(e.shiftKey||e.ctrlKey)?sel:[]};
    setMarquee({a:p,b:p,cross:false});
    svgRef.current.setPointerCapture(e.pointerId);
  }
  function onMove(e){
    const d=dragRef.current; if(!d) return;
    if(d.kind==="pan"){const el=wrapRef.current;el.scrollLeft=d.scroll[0]-(e.clientX-d.client[0]);el.scrollTop=d.scroll[1]-(e.clientY-d.client[1]);return;}
    let p=toPage(e);
    if(d.kind==="pen"){const last=d.pts[d.pts.length-1];if(Math.hypot(p[0]-last[0],p[1]-last[1])>1/zoom){d.pts.push(p);setDraft({shape:"pen",pts:d.pts.slice()});}return;}
    if(d.kind==="editpt"){
      const o=objs[d.i], m=matOf(d.i);
      /* snap the moving end to nearby endpoints / midpoints */
      const g=snapGeom(p); const pageP=g?g.p:p; setSnapHint(g||null);
      let local=apply(inv(m),pageP);
      const pts=d.orig.map(z=>z.slice());
      /* the OTHER end always stays put; Shift = pure rotation (keep length),
         so a line pivots about its fixed end like a compass. */
      if(e.shiftKey && pts.length===2 && (o.syntheticType==="line"||o.syntheticType==="arrow")){
        const fx=pts[d.pt===0?1:0];
        const origLen=Math.hypot(d.orig[1][0]-d.orig[0][0],d.orig[1][1]-d.orig[0][1])||1;
        const ang=Math.atan2(local[1]-fx[1],local[0]-fx[0]);
        local=[fx[0]+origLen*Math.cos(ang), fx[1]+origLen*Math.sin(ang)];
      }
      pts[d.pt]=local;
      const neo=rebuildWithPts(o,pts);
      setParsed(P=>{const a=P.objs.slice();a[d.i]=neo;return {...P,objs:a};});return;
    }
    if(d.kind==="draw"){
      const pt=snapResolve(p, d.shape==="line"||d.shape==="arrow", d.start);
      if(d.shape==="curve"){const mx=(d.start[0]+pt[0])/2,my=(d.start[1]+pt[1])/2,dx=pt[0]-d.start[0],dy=pt[1]-d.start[1];setDraft({shape:"curve",pts:[d.start,[mx-dy*.25,my+dx*.25],pt]});}
      else setDraft({shape:d.shape,a:d.start,b:pt}); return;
    }
    if(d.kind==="dim"){
      const pt=snapResolve(p, true, d.start);
      setDraft({shape:"dim",a:d.start,b:pt}); return;
    }
    if(d.kind==="marquee"){
      const cross=p[0]<d.start[0]; setMarquee({a:d.start,b:p,cross}); return;
    }
    if(d.kind==="move"){
      let dx=p[0]-d.start[0], dy=p[1]-d.start[1];
      if(e.shiftKey){ if(Math.abs(dx)>Math.abs(dy)) dy=0; else dx=0; }

    } else if(d.kind==="rotate"){
      const a0=Math.atan2(d.start[1]-d.cy, d.start[0]-d.cx);
      const a1=Math.atan2(p[1]-d.cy, p[0]-d.cx);
      let deg=(a1-a0)*180/Math.PI;
      if(e.shiftKey) deg=Math.round(deg/15)*15;

      setLive(xform(0,0,deg,1,d.cx,d.cy));
    } else if(d.kind==="scale"){

  }
  function onUp(e){

    if(d.kind==="editpt"){ push(); setSnapHint(null); try{svgRef.current.releasePointerCapture(e.pointerId);}catch(err){} return; }
    if(d.kind==="marquee"){
      const q=marquee; setMarquee(null); if(!q)return;
      const r=[Math.min(q.a[0],q.b[0]),Math.min(q.a[1],q.b[1]),Math.max(q.a[0],q.b[0]),Math.max(q.a[1],q.b[1])];
      if((r[2]-r[0])<1&&(r[3]-r[1])<1)return;
      const hit=objs.map((o,i)=>[o,i]).filter(([o,i])=>o.bb&&isAlive(i)&&!lockedIds.has(i)).filter(([o,i])=>{const b=bboxOf(o,matOf(i));return q.cross?!(b[2]<r[0]||b[0]>r[2]||b[3]<r[1]||b[1]>r[3]):b[0]>=r[0]&&b[1]>=r[1]&&b[2]<=r[2]&&b[3]<=r[3];}).flatMap(([o,i])=>{const G=groupFor(i);return (G?G.ids:[i]).filter(k=>isAlive(k)&&!lockedIds.has(k));});
      const chosen=Array.from(new Set([...d.base,...hit])); setSel(chosen); toastMsg(chosen.length+" object"+(chosen.length===1?"":"s")+" selected"); return;
    }
    if(d.kind==="dim"){
      const q=draft; setDraft(null); setSnapHint(null); if(!q)return;
      const lenPt=Math.hypot(q.b[0]-q.a[0],q.b[1]-q.a[1]); if(lenPt<2) return;
      if(d.mode==="dimcal"){
        const known=prompt("Real length of this line (e.g. 100 or 100 m):","");
        if(known){ const mm=String(known).trim().match(/^([-0-9.]+)\s*([A-Za-z\"']*)$/); if(mm){ const val=+mm[1], unit=mm[2]||dimScale.unit; if(val>0){ setDimScale(ds=>({...ds,factor:val/lenPt,unit})); toastMsg("Scale set: 1 pt = "+(val/lenPt).toPrecision(4)+" "+unit); } } }

      const q=draft; setDraft(null); setSnapHint(null); if(!q)return;
      if(d.shape==="curve"){if(q.pts&&q.pts.length===3)addSyntheticPoints("curve",q.pts);return;}
      const dx=Math.abs(q.b[0]-q.a[0]),dy=Math.abs(q.b[1]-q.a[1]); if(Math.hypot(dx,dy)<2)return;
      if(d.shape==="line"||d.shape==="arrow"||d.shape==="connector"){ addSyntheticPoints(d.shape,[q.a.slice(),q.b.slice()]); return; }
      const bb=[Math.min(q.a[0],q.b[0]),Math.min(q.a[1],q.b[1]),Math.max(q.a[0],q.b[0]),Math.max(q.a[1],q.b[1])];

  /* --- inline on-canvas text editing (Bluebeam-style: type on the drawing) --- */
  function updateEditText(value){
    if(editing==null) return; const i=editing.idx, o=objs[i]; if(!o) return;
    const cur=o.paint||{};
    const size=cur.textSize||Math.max(6,o.bb[3]-o.bb[1]);
    const color=cur.textColor||[.12,.12,.12];
    const w=Math.max(size*0.9, (value.length||1)*size*0.6);
    const nb=[o.bb[0], o.bb[1], o.bb[0]+w, o.bb[1]+size];
    setParsed(P=>{ const a=P.objs.slice();
      a[i]={...syntheticObject("text",nb,{stroke:color,fill:[1,1,1],width:0,textSize:size,textColor:color},value),synthetic:true};
      return {...P,objs:a}; });
  }
  function commitEdit(){
    if(editing==null) return; const i=editing.idx, o=objs[i];
    const empty=!o||!o.label||!String(o.label).trim();
    if(editing.mode==="new" && empty){ setState(prev=>{const n={...prev}; n[i]={...(n[i]||{}),hidden:true}; return n;}); setSel([]); }
    setEditing(null);
  }
  function cancelEdit(){ setEditing(null); }
  function recolorSel(hex){
    if(!sel.length) return; const c=hex01(hex); push();
    setState(prev=>{ const n={...prev};
      sel.forEach(i=>{ const o=objs[i]; if(!o) return; n[i]={...(n[i]||{})};
        if(o.paint&&o.paint.fill) n[i].fill=c;
        if(o.paint&&o.paint.stroke) n[i].stroke=c; });
      return n; });
    toastMsg("Recoloured "+sel.length+" object"+(sel.length>1?"s":""));
  }
  function onDoubleClick(e){
    if(tool!=="select")return;
    const p=toPage(e);
    let i=textIdUnder(p);
    if(i<0){ const hit=e.target.closest("[data-i]"); if(hit){ const j=+hit.dataset.i, o=objs[j];
      if(o&&(o.kind==="text"||o.syntheticType==="text")) i=j; } }
    if(i<0||lockedIds.has(i)) return;
    const o=objs[i];
    if(o.syntheticType==="text"){ setSel([i]); setEditing({idx:i,mode:"edit",t:Date.now()}); }
    else { const idx=objs.length; editExistingText(i, o.label||""); setEditing({idx,mode:"edit",t:Date.now()}); }
  }
  /* keyboard */
  useEffect(()=>{
    function k(e){
      const ae=document.activeElement;
      if(/^(INPUT|TEXTAREA|SELECT)$/.test((ae&&ae.tagName)||"")) return;
      const mod=e.ctrlKey||e.metaKey;
      if(mod && e.key.toLowerCase()==="z"){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
      if(mod && e.key.toLowerCase()==="y"){ e.preventDefault(); redo(); return; }
      if(mod && e.key.toLowerCase()==="a" && parsed){ e.preventDefault(); setSel(objs.map((o,i)=>i).filter(i=>objs[i].bb&&isAlive(i)&&!lockedIds.has(i))); return; }
      if(mod && e.key.toLowerCase()==="d" && sel.length){ e.preventDefault(); duplicateSel(); return; }
      if(mod && e.key.toLowerCase()==="g" && !e.shiftKey){ e.preventDefault(); groupSelection(); return; }
      if(mod && e.key.toLowerCase()==="g" && e.shiftKey){ e.preventDefault(); ungroupSelection(); return; }
      if(mod && e.key.toLowerCase()==="c" && sel.length){ e.preventDefault(); copySel(); return; }
      if(mod && e.key.toLowerCase()==="x" && sel.length){ e.preventDefault(); if(copySel(true)){ deleteSel(); toastMsg("Cut"); } return; }
      if(mod && e.key.toLowerCase()==="v"){ if(clipRef.current&&clipRef.current.length){ e.preventDefault(); pasteClip(); } /* else let the native paste event place a clipboard image */ return; }
      if(mod && (e.key==="]"||e.key==="}")){ e.preventDefault(); reorder(e.shiftKey?"front":"forward"); return; }
      if(mod && (e.key==="["||e.key==="{")){ e.preventDefault(); reorder(e.shiftKey?"back":"backward"); return; }
      if(mod) return;
      if(e.key==="Escape"){ setDraft(null); setTool("select"); setSel([]); return; }
      if(e.key.toLowerCase()==="v"){setTool("select");return;}
      if(e.key.toLowerCase()==="r"){setTool("rect");return;}
      if(e.key.toLowerCase()==="o"){setTool("ellipse");return;}
      if(e.code==="Space"){spaceRef.current=true;e.preventDefault();return;}
      if(e.key.toLowerCase()==="l"){setTool("line");return;}
      if(e.key.toLowerCase()==="a"){setTool("arrow");return;}
      if(e.key.toLowerCase()==="k"){setTool("connector");return;}
      if(e.key.toLowerCase()==="c"){setTool("curve");return;}
      if(e.key.toLowerCase()==="p"){setTool("pen");return;}
      if(e.key.toLowerCase()==="t"){setTool("text");return;}
      if(e.key.toLowerCase()==="d"){setTool("dim");return;}
      if((e.key==="Delete"||e.key==="Backspace")&&sel.length){e.preventDefault();deleteSel();return;}
      if(!sel.length) return;
      const step=e.shiftKey?10:1;
      if(e.key==="ArrowLeft"){ e.preventDefault(); nudge(-step,0); }
      else if(e.key==="ArrowRight"){ e.preventDefault(); nudge(step,0); }
      else if(e.key==="ArrowUp"){ e.preventDefault(); nudge(0,step); }
      else if(e.key==="ArrowDown"){ e.preventDefault(); nudge(0,-step); }
      else if(e.key==="["){ rotateBy(-5); }
      else if(e.key==="]"){ rotateBy(5); }
    }
    window.addEventListener("keydown",k);
    return ()=>window.removeEventListener("keydown",k);
  },[sel,state,parsed,objs,selBB,undoS,redoS,zorder,groups,mode]);

  useEffect(()=>{const up=e=>{if(e.code==="Space")spaceRef.current=false;};window.addEventListener("keyup",up);return()=>window.removeEventListener("keyup",up);},[]);
  /* System-clipboard image paste (Ctrl+V). Only acts when the Layout canvas is
     the visible tab and only for image payloads, so it never fights the in-app
     shape clipboard handled by pasteClip(). */
  useEffect(()=>{
    function onPaste(e){
      const el=wrapRef.current; if(!el || el.offsetParent===null) return;
      const dt=e.clipboardData; if(!dt) return;
      let blob=null; const items=dt.items||[];
      for(let k=0;k<items.length;k++){ const it=items[k]; if(it.type&&it.type.indexOf("image")===0){ blob=it.getAsFile(); break; } }
      if(!blob && dt.files){ for(let k=0;k<dt.files.length;k++){ if(dt.files[k].type.indexOf("image")===0){ blob=dt.files[k]; break; } } }
      if(!blob) return;
      e.preventDefault();
      if(pasteFnRef.current) pasteFnRef.current(blob);
    }
    document.addEventListener("paste",onPaste);
    return ()=>document.removeEventListener("paste",onPaste);
  },[]);
  /* wheel zoom at the pointer; rerun after a PDF opens because the scroll
     container is not mounted on the empty start screen. */
  useEffect(()=>{
    const el=wrapRef.current; if(!el) return;
    function w(e){
      if(e.shiftKey) return;
      e.preventDefault();
      const r=el.getBoundingClientRect();
      const px=e.clientX-r.left, py=e.clientY-r.top;
      const cx=px+el.scrollLeft, cy=py+el.scrollTop;
      setZoom(z=>{
        const nz=Math.max(0.05,Math.min(6,z*(e.deltaY<0?1.12:1/1.12)));
        if(Math.abs(nz-z)<1e-9) return z;
        const k=nz/z;
        requestAnimationFrame(()=>{ el.scrollLeft=cx*k-px; el.scrollTop=cy*k-py; });
        return nz;
      });
    }
    el.addEventListener("wheel",w,{passive:false});
    return ()=>el.removeEventListener("wheel",w);
  },[parsed]);

  /* ---------- export ---------- */
  async function exportPdf(){
    setBusy("Writing PDF\u2026");
    try{
      const bytes=await buildPdf(state);
      const blob=new Blob([bytes],{type:"application/pdf"});
      const u=URL.createObjectURL(blob), a=document.createElement("a");
      a.href=u; a.download=fname.replace(/\.pdf$/i,"")+"-edited.pdf"; a.click();
      setTimeout(()=>URL.revokeObjectURL(u),4000);
    }catch(err){ alert("Export failed: "+err.message); }
    setBusy("");
  }

  /* ---------- derived ---------- */
  const moved=Object.keys(state).filter(k=>state[k]&&state[k].m&&!isIdent(state[k].m)).length;
  const one=sel.length===1? objs[sel[0]] : null;
  const dsc=sel.length? decompose(matOf(sel[0])) : null;
  const editObj = editing!=null ? objs[editing.idx] : null;

  /* ---------- render ---------- */
  if(!parsed) return (
    <div className="lay-root">
      <div className="lay-empty">
        <div className="lay-big">Layout</div>
        <p>Open a vector site plan and its layers become editable &mdash; move a building,
           rotate a pad, hide a layer, then write a real PDF back out with the geometry
           actually moved.</p>
        <button className="tb primary" onClick={()=>fileRef.current.click()}>Open PDF</button>
        <div className="lay-note">Works on drawings exported from CAD or plotting tools.
          A scanned or flattened PDF has no geometry to move, and the tool will tell you so
          rather than guess.</div>
      </div>
      <input ref={fileRef} type="file" accept="application/pdf" style={{display:"none"}}

      {busy && <div className="lay-busy">{busy}</div>}
    </div>
  );

  return (
    <div className="lay-app">
      <div className="top">
        <div className="brand">Lay<span>out</span></div>
        <button className="tb" onClick={()=>fileRef.current.click()}>Open PDF</button>
        <button className="tb primary" onClick={exportPdf} disabled={!!busy}>Export PDF</button>
        <button className="tb" title="Add an image \u2014 or paste one with Ctrl+V, or drag it onto the page" onClick={()=>imgInputRef.current&&imgInputRef.current.click()}>Image</button>
        <div className="sep"></div>
        <button className="tb icon" title="Undo (Ctrl+Z)" disabled={!undoS.length} onClick={undo}>&#8630;</button>
        <button className="tb icon" title="Redo (Ctrl+Y)" disabled={!redoS.length} onClick={redo}>&#8631;</button>
        <div className="sep"></div>
        <button className={"tb"+(mode==="object"?" primary":"")} onClick={()=>setMode("object")}
          title="Click selects a single shape">Object</button>
        <button className={"tb"+(mode==="layer"?" primary":"")} onClick={()=>setMode("layer")}
          title="Click selects everything on that shape's layer">Layer</button>
        <div className="sep"></div>
        <button className="tb icon" onClick={()=>setZoom(z=>Math.max(0.05,z/1.25))}>&minus;</button>
        <div className="mono" style={{minWidth:48,textAlign:"center"}}>{Math.round(zoom*100)}%</div>
        <button className="tb icon" onClick={()=>setZoom(z=>Math.min(6,z*1.25))}>+</button>
        <button className="tb" onClick={()=>{
          const el=wrapRef.current; if(el) setZoom(Math.max(0.05,(el.clientWidth-24)/pageW)); }}>Fit</button>
        <button className={"tb"+(showBase?"":" primary")} title="Dim the drawing to see the imagery underneath"

        <div style={{flex:1}}></div>
        <div className="mono">{fname}</div>
      </div>

      <div className="lay-rail">
        {LAYTOOLGROUPS.map((grp,gi)=>(
          <div key={gi}>

            {grp[1].map(t=>(
              <button key={t[0]} className={"lay-railtool"+(tool===t[0]?" on":"")}

      </div>

      <div className="lay-canvas" ref={wrapRef}
        onDragOver={e=>{ if(e.dataTransfer){ e.preventDefault(); } }}

        <div className="lay-stage" style={{width:pageW*zoom, height:pageH*zoom}}>

            onPointerDown={onDown} onPointerMove={onMove} onPointerUp={onUp} onDoubleClick={onDoubleClick}>
            <g transform={"translate(0,"+pageH+") scale(1,-1)"}>
              {drawIds.map(i=>{
                const o=objs[i];
                if(!o || !o.bb || !isAlive(i)) return null;
                const m=matOf(i);
                const t=(!isIdent(m)? "matrix("+m.map(fnum).join(",")+")" : undefined);
                const on=selSet.has(i);
                return (
                  <g key={i} transform={t}>
                    <path data-i={i} d={o.d} fill="transparent" stroke="transparent"
                      strokeWidth={Math.max(2/zoom, (o.paint.width||1)+2/zoom)}
                      style={{pointerEvents: o.paint.op&&/f|B|b/i.test(o.paint.op)?"all":"stroke", cursor:lockedIds.has(i)?"not-allowed":"move"}}/>
                    {on && <path d={o.d} fill="none" stroke="#A8462A" strokeWidth={1.5/zoom}
                      strokeDasharray={(4/zoom)+" "+(3/zoom)} pointerEvents="none"/>}
                  </g>
                );
              })}
              {groups.filter(g=>g.label).map(g=>{
                if(!g.ids.some(i=>isAlive(i))) return null;
                const bb=unionBB(g.ids.map(i=>bboxOf(objs[i],matOf(i))));
                if(!bb) return null;
                const anyLocked=g.ids.some(i=>lockedIds.has(i));
                return <rect key={"lg"+g.id} data-i={g.ids[0]}
                  x={bb[0]-1/zoom} y={bb[1]-1/zoom}

                  fill="transparent" style={{pointerEvents:anyLocked?"none":"all",cursor:"move"}}/>;
              })}
              {live && sel.length>0 && (
                <g pointerEvents="none">
                  {(()=>{const upright=uprightLabelIds(sel,liveMeta);return sel.map(i=>{ const m=matOf(i), delta=objectDelta(live,i,liveMeta,m,upright), pm=mul(delta,m);
                    return <path key={i} d={objs[i].d} fill="#A8462A" fillOpacity="0.18" stroke="#A8462A"
                      strokeWidth={1.2/zoom}
                      transform={!isIdent(pm)?"matrix("+pm.map(fnum).join(",")+")":undefined}/>; });})()}
                </g>
              )}
              {marquee && (()=>{const a=marquee.a,b=marquee.b,x=Math.min(a[0],b[0]),y=Math.min(a[1],b[1]),w=Math.abs(b[0]-a[0]),h=Math.abs(b[1]-a[1]);return <rect className={"lay-marquee"+(marquee.cross?" cross":"")} x={x} y={y} width={w} height={h}/>;})()}
              {draft && (()=>{if(draft.shape==="dim"){const a=draft.a,b=draft.b,mid=[(a[0]+b[0])/2,(a[1]+b[1])/2],len=Math.hypot(b[0]-a[0],b[1]-a[1]);return <g><line className="lay-draft" x1={a[0]} y1={a[1]} x2={b[0]} y2={b[1]}/><g transform={`translate(${mid[0]} ${mid[1]+8/zoom}) scale(1,-1)`}><text fontSize={11/zoom} fill="#A8462A" stroke="#fff" strokeWidth={3/zoom} paintOrder="stroke" textAnchor="middle">{dimFmt(len)}</text></g></g>;}if(draft.shape==="pen"){if(!draft.pts||!draft.pts.length)return null;return <polyline className="lay-draft" points={draft.pts.map(p=>p.join(",")).join(" ")} fill="none"/>;}if(draft.shape==="curve"){const p=draft.pts;if(!p||p.length<3)return null;return <path className="lay-draft" d={`M${p[0][0]} ${p[0][1]} Q${p[1][0]} ${p[1][1]} ${p[2][0]} ${p[2][1]}`} fill="none"/>;}if(draft.shape==="arrow"){const a=draft.a,b=draft.b;return <line className="lay-draft" x1={a[0]} y1={a[1]} x2={b[0]} y2={b[1]}/>;}if(draft.shape==="connector"){const a=draft.a,b=draft.b,c=[b[0],a[1]];return <polyline className="lay-draft" points={a[0]+","+a[1]+" "+c[0]+","+c[1]+" "+b[0]+","+b[1]} fill="none"/>;}const a=draft.a,b=draft.b,x=Math.min(a[0],b[0]),y=Math.min(a[1],b[1]),w=Math.abs(b[0]-a[0]),h=Math.abs(b[1]-a[1]);return draft.shape==="line"?<line className="lay-draft" x1={a[0]} y1={a[1]} x2={b[0]} y2={b[1]}/>:draft.shape==="ellipse"?<ellipse className="lay-draft" cx={x+w/2} cy={y+h/2} rx={w/2} ry={h/2}/>:<rect className="lay-draft" x={x} y={y} width={w} height={h}/>;})()}
              {snapHint && (()=>{const c=snapHint.p,r=4.5/zoom;return <g pointerEvents="none"><rect x={c[0]-r} y={c[1]-r} width={r*2} height={r*2} fill="none" stroke="#2F6280" strokeWidth={1.6/zoom}/><circle cx={c[0]} cy={c[1]} r={1.4/zoom} fill="#2F6280"/></g>;})()}
              {sel.length===1 && objs[sel[0]]&&objs[sel[0]].synthetic&&["line","curve","pen","arrow","connector"].includes(objs[sel[0]].syntheticType)&&!live && (
                <g pointerEvents="all">{objs[sel[0]].pts.map((p,k)=>{const q=apply(matOf(sel[0]),p);return (
                  <g key={k}>
                    <circle data-edit-handle={k} cx={q[0]} cy={q[1]} r={11/zoom} fill="#fff" fillOpacity="0.01" stroke="none" style={{cursor:"grab"}}/>
                    <circle cx={q[0]} cy={q[1]} r={5/zoom} fill={k===1&&objs[sel[0]].syntheticType==="curve"?"#2F6280":"#fff"} stroke="#A8462A" strokeWidth={1.4/zoom} pointerEvents="none"/>
                  </g>);})}</g>
              )}
              {selBB && !live && (
                <g pointerEvents="none">
                  <rect x={selBB[0]} y={selBB[1]} width={Math.max(0.1,selBB[2]-selBB[0])}
                    height={Math.max(0.1,selBB[3]-selBB[1])} fill="none" stroke="#A8462A"
                    strokeWidth={1/zoom} strokeDasharray={(5/zoom)+" "+(4/zoom)}/>
                  <g pointerEvents="all">
                    {(()=>{ const mx=(selBB[0]+selBB[2])/2, my=selBB[3], off=28/zoom, r=9/zoom; return (
                      <g>
                        <line x1={mx} y1={my} x2={mx} y2={my+off-r} stroke="#A8462A" strokeWidth={1.2/zoom} pointerEvents="none"/>
                        <g data-handle="rotate" className="lay-rothandle">
                          <circle cx={mx} cy={my+off} r={r+3/zoom} fill="#fff" fillOpacity="0.01" stroke="none"/>
                          <circle cx={mx} cy={my+off} r={r} fill="#fff" stroke="#A8462A" strokeWidth={1.5/zoom}/>
                          <path d={`M ${mx-3.6/zoom} ${my+off+1.4/zoom} A ${3.8/zoom} ${3.8/zoom} 0 1 1 ${mx+2.4/zoom} ${my+off+3.6/zoom}`} fill="none" stroke="#A8462A" strokeWidth={1.6/zoom} strokeLinecap="round"/>
                          <path d={`M ${mx+2.4/zoom} ${my+off+3.6/zoom} l ${0.6/zoom} ${-3.4/zoom} l ${-3.2/zoom} ${1.7/zoom} Z`} fill="#A8462A"/>
                        </g>
                      </g>
                    ); })()}
                    <rect data-handle="scale" x={selBB[2]-4.5/zoom} y={selBB[3]-4.5/zoom}
                      width={9/zoom} height={9/zoom} fill="#fff" stroke="#A8462A"
                      strokeWidth={1.4/zoom} style={{cursor:"nwse-resize"}}/>
                  </g>
                </g>
              )}
            </g>
          </svg>
          {editObj && (()=>{
            const m=matOf(editing.idx), dc=decompose(m), bb=bboxOf(editObj,m);
            if(!bb) return null;
            const cur=editObj.paint||{};
            const sizePt=(cur.textSize||Math.max(6,editObj.bb[3]-editObj.bb[1]))*(dc.scale||1);
            const col=cur.textColor?("#"+cur.textColor.map(v=>("0"+Math.round(Math.max(0,Math.min(1,v))*255).toString(16)).slice(-2)).join("")):"#111111";
            const left=bb[0]*zoom, top=(pageH-bb[3])*zoom;
            const wPx=Math.max(50,(bb[2]-bb[0])*zoom+14);
            return <textarea key={editing.idx} className="lay-edit" autoFocus spellCheck={false}
              defaultValue={editObj.label||""}
              style={{left:left, top:top, width:wPx, fontSize:(sizePt*zoom)+"px", color:col,
                transform:dc.rot?("rotate("+(-dc.rot)+"deg)"):undefined, transformOrigin:"left top"}}
              onFocus={e=>e.target.select()}
              onChange={e=>updateEditText(e.target.value)}
              onPointerDown={e=>e.stopPropagation()}
              onDoubleClick={e=>e.stopPropagation()}
              onBlur={e=>{ if(editing&&editing.t&&(Date.now()-editing.t)<300){ e.target.focus(); return; } commitEdit(); }}
              onKeyDown={e=>{ e.stopPropagation();
                if(e.key==="Escape"){ e.preventDefault(); cancelEdit(); }
                else if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); commitEdit(); } }}/>;
          })()}
        </div>
      </div>

      <div className="side">
        <div className="sec">
          <h4>Layers</h4>
          {health && <div className={"lay-health"+(health.ok?(health.warn?" warn":" ok"):" bad")}>{health.msg}</div>}
        </div>
        <div className="pane">
          {layers.map(L=>{
            const selCount=L.ids.filter(i=>selSet.has(i)).length;
            const editable=L.ids.some(i=>objs[i].bb);
            return (
              <div key={L.key} className={"lay-row"+(selCount?" on":"")} style={{gridTemplateColumns:"16px 20px 25px 1fr 40px"}}>
                <input type="checkbox" checked={L.visible} title="Show / hide this layer"
                  onChange={e=>setLayerVisible(L,e.target.checked)}/>
                {L.hex
                  ? <input type="color" className="swdot" value={L.hex} title="Recolour this layer"
                      onChange={e=>setLayerColor(L,e.target.value)}/>
                  : <span className="swdot" style={{background:L.shex||"#bbb"}}/>}
                <button className={"lay-lock"+(L.locked?" on":"")} title={L.locked?"Unlock layer":"Lock layer"} onClick={()=>setLayerLocked(L,!L.locked)}>{L.locked?"LOCK":"OPEN"}</button>
                <input className="lay-name" value={L.name} onChange={e=>renameLayer(L,e.target.value)}/>
                <button className="lay-pick" disabled={!editable} title="Select this whole layer"
                  onClick={e=>selectLayer(L,e.shiftKey)}>{L.ids.length}</button>
              </div>
            );
          })}
        </div>

        <div className="sec">
          <h4>{sel.length? (sel.length===1? (one.kind==="text"? "Label \u2014 \u201c"+(one.label||"").slice(0,22)+"\u201d" : "1 shape selected") : sel.length+" shapes selected") : "Nothing selected"}</h4>
          {!sel.length && <div className="hint">Click a shape on the drawing, or press a layer's
            count button to grab the whole layer at once. In <b>Layer</b> mode a single click
            takes everything of that colour.</div>}
          {sel.length>0 && <>
            <div className="row"><label>Move</label>
              <div className="seg">
                <button className="segb" onClick={()=>nudge(-10,0)}>&larr;</button>
                <button className="segb" onClick={()=>nudge(10,0)}>&rarr;</button>
                <button className="segb" onClick={()=>nudge(0,10)}>&uarr;</button>
                <button className="segb" onClick={()=>nudge(0,-10)}>&darr;</button>
              </div>
            </div>
            <div className="row"><label>Scale</label>
              <div className="seg">
                <button className="segb" onClick={()=>scaleBy(0.95)}>&minus;5%</button>
                <button className="segb" onClick={()=>scaleBy(1.05)}>+5%</button>
                <button className="segb" onClick={()=>scaleBy(0.5)}>&frac12;&times;</button>
                <button className="segb" onClick={()=>scaleBy(2)}>2&times;</button>
              </div>
            </div>
            {dsc && sel.length===1 && (
              <div className="hint" style={{fontFamily:"var(--mono)"}}>
                offset {dsc.dx.toFixed(1)}, {dsc.dy.toFixed(1)} pt &middot;
                rot {dsc.rot.toFixed(1)}&deg; &middot; scale {dsc.scale.toFixed(3)}&times;
              </div>
            )}
            <div className="row" style={{marginTop:8}}>
              <button className="tb" onClick={resetSel}>Reset to original</button>
              <button className="tb" onClick={()=>setSel([])}>Deselect</button>
            </div>
          </>}
        </div>

        <div className="sec">
          <h4>Vector creation</h4>
          <div className="row"><label>Stroke</label><input type="color" value={shapeStyle.stroke} onChange={e=>applySS({stroke:e.target.value})}/><label style={{width:24}}>Fill</label><input type="color" value={shapeStyle.fill} onChange={e=>applySS({fill:e.target.value})}/></div>
          <div className="row"><label>Line width</label><input className="lay-num" type="number" min="0.1" step="0.5" value={shapeStyle.width} onChange={e=>applySS({width:+e.target.value})}/></div>
          <div className="row"><label>Line style</label><select value={shapeStyle.dash} onChange={e=>applySS({dash:+e.target.value})}><option value="0">Solid</option><option value="1.5">Dotted</option><option value="4">Dashed</option><option value="8">Long dash</option></select></div>
          <div className="row"><label>Opacity</label><input type="range" min="0.1" max="1" step="0.05" value={shapeStyle.opacity} onChange={e=>applySS({opacity:+e.target.value})}/><span className="mono">{Math.round(shapeStyle.opacity*100)}%</span></div>
          <div className="row"><label>Arrowheads</label><label className="chk"><input type="checkbox" checked={!!shapeStyle.arrowStart} onChange={e=>applySS({arrowStart:e.target.checked})}/> Start</label><label className="chk"><input type="checkbox" checked={shapeStyle.arrowEnd!==false} onChange={e=>applySS({arrowEnd:e.target.checked})}/> End</label></div>
          <div className="hint" style={{marginTop:2}}>Arrowheads apply to the Arrow, Connector and (optionally) Line/Curve tools. Opacity, dash and colour bake into the exported PDF.</div>
          <div className="row"><label>Grid snap</label><label className="chk"><input type="checkbox" checked={snap.on} onChange={e=>setSnap(v=>({...v,on:e.target.checked}))}/> On</label><input className="lay-num" type="number" min="0.1" step="0.5" value={snap.grid} onChange={e=>setSnap(v=>({...v,grid:+e.target.value}))}/></div>
          <label className="chk"><input type="checkbox" checked={snap.angle} onChange={e=>setSnap(v=>({...v,angle:e.target.checked}))}/> Snap new lines to 15 degrees</label>
          <label className="chk"><input type="checkbox" checked={snap.geom!==false} onChange={e=>setSnap(v=>({...v,geom:e.target.checked}))}/> Snap to endpoints &amp; midpoints</label>
          <div className="row" style={{marginTop:6}}><label>Text</label><input className="lay-num" type="number" min="4" step="1" title="Font size for the Text tool" value={shapeStyle.textSize} onChange={e=>setShapeStyle(v=>({...v,textSize:+e.target.value}))}/><input type="color" title="Text colour" value={shapeStyle.textColor} onChange={e=>setShapeStyle(v=>({...v,textColor:e.target.value}))}/></div>
        </div>
        <div className="sec">
          <h4>Measure &amp; scale</h4>
          <div className="row"><label>1 pt =</label><input className="lay-num" type="number" step="any" value={dimScale.factor} onChange={e=>setDimScale(d=>({...d,factor:+e.target.value||1}))}/><input className="lay-num" style={{width:52}} type="text" value={dimScale.unit} onChange={e=>setDimScale(d=>({...d,unit:e.target.value}))}/></div>
          <div className="row"><label>Decimals</label><input className="lay-num" type="number" min="0" max="4" value={dimScale.prec} onChange={e=>setDimScale(d=>({...d,prec:+e.target.value|0}))}/></div>
          <div className="row"><button className="tb" onClick={()=>{setTool("dimcal");setDraft(null);toastMsg("Draw a line of known length, then type it");}}>Calibrate by drawing</button></div>
          <div className="hint" style={{marginTop:2}}>Pick the <b>Dim</b> tool (D) and drag to place a measured dimension. Calibrate once against a known length &mdash; a scale bar or a dimensioned edge &mdash; and every dimension reads in your units. Endpoint/midpoint snapping helps you land exactly.</div>
        </div>
        {sel.length===1 && objs[sel[0]] && objs[sel[0]].kind==="text" && objs[sel[0]].syntheticType!=="text" && (()=>{ const to=objs[sel[0]]; return (
          <div className="sec"><h4>Existing PDF text</h4>
            <div className="row"><input type="text" defaultValue={to.label||""} placeholder="Retype and press Enter"
              onKeyDown={e=>{ if(e.key==="Enter"){ editExistingText(sel[0], e.target.value); } }}/></div>
            <div className="row"><button className="tb" onClick={()=>{ const v=prompt("Edit text:",to.label||""); if(v!==null) editExistingText(sel[0],v); }}>Rewrite this text&hellip;</button></div>
            <div className="hint">This is text from the original PDF. Retype it here (or double-click it on the page) and it becomes matching, movable text you can then restyle for size and colour.</div>
          </div>
        ); })()}
                {sel.length===1 && objs[sel[0]] && objs[sel[0]].syntheticType==="text" && (()=>{ const to=objs[sel[0]]; const cur=to.paint||{}; const csz=cur.textSize?Math.round(cur.textSize):Math.max(6,Math.round(to.bb[3]-to.bb[1])); const cco=cur.textColor?("#"+cur.textColor.map(v=>("0"+Math.round(v*255).toString(16)).slice(-2)).join("")):"#222222"; return (
          <div className="sec"><h4>Text</h4>
            <div className="row"><input type="text" value={to.label||""} onChange={e=>restyleTextSel({text:e.target.value})}/></div>
            <div className="row"><label>Size</label><input className="lay-num" type="number" min="4" step="1" value={csz} onChange={e=>restyleTextSel({size:+e.target.value})}/><label style={{width:36}}>Colour</label><input type="color" value={cco} onChange={e=>restyleTextSel({color:e.target.value})}/></div>
            <div className="hint">Edit the wording, size and colour of any label you created or replaced. Double-clicking the text on the page also lets you retype it.</div>
          </div>
        ); })()}
        {sel.length>0 && <div className="sec"><h4>Edit selection</h4>
          <label className="chk" style={{marginBottom:8}}><input type="checkbox" checked={keepLabelsUpright} onChange={e=>setKeepLabelsUpright(e.target.checked)}/> Keep labels upright during group rotation</label>
          <div className="hint" style={{marginBottom:8}}>Rotation is rigid: every vector uses one shared pivot and one angle. Text and CAD-outlined lettering follow the group position without twisting, collapsing, or losing character spacing.</div>
          <div className="row"><label>Rotation</label><input className="lay-num" type="number" step="1" value={dsc?dsc.rot.toFixed(1):0} onChange={e=>{if(!selBB)return;const cur=dsc?dsc.rot:0;rotateBy((+e.target.value||0)-cur)}}/><span className="mono">deg</span></div>
          <div className="row"><button className="tb" onClick={groupSelection} disabled={sel.length<2}>Group</button><button className="tb" onClick={ungroupSelection}>Ungroup</button></div>
          <div className="row"><button className="tb" onClick={()=>copySel()}>Copy</button><button className="tb" onClick={pasteClip}>Paste</button><button className="tb" onClick={duplicateSel}>Duplicate</button></div>
          <div className="row"><label>Order</label>
            <div className="seg">
              <button className="segb" title="Send to back (Ctrl+Shift+[)" onClick={()=>reorder("back")}>&#8676;&#8676;</button>
              <button className="segb" title="Send backward (Ctrl+[)" onClick={()=>reorder("backward")}>&#8676;</button>
              <button className="segb" title="Bring forward (Ctrl+])" onClick={()=>reorder("forward")}>&#8677;</button>
              <button className="segb" title="Bring to front (Ctrl+Shift+])" onClick={()=>reorder("front")}>&#8677;&#8677;</button>
            </div>
          </div>
          <div className="row"><label>Recolour</label><input type="color" onInput={e=>recolorSel(e.target.value)} title="Recolour the selected shapes \u2014 works on the original plan too"/><span className="hint" style={{flex:1}}>Any shape, incl. the original plan</span></div>
          <div className="row"><button className="tb" onClick={restyleSel} title="Apply the Vector creation stroke/fill/width/dash/opacity/arrows to the selected shapes">Apply style to selection</button><button className="tb" onClick={deleteSel}>Delete</button></div>
          <div className="hint" style={{marginTop:2}}>To rotate a label on its own, select just that label and drag the round handle &mdash; it will turn. Selected together with a building, labels stay upright.</div>
        </div>}
        <div className="sec">
          <h4>How editing works</h4>
          <div className="hint">
            Select with the pointer, sweep empty space (left-to-right encloses; right-to-left crosses), Shift/Ctrl-click to add or remove, Group/Ungroup, then drag to move. A round handle sits just above the selection &mdash; drag it to rotate about the centre; the corner square scales.
            Hold <b>Shift</b> while dragging to lock to one axis, snap rotation to 15&deg;,
            or step the scale. Arrow keys nudge a point at a time, Shift+arrow ten. Double-click any text \u2014 including the original PDF text \u2014 to edit it in place, typing right on the drawing (Enter to finish, Esc to cancel). Drag a line\u2019s end handle to swing it about the other end (hold Shift to keep its length, a pure rotate); drag curve/pen points to reshape. Paste an image with Ctrl+V, drag one onto the page, or use the Image button \u2014 it becomes a movable, scalable object baked into the export. Mousewheel zooms at the pointer; middle-drag or Space-drag pans.
            <br/><br/>
            Nothing is redrawn by hand: the page you see is the edited PDF itself, re-rendered
            after every change, so what exports is exactly what is on screen.
          </div>
        </div>
      </div>

      <div className="status">
        <div className="mono">{objs.filter((o,i)=>isAlive(i)).length} active objects &middot; {layers.length} inferred layers</div>
        <div className="mono">{moved? moved+" moved" : "nothing moved yet"}</div>
        <div className="mono">{pageW.toFixed(0)} &times; {pageH.toFixed(0)} pt</div>
        <div style={{flex:1}}></div>
        <div className="mono">Wheel = zoom &middot; Shift+wheel = scroll</div>
      </div>

      <input ref={fileRef} type="file" accept="application/pdf" style={{display:"none"}}
        onChange={e=>{ openFile(e.target.files[0]); e.target.value=""; }}/>
      <input ref={imgInputRef} type="file" accept="image/png,image/jpeg" style={{display:"none"}}
        onChange={e=>{ const f=e.target.files[0]; if(f) placeImageBlob(f); e.target.value=""; }}/>
      {busy && <div className="lay-busy">{busy}</div>}
    </div>
  );
}

return App;
})();


/* =====================================================================
   SHELL — mode switcher, all apps stay mounted
   ===================================================================== */
function Shell(){
  const [mode,setMode]=useState("pdf");
  return (
    <div className="shell">
      <div className="modebar">
        <div className="modebrand">InHouse</div>
        <div className="vertag" title="Fieldset build version">{VERSION}</div>
        <button className={"modebtn pdf"+(mode==="pdf"?" on":"")} onClick={()=>setMode("pdf")}>
          <span className="dot"></span>PDF Markup
        </button>
        <button className={"modebtn dxf"+(mode==="dxf"?" on":"")} onClick={()=>setMode("dxf")}>
          <span className="dot"></span>DXF Site Plan
        </button>
        <button className={"modebtn lay"+(mode==="lay"?" on":"")} onClick={()=>setMode("lay")}>
          <span className="dot"></span>PDF Layout
        </button>
      </div>
      <div className={"modebody"+(mode==="pdf"?" active":"")}>
        <div className="modefill"><RedlineApp/></div>
      </div>
      <div className={"modebody"+(mode==="dxf"?" active":"")}>
        <div className="modefill"><SiteworkApp/></div>
      </div>
      <div className={"modebody"+(mode==="lay"?" active":"")}>
        <div className="modefill lay-theme"><LayoutApp/></div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Shell/>);
</script>
</body>
