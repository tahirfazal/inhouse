    }
    if(!copies.length){ toastMsg("No pages to copy onto"); return; }
    pushHistory(ann,scales);
    setAnn(prev=>[...prev,...copies]);
    toastMsg(copies.length+" markups copied across pages "+lo+"\u2013"+hi);
    setBatchModal(false);
  }

  function applyStyleToSelection(k,v){
    if(selIds.length){
      beginChange();
      setAnn(prev=>prev.map(a=> selIds.includes(a.id) ? {...a, style:{...a.style,[k]:v}} : a));
      commitChangeSoon(400);
    } else setStyle(s=>({...s,[k]:v}));
  }
  function deleteSelection(){
    if(!selIds.length) return;
    pushHistory(ann,scales);
    setAnn(prev=>prev.filter(a=>!selIds.includes(a.id)));
    setSelIds([]); setEditing(null);
  }
  function duplicateSelection(){
    if(!selIds.length) return;
    pushHistory(ann,scales);
    const copies=ann.filter(a=>selIds.includes(a.id)).map(a=>{
      const c=JSON.parse(JSON.stringify(a)); c.id=uid(); c.pts=c.pts.map(p=>[p[0]+14,p[1]+14]); return c; });
    setAnn(prev=>[...prev,...copies]); setSelIds(copies.map(c=>c.id));
  }
  /* ---------- format painter ----------
     Pick the look up off one markup, then drop it onto as many as you like.
     Only appearance travels: position, text and geometry are never touched. */
  function grabFormat(id){
    const a=ann.find(x=>x.id===id); if(!a) return false;
    const src=Object.assign({},DEFSTYLE,a.style), out={};
    FMTKEYS.forEach(k=>{ out[k]=src[k]; });
    fmtRef.current=out; setFmtArmed(true);
    toastMsg("Format picked up from "+(LABEL[a.type]||"markup")+" \u2014 now click the markups to paint");
    return true;
  }
  function applyFormat(ids){
    if(!fmtRef.current || !ids.length) return;
    pushHistory(ann,scales);
    setAnn(prev=>prev.map(a=> ids.includes(a.id) ? {...a,style:Object.assign({},a.style,fmtRef.current)} : a));
    toastMsg("Format painted onto "+ids.length+" markup"+(ids.length===1?"":"s"));
  }
  function copyFormat(){
    if(selIds.length!==1){ toastMsg("Select exactly one markup to copy its format"); return; }
    grabFormat(selIds[0]);
  }
  function pasteFormat(){
    if(!fmtRef.current){ toastMsg("Nothing copied yet \u2014 Ctrl+Shift+C first"); return; }
    if(!selIds.length){ toastMsg("Select the markups to paint"); return; }
    applyFormat(selIds);
  }
  function clearFormat(){ fmtRef.current=null; setFmtArmed(false); toastMsg("Format painter emptied"); }
  /* Clicking a markup with the painter active: the first click fills the brush,
     every click after that paints. */
  function onFormatClick(id){
    if(!fmtRef.current){ grabFormat(id); return; }
    applyFormat([id]);
  }

  function openCtx(clientX,clientY,hasSel){ setCtx({x:clientX,y:clientY,hasSel:!!hasSel}); }

  /* Selecting something pulls the Properties tab forward, the way a docked
     properties panel would. Layers is left alone because "move selection to
     layer" is an action you perform there with a selection already made. */
  useEffect(()=>{
    if(selIds.length && !hadSelRef.current && tab!=="layers") setTab("props");
    hadSelRef.current=selIds.length;
  },[selIds]);

  /* ---- stacking order (paint order == array order) ---- */
  function reorderSelection(mode){
    if(!selIds.length){ toastMsg("Select a markup first"); return; }
    pushHistory(ann,scales);
    setAnn(prev=>{
      const sel=prev.filter(a=>selIds.includes(a.id));
      const rest=prev.filter(a=>!selIds.includes(a.id));
      if(mode==="front") return [...rest,...sel];
      if(mode==="back")  return [...sel,...rest];
      const arr=prev.slice();
      if(mode==="forward"){
        for(let i=arr.length-2;i>=0;i--)
          if(selIds.includes(arr[i].id) && !selIds.includes(arr[i+1].id)){ const t=arr[i]; arr[i]=arr[i+1]; arr[i+1]=t; }
      }else{
        for(let i=1;i<arr.length;i++)
          if(selIds.includes(arr[i].id) && !selIds.includes(arr[i-1].id)){ const t=arr[i]; arr[i]=arr[i-1]; arr[i-1]=t; }
      }
      return arr;
    });
    toastMsg(mode==="front"?"Brought to front":mode==="back"?"Sent to back":mode==="forward"?"Brought forward":"Sent backward");
  }

  /* ---- clipboard (in-app, survives page switches) ---- */
  const clipRef=useRef([]);
  function copySelection(quiet){
    if(!selIds.length) return false;
    clipRef.current=ann.filter(a=>selIds.includes(a.id)).map(a=>JSON.parse(JSON.stringify(a)));
    if(!quiet) toastMsg(clipRef.current.length+" copied");
    return true;
  }
  function cutSelection(){ if(copySelection(true)){ const k=selIds.length; deleteSelection(); toastMsg(k+" cut"); } }
  function pasteClipboard(){
    if(!clipRef.current.length){ toastMsg("Clipboard is empty"); return; }
    pushHistory(ann,scales);
    const copies=clipRef.current.map(a=>{
      const c=JSON.parse(JSON.stringify(a)); c.id=uid(); c.page=current;
      c.pts=c.pts.map(p=>[p[0]+16,p[1]+16]); return c; });
    setAnn(prev=>[...prev,...copies]);
    setSelIds(copies.map(c=>c.id)); setTool("select");
    toastMsg(copies.length+" pasted onto page "+current);
  }

  function setText(id,v){
    beginChange();
    setAnn(prev=>prev.map(a=> a.id===id ? {...a, text:v} : a));
    commitChangeSoon(600);
  }
  /* leaving the inline editor settles the undo step immediately */
  function setEditingCommit(v){ if(v===null) commitChange(); setEditing(v); }

  /* Mouse wheel zooms about the pointer, so whatever is under the cursor stays
     under the cursor. Shift+wheel falls back to plain scrolling. The listener is
     attached natively because React registers wheel handlers passively, which
     would make preventDefault silently do nothing. */
  useEffect(()=>{
    const el=viewerRef.current; if(!el) return;
    function onWheel(e){
      if(e.shiftKey) return;
      e.preventDefault();
      const r=el.getBoundingClientRect();
      const px=e.clientX-r.left, py=e.clientY-r.top;
      const cx=px+el.scrollLeft, cy=py+el.scrollTop;
      const step=e.deltaY<0 ? 1.12 : 1/1.12;
      setZoom(z=>{
        const nz=Math.max(0.1,Math.min(8,z*step));
        if(Math.abs(nz-z)<1e-6) return z;
        const k=nz/z;
        requestAnimationFrame(()=>{ el.scrollLeft=cx*k-px; el.scrollTop=cy*k-py; });
        return nz;
      });
    }
    el.addEventListener("wheel",onWheel,{passive:false});
    return ()=>el.removeEventListener("wheel",onWheel);
  },[]);

  /* Hold Alt and every button shows the key that fires it. */
  useEffect(()=>{
    function down(e){ if(e.key==="Alt"){ e.preventDefault(); setAltHint(true); } }
    function up(e){ if(e.key==="Alt") setAltHint(false); }
    function off(){ setAltHint(false); }
    window.addEventListener("keydown",down);
    window.addEventListener("keyup",up);
    window.addEventListener("blur",off);
    return ()=>{ window.removeEventListener("keydown",down);
      window.removeEventListener("keyup",up); window.removeEventListener("blur",off); };
  },[]);

  useEffect(()=>{
    function onKey(e){
      /* While an inline text editor is open it owns the keyboard completely:
         Delete/Backspace/Escape/Enter must reach the caret, not the app. */
      if(editing) return;
      const ae=document.activeElement;
      const typing=/^(INPUT|TEXTAREA|SELECT)$/.test((ae&&ae.tagName)||"") || !!(ae&&ae.isContentEditable);
      const mod=e.ctrlKey||e.metaKey;
      const k=(e.key||"").toLowerCase();

      /* Ctrl-combinations are suppressed inside form fields so the browser's
         own text editing (undo, select-all, paste) keeps working there. */
      if(mod && !typing){
        if(k==="z"){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
        if(k==="y"){ e.preventDefault(); redo(); return; }
        if(k==="a" && doc){ e.preventDefault(); setTool("select");
          setSelIds(ann.filter(a=>a.page===current).map(a=>a.id)); return; }
        if(k==="d" && selIds.length){ e.preventDefault(); duplicateSelection(); return; }
        if(k==="c" && e.shiftKey){ e.preventDefault(); copyFormat(); return; }
        if(k==="v" && e.shiftKey){ e.preventDefault(); pasteFormat(); return; }
        if(k==="o"){ e.preventDefault(); fileInputRef.current.click(); return; }
        if(k==="s" && doc){ e.preventDefault(); saveAsPdf(); return; }
        if(k==="c" && selIds.length){ e.preventDefault(); copySelection(); return; }
        if(k==="x" && selIds.length){ e.preventDefault(); cutSelection(); return; }
        if(k==="v"){ e.preventDefault(); pasteClipboard(); return; }
        if(e.key==="]"||e.key==="}"){ e.preventDefault(); reorderSelection(e.shiftKey?"front":"forward"); return; }
        if(e.key==="["||e.key==="{"){ e.preventDefault(); reorderSelection(e.shiftKey?"back":"backward"); return; }
        if(k==="0"){ e.preventDefault(); setZoom(1); return; }
        if(e.key==="="||e.key==="+"){ e.preventDefault(); setZoom(z=>Math.min(8,z*1.25)); return; }
        if(e.key==="-"||e.key==="_"){ e.preventDefault(); setZoom(z=>Math.max(0.1,z/1.25)); return; }
        return;
      }
      if(typing || mod) return;

      /* Escape unwinds one layer at a time rather than throwing everything away */
      if(e.key==="Escape"){
        if(tool==="format" && fmtRef.current){ clearFormat(); return; }
        if(draft){ setDraft(null); return; }
        if(selIds.length){ setSelIds([]); return; }
        if(tool!=="select") chooseTool("select");
        return;
      }
      if(e.key==="Enter" && draft && finishRef.current){ e.preventDefault(); finishRef.current(); return; }
      if((e.key==="Delete"||e.key==="Backspace") && selIds.length){ e.preventDefault(); deleteSelection(); return; }
      if(e.key==="PageDown"){ e.preventDefault(); setCurrent(c=>Math.min(pageMeta.length||1,c+1)); setSelIds([]); return; }
      if(e.key==="PageUp"){ e.preventDefault(); setCurrent(c=>Math.max(1,c-1)); setSelIds([]); return; }
      if(TOOLKEY[k] && !e.altKey){ e.preventDefault(); chooseTool(TOOLKEY[k]); return; }
      if(selIds.length && e.key.startsWith("Arrow")){
        e.preventDefault();
        const d=e.shiftKey?10:1;
        const dx=e.key==="ArrowLeft"?-d:e.key==="ArrowRight"?d:0, dy=e.key==="ArrowUp"?-d:e.key==="ArrowDown"?d:0;
        beginChange();
        setAnn(prev=>prev.map(a=> selIds.includes(a.id)? {...a,pts:a.pts.map(p=>[p[0]+dx,p[1]+dy])} : a));
        commitChangeSoon(500);
      }
    }
    window.addEventListener("keydown",onKey);
    return ()=>window.removeEventListener("keydown",onKey);
  },[selIds,ann,scales,undoStack,redoStack,draft,doc,current,editing,tool,pageMeta]);

  function dl(blob,name){ const u=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=u; a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(u),4000); }

  async function saveAsPdf(){
    if(!bytesRef.current) return;
    setSaving(true);
    try{
      const pdf=await PDFDocument.load(bytesRef.current,{ignoreEncryption:true});
      /* Fonts are embedded on demand and cached, so a sheet that only uses
         Helvetica never carries Times or Courier along for the ride. */
      const FMAP={
        sans: {"":"Helvetica","B":"HelveticaBold","I":"HelveticaOblique","BI":"HelveticaBoldOblique"},
        serif:{"":"TimesRoman","B":"TimesRomanBold","I":"TimesRomanItalic","BI":"TimesRomanBoldItalic"},
        mono: {"":"Courier","B":"CourierBold","I":"CourierOblique","BI":"CourierBoldOblique"}
      };
      const fontCache={};
      async function fontFor(t){
        const fam=(t&&t.font)||"sans", sfx=((t&&t.bold)?"B":"")+((t&&t.italic)?"I":"");
        const key=fam+"|"+sfx;
        if(!fontCache[key]){
          const nm=(FMAP[fam]||FMAP.sans)[sfx]||"Helvetica";
          fontCache[key]=await pdf.embedFont(StandardFonts[nm]||StandardFonts.Helvetica);
        }
        return fontCache[key];
      }
      const pages=pdf.getPages();
      for(const a of ann){
        const pg=pages[a.page-1]; if(!pg) continue;
        const {width:Wu,height:Hu}=pg.getSize();
        const rot=((pg.getRotation().angle%360)+360)%360;
        const st=Object.assign({},DEFSTYLE,a.style), col=rgb(...hex2rgb(st.stroke));
        const G=geom({...a, scale:scales[a.page]||DEFSCALE});
        G.fills.forEach(f=> pg.drawSvgPath(pdfPath(f.pts,rot,Wu,Hu,true),{x:0,y:0,scale:1,color:rgb(...hex2rgb(f.color)),opacity:f.op,borderWidth:0}));
        G.strokes.forEach(s=>{ if(s.pts.length<2||st.width<=0) return;
          pg.drawSvgPath(pdfPath(s.pts,rot,Wu,Hu,s.closed),{x:0,y:0,scale:1,borderColor:col,borderWidth:st.width,
            borderOpacity:st.opacity,borderLineCap:1,borderDashArray: st.dash?[st.dash*3,st.dash*2]:undefined}); });
        G.arrows.forEach(t=> pg.drawSvgPath(pdfPath(t,rot,Wu,Hu,true),{x:0,y:0,scale:1,color:col,opacity:st.opacity,borderWidth:0}));
        for(const t of G.texts){
          const tf=await fontFor(t);
          const rA=t.rot? t.rot.a : 0, rad=rA*Math.PI/180;
          const place=q=> t.rot ? rotPt(q,t.rot.cx,t.rot.cy,rad) : q;
          if(t.badge){
            const w=Math.max(...t.lines.map(l=>tf.widthOfTextAtSize(l,t.size)))+8, h=t.lines.length*t.size*1.2+5;
            const x0=t.x-(t.center?w/2:0), y0=t.y-(t.center?h/2:0);
            pg.drawSvgPath(pdfPath([[x0,y0],[x0+w,y0],[x0+w,y0+h],[x0,y0+h]].map(place),rot,Wu,Hu,true),
              {x:0,y:0,scale:1,color:rgb(1,1,1),opacity:0.86,borderColor:col,borderWidth:0.5,borderOpacity:0.5});
          }
          const tcol=rgb(...hex2rgb(t.color));
          t.lines.forEach((ln,i)=>{
            if(!ln) return;
            const y=t.badge&&t.center ? t.y-(t.lines.length*t.size*1.2)/2+t.size*0.95+i*t.size*1.2 : t.y+i*t.size*1.2;
            const w=tf.widthOfTextAtSize(ln,t.size);
            const mid = t.center || t.align==="center", right = !t.center && t.align==="right";
            const x = mid ? t.x-w/2 : right ? t.x-w : t.x;
            const D=toPdf(place([x,y]),rot,Wu,Hu);
            pg.drawText(ln,{x:D[0],y:D[1],size:t.size,font:tf,color:tcol,opacity:st.opacity,rotate:degrees(rot-rA)});
            /* underline / strike-through are drawn as hairline bars so they
               rotate and export exactly like the glyphs above them */
            if(t.underline||t.strike){
              const bar=(off)=>{
                const th=Math.max(0.5,t.size*0.06);
                const q1=place([x,y+off]), q2=place([x+w,y+off]);
                const dx=q2[0]-q1[0], dy=q2[1]-q1[1], L=Math.hypot(dx,dy)||1;
                const ux=-dy/L*th/2, uy=dx/L*th/2;
                pg.drawSvgPath(pdfPath([[q1[0]-ux,q1[1]-uy],[q2[0]-ux,q2[1]-uy],[q2[0]+ux,q2[1]+uy],[q1[0]+ux,q1[1]+uy]],rot,Wu,Hu,true),
                  {x:0,y:0,scale:1,color:tcol,opacity:st.opacity,borderWidth:0});
              };
              if(t.underline) bar(t.size*0.17);
              if(t.strike)    bar(-t.size*0.28);
            }
          });
        }
      }
      dl(new Blob([await pdf.save()],{type:"application/pdf"}), fname.replace(/\.pdf$/i,"")+"-markup.pdf");
      toastMsg("Saved "+ann.length+" markups into a new PDF");
    }catch(err){ toastMsg("Save failed: "+err.message); console.error(err); }
    setSaving(false);
  }
  function saveLayer(){
    if(!ann.length && !Object.keys(scales).length){ toastMsg("Nothing to save yet"); return; }
    dl(new Blob([JSON.stringify({v:2,file:fname,ann,scales,layers},null,1)],{type:"application/json"}), fname.replace(/\.pdf$/i,"")+".markup.json");
  }
  async function loadLayer(e){
    const f=e.target.files[0]; if(!f) return;
    try{ const o=JSON.parse(await f.text()); pushHistory(ann,scales);
      const incoming=o.ann||[];
      setAnn(incoming); setScales(o.scales||{}); setSelIds([]);
      const names=Array.from(new Set(incoming.map(a=>a.layer||"Default")));
      const restored=(o.layers&&o.layers.length)? o.layers.slice() : [{name:"Default",visible:true,locked:false}];
      names.forEach(n=>{ if(!restored.some(l=>l.name===n)) restored.push({name:n,visible:true,locked:false}); });
      if(!restored.some(l=>l.name==="Default")) restored.unshift({name:"Default",visible:true,locked:false});
      setLayers(restored); setActiveLayer("Default");
      toastMsg("Markup layer loaded ("+(o.ann||[]).length+")"); }
    catch(err){ toastMsg("That file isn't a Redline markup layer"); }
    e.target.value="";
  }
  function exportCsv(){
    const head="Page,Layer,Type,Subject,Author,Created,Measurement,Text\n";
    const body=ann.map(a=>{
      const sc=scales[a.page]||DEFSCALE; let m="";
      if(a.type==="mdist") m=fmtLen(polyLen(a.pts,false),sc);
      else if(a.type==="marea"||a.type==="polygon"||a.type==="rect") m=fmtArea(polyArea(a.type==="rect"?(function(){const b=bbox(a.pts);return [[b[0],b[1]],[b[2],b[1]],[b[2],b[3]],[b[0],b[3]]];})():a.pts),sc);
      const q=s=>'"'+String(s||"").replace(/"/g,'""')+'"';
      return [a.page,q(a.layer||"Default"),LABEL[a.type],q(a.subject),q(a.author),a.created,q(m),q(a.text)].join(",");
    }).join("\n");
    dl(new Blob([head+body],{type:"text/csv"}), fname.replace(/\.pdf$/i,"")+"-markups.csv");
  }

  return (
    <div className="app redline-theme">
      <div className="top">
        <div className="brand">Red<span>line</span></div>
        <button className="tb" onClick={()=>fileInputRef.current.click()}>Open PDF<KB k="^O" on={altHint}/></button>
        <button className="tb primary" onClick={saveAsPdf} disabled={!doc||saving}>{saving?"Saving…":"Save PDF"}<KB k="^S" on={altHint}/></button>
        <div className="sep"></div>
        <button className="tb icon" title={"Undo (Ctrl+Z) \u2014 "+undoStack.length+" step"+(undoStack.length===1?"":"s")+" available"}
          disabled={!undoStack.length} onClick={undo}>&#8630;<KB k="^Z" on={altHint}/></button>
        <div className="mono" style={{minWidth:34,textAlign:"center",opacity:0.65,fontSize:11}}>{undoStack.length}/{redoStack.length}</div>
        <button className="tb icon" title={"Redo (Ctrl+Y) \u2014 "+redoStack.length+" step"+(redoStack.length===1?"":"s")+" available"}
          disabled={!redoStack.length} onClick={redo}>&#8631;<KB k="^Y" on={altHint}/></button>
        <div className="sep"></div>
        <button className="tb icon" title="Zoom out (Ctrl+\u2212, or scroll the wheel down)" onClick={()=>setZoom(z=>Math.max(0.1,z/1.25))}>&minus;<KB k="^-" on={altHint}/></button>
        <div className="mono" style={{minWidth:48,textAlign:"center"}}>{Math.round(zoom*100)}%</div>
        <button className="tb icon" title="Zoom in (Ctrl+=, or scroll the wheel up)" onClick={()=>setZoom(z=>Math.min(8,z*1.25))}>+<KB k="^+" on={altHint}/></button>
        <button className="tb" onClick={()=>setZoom(1)}>100%<KB k="^0" on={altHint}/></button>
        <button className="tb icon" title="Rotate view 90°" onClick={()=>setViewRot(r=>(r+90)%360)}>&#10227;</button>
        <div className="sep"></div>
        <button className={"tb"+(grid.on?" primary":"")} title="Show grid" onClick={()=>setGrid(g=>({...g,on:!g.on}))}>Grid</button>
        <button className={"tb"+(grid.snap?" primary":"")} title="Snap to grid" onClick={()=>setGrid(g=>({...g,snap:!g.snap,on:g.snap?g.on:true}))}>Snap</button>
        <input className="mono numin" type="number" min="4" max="200" step="2" title="Grid spacing (pt)"
          value={grid.size} onChange={e=>setGrid(g=>({...g,size:Math.max(4,Math.min(400,parseInt(e.target.value)||36))}))}/>
        <button className={"tb"+(lockTool?" primary":"")}
          title={"Sticky tools \u2014 "+(lockTool?"ON: the tool stays active after each markup (Bluebeam-style)":"OFF: snaps back to Select after each markup")}
          onClick={()=>setLockTool(v=>!v)}>Sticky</button>
        <div className="sep"></div>
        <button className="tb icon" disabled={current<=1} onClick={()=>{setCurrent(c=>Math.max(1,c-1)); setSelIds([]);}}>&#8249;</button>
        <input className="mono numin" style={{width:38}}
          value={current} onChange={e=>{ const n=parseInt(e.target.value)||1; setCurrent(Math.max(1,Math.min(pageMeta.length||1,n))); setSelIds([]); }}/>
        <div className="mono">/ {pageMeta.length}</div>
        <button className="tb icon" disabled={current>=pageMeta.length} onClick={()=>{setCurrent(c=>Math.min(pageMeta.length,c+1)); setSelIds([]);}}>&#8250;</button>
        <div style={{flex:1}}></div>
        <button className="tb" onClick={saveLayer}>Save markup file</button>
        <button className="tb" onClick={()=>layerInputRef.current.click()}>Load markup file</button>
      </div>

      <div className="rail">
        {TOOLS.map((grp,gi)=>(
          <div className="tgroup" key={gi}>
            <div className="glab">{grp.g}</div>
            {grp.items.map(id=>(
              <button key={id} className={"tool"+(tool===id?" on":"")+(id==="format"&&fmtArmed?" armed":"")}
                title={LABEL[id]+(KEYFOR[id]?"   ("+KEYFOR[id]+")":"")} onClick={()=>chooseTool(id)}>
                <ToolIcon name={id}/><span>{LABEL[id]}</span>
                <KB k={KEYFOR[id]} on={altHint}/>
              </button>
            ))}
          </div>
        ))}
      </div>

      <div className="viewer" ref={viewerRef} onDragOver={e=>e.preventDefault()} onDrop={onDrop}>
        {!doc ? (
          <div className="emptyv">
            <div className="big">Drop a PDF here</div>
            <div className="sub">Everything runs in this browser tab — the file is never uploaded. Mark it up, calibrate a scale, measure areas, paint-fill parcels, retype existing PDF text, then save a new PDF with it all baked in.</div>
            <button className="tb primary" onClick={()=>fileInputRef.current.click()}>Open PDF</button>
          </div>
        ) : (
          <PageView
            meta={pageMeta[current-1]} pageNum={current} zoom={zoom} viewRot={viewRot}
            tool={tool} ann={ann} setAnn={setAnn} scale={curScale}
            selIds={selIds} setSelIds={setSelIds} draft={draft} setDraft={setDraft}
            style={style} author={author} addAnnotation={addAnnotation}
            beginChange={beginChange} commitChange={commitChange} cancelChange={cancelChange}
            dragRef={dragRef} finishRef={finishRef}
            setCoord={setCoord} editing={editing} setEditing={setEditingCommit} setText={setText}
            onContext={openCtx} onFormatClick={onFormatClick} fmtArmed={fmtArmed}
            onCalibrateDone={(lenPt)=>setCalModal({page:current,lenPt})}
            layers={layers} activeLayer={activeLayer} grid={grid} tolerance={tolerance}
            stampText={stampText} symKey={symKey} textItems={textItems} fname={fname}
          />
        )}
      </div>

      <div className="side">
        <div className="tabs">
          {["props","list","layers","scale","keys"].map(t=>(
            <button key={t} className={"tab"+(tab===t?" on":"")} onClick={()=>setTab(t)}>
              {t==="props"?"Properties":t==="list"?"Markups":t==="layers"?"Layers":t==="scale"?"Scale":"Keys"}</button>
          ))}
        </div>
        {tab==="layers" && (
          <LayersPane layers={layers} setLayers={setLayers} ann={ann}
            activeLayer={activeLayer} setActiveLayer={setActiveLayer}
            onAdd={addLayer} onRemove={removeLayer} onRename={renameLayer}
            selCount={selIds.length} onMoveSel={moveSelectionToLayer}/>
        )}
        {tab==="keys" && <KeysPane/>}
        {tab==="props" && (
          <PropsPane selAnns={selAnns} one={one} tool={tool} style={style} setStyle={setStyle}
            lockTool={lockTool} setLockTool={setLockTool}
            tolerance={tolerance} setTolerance={setTolerance}
            stampText={stampText} setStampText={setStampText}
            symKey={symKey} setSymKey={setSymKey}
            applyStyle={applyStyleToSelection}
            onChangeText={v=>one&&setText(one.id,v)}
            onChangeSubject={v=>one&&setAnn(prev=>prev.map(a=>a.id===one.id?{...a,subject:v}:a))}
            onChangeAuthor={v=>{ setAuthor(v); one&&setAnn(prev=>prev.map(a=>a.id===one.id?{...a,author:v}:a)); }}
            onDelete={deleteSelection} onDuplicate={duplicateSelection}/>
        )}
        {tab==="list" && (
          <ListPane ann={ann} scales={scales} selIds={selIds} layers={layers}
            onBatch={()=>setBatchModal(true)}
            onPick={(a,additive)=>{ setCurrent(a.page); setTool("select");
              setSelIds(ids=> additive ? (ids.includes(a.id)? ids.filter(i=>i!==a.id) : [...ids,a.id]) : [a.id]); setTab("props"); }}
            onExport={exportCsv}/>
        )}
        {tab==="scale" && (
          <ScalePane page={current} scale={curScale} ann={ann} pageCount={pageMeta.length}
            onApply={(v,all)=>{ pushHistory(ann,scales);
              if(all){ const ns={}; for(let i=1;i<=pageMeta.length;i++) ns[i]=Object.assign({},v); setScales(ns); toastMsg("Scale applied to all pages"); }
              else { setScales(s=>({...s,[current]:v})); toastMsg("Scale applied to page "+current); } }}
            onCalibrateClick={()=>{ chooseTool("calibrate"); toastMsg("Draw a line of known length"); }}/>
        )}
      </div>

      {altHint && <div className="altnote">Shortcuts \u2014 release Alt to hide</div>}

      <div className="status">
        <div className="mono">{doc? fname+"  ·  "+pageMeta.length+" pp" : "No document"}</div>
        <div className="mono">Tool: {LABEL[tool]}</div>
        <div className="mono">Scale: {scales[current] ? "1 pt = "+scales[current].factor.toPrecision(4)+" "+scales[current].unit : "uncalibrated"}</div>
        <div className="mono">{ann.length} markup{ann.length===1?"":"s"}{selIds.length?"  ·  "+selIds.length+" selected":""}</div>
        <div className="mono">Layer: {activeLayer}</div>
        {fmtArmed && <div className="mono" style={{color:"var(--accent)"}}>Format painter loaded</div>}
        <div style={{flex:1}}></div>
        <div className="mono">Wheel = zoom · Shift+wheel = scroll · Alt = shortcuts</div>
        <div className="mono">{coord}</div>
      </div>

      <input ref={fileInputRef} type="file" accept="application/pdf" style={{display:"none"}} onChange={onFileChange}/>
      <input ref={layerInputRef} type="file" accept="application/json" style={{display:"none"}} onChange={loadLayer}/>

      {batchModal && (
        <BatchModal pageCount={pageMeta.length} current={current} selCount={selIds.length}
          onCancel={()=>setBatchModal(false)} onApply={batchCopy}/>
      )}

      {ctx && (
        <ContextMenu x={ctx.x} y={ctx.y} onClose={()=>setCtx(null)}
          head={selIds.length ? (selIds.length===1 ? LABEL[(ann.find(a=>a.id===selIds[0])||{}).type]||"Markup"
                                                  : selIds.length+" markups") : null}
          items={ selIds.length ? [
            {t:"Properties",     k:"",           go:()=>setTab("props")},
            {sep:1},
            {t:"Cut",            k:"Ctrl+X",     go:cutSelection},
            {t:"Copy",           k:"Ctrl+C",     go:()=>copySelection()},
            {sep:1},
            {t:"Copy formatting",  k:"Ctrl+Shift+C", off:selIds.length!==1, go:copyFormat},
            {t:"Paste formatting", k:"Ctrl+Shift+V", off:!fmtRef.current,   go:pasteFormat},
            {t:"Duplicate",      k:"Ctrl+D",     go:duplicateSelection},
            {t:"Delete",         k:"Del",        go:deleteSelection},
            {sep:1},
            {t:"Bring to front", k:"Ctrl+Shift+]", go:()=>reorderSelection("front")},
            {t:"Bring forward",  k:"Ctrl+]",     go:()=>reorderSelection("forward")},
            {t:"Send backward",  k:"Ctrl+[",     go:()=>reorderSelection("backward")},
            {t:"Send to back",   k:"Ctrl+Shift+[", go:()=>reorderSelection("back")},
            {sep:1},
            {t:"Copy to pages\u2026", k:"",      go:()=>setBatchModal(true)},
            {t:"Deselect",       k:"Esc",        go:()=>setSelIds([])}
          ] : [
            {t:"Paste",          k:"Ctrl+V",     off:!clipRef.current.length, go:pasteClipboard},
            {t:"Select all on page", k:"Ctrl+A", off:!doc,
              go:()=>{ setTool("select"); setSelIds(ann.filter(a=>a.page===current).map(a=>a.id)); }},
            {sep:1},
            {sep:1},
            {t:"Zoom to 100%",   k:"Ctrl+0",     go:()=>setZoom(1)},
            {t:"Format painter", k:"F",          off:tool==="format", go:()=>chooseTool("format")},
            {t:"Back to Select tool", k:"V",     off:tool==="select", go:()=>chooseTool("select")}
          ]}/>
      )}

      {calModal && (
        <CalModal lenPt={calModal.lenPt} onCancel={()=>setCalModal(null)}
          onApply={(value,unit,prec,all)=>{
            if(!value||!isFinite(value)||calModal.lenPt<=0){ toastMsg("Enter a length greater than zero"); return; }
            const sc={factor:value/calModal.lenPt,unit,prec};
            pushHistory(ann,scales);
            if(all){ const ns={}; for(let i=1;i<=pageMeta.length;i++) ns[i]=Object.assign({},sc); setScales(ns); }
            else setScales(s=>({...s,[calModal.page]:sc}));
            setTool("select"); setCalModal(null);
            toastMsg("Scale set · 1 pt = "+sc.factor.toPrecision(4)+" "+sc.unit);
          }}/>
      )}
    </div>
  );
}

/* Inline text editor. Focus is forced on mount (autoFocus is unreliable inside
   a <foreignObject>), the caret is placed at the clicked character, Enter
   commits, Shift+Enter adds a line, Escape reverts, blur commits. */
function TextEditor({a,box,caretAt,onChange,onCommit,onCancel}){
  const ref=useRef(null);
  const origRef=useRef(a.text||"");
  useEffect(()=>{
    origRef.current=a.text||"";
    const el=ref.current; if(!el) return;
    const t=setTimeout(()=>{
      try{ el.focus({preventScroll:true}); }catch(err){ try{ el.focus(); }catch(e2){} }
      const len=(el.value||"").length;
      const c=(caretAt==null||caretAt<0)?len:Math.min(caretAt,len);
      try{ el.setSelectionRange(c,c); }catch(err){}
    },0);
    return ()=>clearTimeout(t);
  },[a.id]);
  const stl=Object.assign({},DEFSTYLE,a.style);
  const fs=stl.fontSize||12;
  const w=Math.max(60,(box[2]-box[0])+Math.max(40,fs*4));
  const h=Math.max(fs*1.55,(box[3]-box[1])+5);
  return (
    <foreignObject x={box[0]-2} y={box[1]-2.5} width={w} height={h}>
      <textarea ref={ref} className={"editbox"+(a.type==="ptext"?" cover":"")} defaultValue={a.text} spellCheck={false}
        style={{fontSize:fs+"px",color:stl.stroke||"#111111",fontFamily:fontCssOf(stl),
          fontWeight:stl.bold?"bold":"normal", fontStyle:stl.italic?"italic":"normal",
          textAlign:stl.align||"left",
          textDecoration:[stl.underline?"underline":"",stl.strike?"line-through":""].join(" ").trim()||"none"}}
        onChange={e=>onChange(a.id,e.target.value)}
        onBlur={()=>onCommit()}
        onPointerDown={e=>e.stopPropagation()}
        onDoubleClick={e=>e.stopPropagation()}
        onKeyDown={e=>{
          e.stopPropagation();
          if(e.key==="Escape"){ e.preventDefault(); onChange(a.id,origRef.current); onCancel(); return; }
          if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); onCommit(); return; }
        }}/>
    </foreignObject>
  );
}

function PageView({meta,pageNum,zoom,viewRot,tool,ann,setAnn,scale,selIds,setSelIds,draft,setDraft,style,author,
                   addAnnotation,beginChange,commitChange,cancelChange,dragRef,finishRef,setCoord,
                   editing,setEditing,setText,onCalibrateDone,onContext,onFormatClick,fmtArmed,
                   layers,activeLayer,grid,tolerance,stampText,symKey,textItems,fname}){
  const canvasRef=useRef(null), svgRef=useRef(null), gRootRef=useRef(null);
  const [marquee,setMarquee]=useState(null);
  const [hoverT,setHoverT]=useState(-1);
  const [caretAt,setCaretAt]=useState(null);
  useEffect(()=>{ setHoverT(-1); },[tool,pageNum]);

  const layerOf=name=>(layers||[]).find(l=>l.name===name);
  const isVisible=a=>{ const l=layerOf(a.layer||"Default"); return !l || l.visible!==false; };
  const isLocked=a=>{ const l=layerOf(a.layer||"Default"); return !!(l && l.locked); };

  const rot=viewRot%360;
  const dispW = rot%180===0 ? meta.width : meta.height;
  const dispH = rot%180===0 ? meta.height : meta.width;
  const rotTransform=(()=>{ const W=meta.width,H=meta.height;
    switch(rot){ case 90: return `translate(${H},0) rotate(90)`; case 180: return `translate(${W},${H}) rotate(180)`;
      case 270: return `translate(0,${W}) rotate(-90)`; default: return ""; } })();

  useEffect(()=>{
    async function render(){
      const dpr=Math.min(window.devicePixelRatio||1,2);
      const vp=meta.pageObj.getViewport({scale:zoom*dpr, rotation:((meta.rotate||0)+viewRot+360)%360});
      const cv=canvasRef.current; if(!cv) return;
      cv.width=Math.round(vp.width); cv.height=Math.round(vp.height);
      const ctx=cv.getContext("2d",{alpha:false}); ctx.fillStyle="#fff"; ctx.fillRect(0,0,cv.width,cv.height);
      try{ await meta.pageObj.render({canvasContext:ctx,viewport:vp}).promise; }catch(e){}
    }
    render();
  },[meta,zoom,viewRot]);

  function snapPt(p){
    if(!grid || !grid.snap) return p;
    const g=grid.size||36;
    return [Math.round(p[0]/g)*g, Math.round(p[1]/g)*g];
  }
  function toBase(e){
    const pt=svgRef.current.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY;
    const m=gRootRef.current.getScreenCTM(); if(!m) return [0,0];
    const p=pt.matrixTransform(m.inverse()); return snapPt([p.x,p.y]);
  }
  function toBaseRaw(e){
    const pt=svgRef.current.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY;
    const m=gRootRef.current.getScreenCTM(); if(!m) return [0,0];
    const p=pt.matrixTransform(m.inverse()); return [p.x,p.y];
  }
  function toDisp(e){
    const pt=svgRef.current.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY;
    const m=svgRef.current.getScreenCTM(); if(!m) return [0,0];
    const p=pt.matrixTransform(m.inverse()); return [p.x,p.y];
  }
  function dispToBase(d){
    const a=svgRef.current.createSVGPoint(); a.x=d[0]; a.y=d[1];
    const scr=a.matrixTransform(svgRef.current.getScreenCTM());
    const b=svgRef.current.createSVGPoint(); b.x=scr.x; b.y=scr.y;
    const p=b.matrixTransform(gRootRef.current.getScreenCTM().inverse());
    return [p.x,p.y];
  }
  function baseToDisp(q){
    const a=svgRef.current.createSVGPoint(); a.x=q[0]; a.y=q[1];
    const scr=a.matrixTransform(gRootRef.current.getScreenCTM());
    const b=svgRef.current.createSVGPoint(); b.x=scr.x; b.y=scr.y;
    const p=b.matrixTransform(svgRef.current.getScreenCTM().inverse());
    return [p.x,p.y];
  }

  /* ---------- paint bucket ---------- */
  function doBucket(e){
    const cv=canvasRef.current; if(!cv||!cv.width) return;
    if(cv.width*cv.height > 12000000){
      toastMsg("Zoom out to use the paint bucket \u2014 this view is too large to scan");
      return;
    }
    const sc=cv.width/dispW;
    const d=toDisp(e);
    const px=Math.round(d[0]*sc), py=Math.round(d[1]*sc);
    if(px<0||py<0||px>=cv.width||py>=cv.height){ toastMsg("Click inside the page"); return; }
    let img;
    try{ img=cv.getContext("2d").getImageData(0,0,cv.width,cv.height); }
    catch(err){ toastMsg("Could not read the page pixels"); return; }
    const res=floodMask(img.data,cv.width,cv.height,px,py,tolerance);
    const total=cv.width*cv.height;
    if(res.count<12){ toastMsg("Nothing to fill there \u2014 try raising the tolerance"); return; }
    if(res.count>total*0.92){ toastMsg("That flooded the whole sheet \u2014 lower the tolerance"); return; }
    const c=traceContour(res.mask,cv.width,cv.height);
    if(c.length<8){ toastMsg("Couldn't trace that region"); return; }
    const eps=Math.max(0.6, 0.9/Math.max(0.15,zoom));
    const basePts=rdp(c,eps*sc*0.6).map(q=>dispToBase([q[0]/sc, q[1]/sc]));
    const simple=rdp(basePts, eps);
    if(simple.length<3){ toastMsg("Couldn't trace that region"); return; }
    const areaPct=(res.count/total*100).toFixed(1);
    addAnnotation(newAnn(pageNum,"polygon",simple,
      Object.assign({},style,{filled:true,width:style.width||0}),author,
      {layer:activeLayer,subject:"Fill"}));
    toastMsg("Filled region traced \u2014 "+simple.length+" points, "+areaPct+"% of sheet");
  }

  /* ---------- snapshot ---------- */
  async function exportRegion(r){
    const cv=canvasRef.current; if(!cv||!cv.width) return;
    const sc=cv.width/dispW;
    const cs=[[r[0],r[1]],[r[2],r[1]],[r[2],r[3]],[r[0],r[3]]].map(baseToDisp);
    const xs=cs.map(q=>q[0]), ys=cs.map(q=>q[1]);
    const dx0=Math.max(0,Math.min.apply(null,xs)), dy0=Math.max(0,Math.min.apply(null,ys));
    const dx1=Math.min(dispW,Math.max.apply(null,xs)), dy1=Math.min(dispH,Math.max.apply(null,ys));
    const w=Math.round((dx1-dx0)*sc), h=Math.round((dy1-dy0)*sc);
    if(w<6||h<6){ toastMsg("Region too small"); return; }
    const out=document.createElement("canvas"); out.width=w; out.height=h;
    const octx=out.getContext("2d");
    octx.fillStyle="#ffffff"; octx.fillRect(0,0,w,h);
    octx.drawImage(cv, Math.round(dx0*sc), Math.round(dy0*sc), w, h, 0, 0, w, h);
    try{
      const clone=svgRef.current.cloneNode(true);
      clone.setAttribute("xmlns","http://www.w3.org/2000/svg");
      clone.setAttribute("width",dispW); clone.setAttribute("height",dispH);
      Array.prototype.slice.call(clone.querySelectorAll("[data-h],[data-marq],[data-hov],foreignObject,[data-grid],[data-selo]"))
        .forEach(n=>n.parentNode&&n.parentNode.removeChild(n));
      const str=new XMLSerializer().serializeToString(clone);
      const img=new Image();
      await new Promise((res,rej)=>{ img.onload=res; img.onerror=rej;
        img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(str); });
      octx.drawImage(img, -dx0*sc, -dy0*sc, dispW*sc, dispH*sc);
    }catch(err){ /* markups omitted if the overlay can't rasterise */ }
    out.toBlob(function(b){
      const u=URL.createObjectURL(b), a=document.createElement("a");
      a.href=u; a.download=(fname||"page").replace(/\.pdf$/i,"")+"-p"+pageNum+"-snapshot.png";
      a.click(); setTimeout(()=>URL.revokeObjectURL(u),4000);
    },"image/png");
    toastMsg("Snapshot saved \u2014 "+w+"\u00d7"+h+" px");
  }

  /* ---------- editing existing PDF text ---------- */
  /* Topmost unlocked markup whose box contains p. Used by the right-click menu
     so it works even when a draw tool has pointer events switched off. */
  function annAt(p){
    for(let i=ann.length-1;i>=0;i--){
      const a=ann[i];
      if(a.page!==pageNum || isLocked(a) || !isVisible(a)) continue;
      const b=bbox(a.pts), pad=3/zoom;
      if(p[0]>=b[0]-pad && p[0]<=b[2]+pad && p[1]>=b[1]-pad && p[1]<=b[3]+pad) return a;
    }
    return null;
  }
  function onCtx(e){
    e.preventDefault();
    if(editing || !onContext) return;
    const p=toBase(e), a=annAt(p);
    if(a){ if(!selIds.includes(a.id)) setSelIds([a.id]); onContext(e.clientX,e.clientY,true); }
    else { onContext(e.clientX,e.clientY,false); }
  }

  function hitText(p){
    for(let i=textItems.length-1;i>=0;i--){
      const it=textItems[i];
      if(p[0]>=it.x-1 && p[0]<=it.x+it.w+1 && p[1]>=it.y-it.h*0.95 && p[1]<=it.y+it.h*0.22) return i;
    }
    return -1;
  }
  function editPdfText(it,clickX){
    const size=Math.max(4,it.h*0.92);
    const pts=[[it.x, it.y-it.h*0.92],[it.x+it.w, it.y]];
    setCaretAt(clickX==null ? null : caretFromX(it.str,size,clickX-it.x));
    setHoverT(-1);
    addAnnotation(newAnn(pageNum,"ptext",pts,
      {stroke:"#111111",fill:"#ffffff",filled:true,fillOpacity:1,width:0,
       fontSize:size,opacity:1,
       font:it.font||"sans", bold:!!it.bold, italic:!!it.italic},author,
      {layer:activeLayer,subject:"Edited text",text:it.str}));
  }

  function finishMulti(ptsOverride){
    if(!draft) return;
    const raw = ptsOverride || draft.pts;
    const pts = ptsOverride ? raw : raw.slice(0,-1);
    if(pts.length < (MINPTS[draft.type]||2)){ setDraft(null); return; }
    addAnnotation({...draft, pts});
    setDraft(null);
  }
  finishRef.current = finishMulti;

  function onDown(e){
    if(e.button!==0) return;
    if(editing) return;
    const p=toBase(e);

    if(tool==="format"){
      const g=e.target.closest("[data-id]");
      if(g) onFormatClick && onFormatClick(g.dataset.id);
      else toastMsg(fmtArmed? "Click a markup to paint it" : "Click a markup to pick up its look");
      return;
    }
    if(tool==="bucket"){ doBucket(e); return; }
    if(tool==="textedit"){
      const i=hitText(p);
      if(i>=0) editPdfText(textItems[i],p[0]);
      return;
    }
    if(tool==="snapshot"){
      dragRef.current={mode:"snap",start:p};
      setMarquee({x0:p[0],y0:p[1],x1:p[0],y1:p[1]});
      svgRef.current.setPointerCapture(e.pointerId); return;
    }

    if(tool==="select"){
      const h=e.target.closest("[data-h]");
      if(h && selIds.length===1){
        const a=ann.find(x=>x.id===selIds[0]);
        beginChange();
        dragRef.current={mode:"handle",a,i:+h.dataset.h,kind:h.dataset.kind,orig:JSON.parse(JSON.stringify(a.pts)),moved:false};
        svgRef.current.setPointerCapture(e.pointerId); return;
      }
      const g=e.target.closest("[data-id]");
      if(g){
        const id=g.dataset.id;
        let ids;
        if(e.shiftKey||e.ctrlKey||e.metaKey) ids = selIds.includes(id)? selIds.filter(i=>i!==id) : [...selIds,id];
        else ids = selIds.includes(id) ? selIds : [id];
        setSelIds(ids);
        const orig={}; ann.forEach(a=>{ if(ids.includes(a.id)) orig[a.id]=JSON.parse(JSON.stringify(a.pts)); });
        beginChange();
        dragRef.current={mode:"move",ids,start:p,orig,moved:false};
        svgRef.current.setPointerCapture(e.pointerId); return;
      }
      if(!(e.shiftKey||e.ctrlKey||e.metaKey)) setSelIds([]);
      dragRef.current={mode:"marquee",start:p,additive:e.shiftKey||e.ctrlKey||e.metaKey,base:selIds,cross:false};
      setMarquee({x0:p[0],y0:p[1],x1:p[0],y1:p[1]});
      svgRef.current.setPointerCapture(e.pointerId); return;
    }

    if(MULTI[tool]){
      if(!draft) setDraft(newAnn(pageNum,tool,[p,p.slice()],style,author));
      else{
        const pts=draft.pts.slice();
        if(pts.length>2 && dist(pts[0],p)<8/zoom){ finishMulti(); return; }
        pts[pts.length-1]=p; pts.push(p.slice());
        if(tool==="mangle" && pts.length===4){ finishMulti(pts.slice(0,3)); return; }
        setDraft(d=>({...d,pts}));
      }
      return;
    }
    if(tool==="ink"){
      setDraft(newAnn(pageNum,"ink",[p,p.slice()],style,author));
      dragRef.current={mode:"ink"}; svgRef.current.setPointerCapture(e.pointerId); return;
    }
    const t = tool==="calibrate" ? "mdist" : tool;
    const stampPreset = tool==="stamp" ? (STAMPS.find(x=>x.t===stampText)||STAMPS[0]) : null;
    let d=newAnn(pageNum,t,[p,p.slice()],
      tool==="stamp" ? Object.assign({},style,{stroke:stampPreset.c,fill:stampPreset.c,filled:true,fillOpacity:0.10,fontSize:Math.max(14,style.fontSize)}) : style,
      author, {layer:activeLayer});
    if(tool==="stamp") d.text=stampText;
    if(tool==="symbol") d.sym=symKey;
    if(tool==="callout") d.pts=[p,p.slice(),[p[0]+150,p[1]+56]];
    setDraft(d); dragRef.current={mode:"two"}; svgRef.current.setPointerCapture(e.pointerId);
  }

  function onMove(e){
    const p=toBase(e);
    setCoord("X "+(p[0]*scale.factor).toFixed(2)+"  Y "+(p[1]*scale.factor).toFixed(2)+" "+scale.unit);
    const drag=dragRef.current;
    if(!drag){
      if((tool==="select"||tool==="textedit") && !editing && textItems.length){
        const h=hitText(p); if(h!==hoverT) setHoverT(h);
      } else if(hoverT!==-1) setHoverT(-1);
      if(draft && MULTI[tool]){
        const pts=draft.pts.slice();
        pts[pts.length-1]= e.shiftKey? snapAngle(pts[pts.length-2],p) : p;
        setDraft(d=>({...d,pts}));
      }
      return;
    }
    if(drag.mode==="marquee"||drag.mode==="snap"){
      /* dragging right-to-left is a crossing selection (CAD/Bluebeam convention) */
      if(drag.mode==="marquee") drag.cross = p[0] < drag.start[0];
      setMarquee(m=>({...m,x1:p[0],y1:p[1],cross:drag.mode==="marquee"?p[0]<drag.start[0]:false}));
      return;
    }
    if(drag.mode==="move"){
      const dx=p[0]-drag.start[0], dy=p[1]-drag.start[1];
      if(dx||dy) drag.moved=true;
      setAnn(prev=>prev.map(a=> drag.orig[a.id] ? {...a, pts:drag.orig[a.id].map(q=>[q[0]+dx,q[1]+dy])} : a));
      return;
    }
    if(drag.mode==="handle"){
      drag.moved=true;
      const a=drag.a; let newPts;
      if(drag.kind==="pt"){ newPts=drag.orig.map((q,i)=> i===drag.i? p : q); }
      else{
        const bb=bbox(drag.orig); const fixed=[[bb[2],bb[3]],[bb[0],bb[3]],[bb[0],bb[1]],[bb[2],bb[1]]][drag.i];
        if(a.type==="ink"){
          const sx=(p[0]-fixed[0])/(((drag.i===0||drag.i===3)? bb[0]:bb[2])-fixed[0]||1);
          const sy=(p[1]-fixed[1])/((drag.i<2? bb[1]:bb[3])-fixed[1]||1);
          newPts=drag.orig.map(q=>[fixed[0]+(q[0]-fixed[0])*sx, fixed[1]+(q[1]-fixed[1])*sy]);
        }else{
          newPts=[[Math.min(fixed[0],p[0]),Math.min(fixed[1],p[1])],[Math.max(fixed[0],p[0]),Math.max(fixed[1],p[1])]];
        }
      }
      setAnn(prev=>prev.map(x=> x.id===a.id? {...x,pts:newPts} : x));
      return;
    }
    if(drag.mode==="ink" && draft){
      const pts=draft.pts.slice();
      if(dist(pts[pts.length-1],p) > 1.2/zoom) pts.push(p);
      setDraft(d=>({...d,pts})); return;
    }
    if(drag.mode==="two" && draft){
      const d={...draft, pts:draft.pts.slice()};
      if(d.type==="callout"){ const dx=p[0]-d.pts[1][0], dy=p[1]-d.pts[1][1];
        d.pts[1]=p.slice(); d.pts[2]=[d.pts[2][0]+dx,d.pts[2][1]+dy]; }
      else d.pts[d.pts.length-1]= e.shiftKey? snapAngle(d.pts[0],p) : p;
      setDraft(d); return;
    }
  }

  function onUp(e){
    const drag=dragRef.current; if(!drag) return;
    dragRef.current=null;
    try{ svgRef.current.releasePointerCapture(e.pointerId); }catch(err){}
    if(drag.mode==="snap"){
      const m=marquee; setMarquee(null);
      if(!m) return;
      exportRegion([Math.min(m.x0,m.x1),Math.min(m.y0,m.y1),Math.max(m.x0,m.x1),Math.max(m.y0,m.y1)]);
      return;
    }
    if(drag.mode==="marquee"){
      const m=marquee; setMarquee(null);
      if(!m) return;
      const r=[Math.min(m.x0,m.x1),Math.min(m.y0,m.y1),Math.max(m.x0,m.x1),Math.max(m.y0,m.y1)];
      if(Math.abs(r[2]-r[0])<2 && Math.abs(r[3]-r[1])<2) return;
      const cross=!!drag.cross;
      const hit=ann.filter(a=> a.page===pageNum && !isLocked(a) && isVisible(a) &&
        (cross ? boxesOverlap(bbox(a.pts),r) : boxInside(bbox(a.pts),r))).map(a=>a.id);
      setSelIds(drag.additive ? Array.from(new Set([...drag.base,...hit])) : hit);
      toastMsg(hit.length
        ? hit.length+" selected ("+(cross?"crossing":"enclosed")+")"
        : (cross?"Nothing crossed that box":"Nothing fully inside that box \u2014 drag right-to-left to catch partials"));
      return;
    }
    /* a click that never moved anything must not leave an empty undo step */
    if(drag.mode==="move"||drag.mode==="handle"){ drag.moved?commitChange():cancelChange(); return; }
    if(drag.mode==="ink"||drag.mode==="two"){
      if(!draft) return;
      const small = draft.type!=="callout" && dist(draft.pts[0],draft.pts[draft.pts.length-1])<3;
      if(small){ setDraft(null); return; }
      if(tool==="calibrate"){ const len=polyLen(draft.pts,false); setDraft(null); onCalibrateDone(len); return; }
      addAnnotation(draft); setDraft(null);
    }
  }
  function onDbl(e){
    if(draft && MULTI[tool]){ finishMulti(); return; }
    if(tool!=="select") return;
    const g=e.target.closest("[data-id]");
    if(g){
      const a=ann.find(x=>x.id===g.dataset.id);
      if(a && (a.type==="text"||a.type==="callout"||a.type==="ptext"||a.type==="stamp")){
        const p0=toBase(e), bb=bbox(a.pts);
        setSelIds([a.id]);
        setCaretAt(caretFromX(((a.text||"").split("\n")[0]),(a.style&&a.style.fontSize)||12,p0[0]-bb[0]));
        setEditing(a.id);
      }
      return;
    }
    /* nothing of ours under the cursor \u2014 try the PDF's own text */
    const p=toBase(e), i=hitText(p);
    if(i>=0) editPdfText(textItems[i],p[0]);
  }

  const selAnns=ann.filter(a=>selIds.includes(a.id) && a.page===pageNum);
  const editAnn = editing ? ann.find(a=>a.id===editing) : null;
  const editBox = editAnn ? bbox(editAnn.type==="callout" ? [editAnn.pts[1],editAnn.pts[2]] : editAnn.pts) : null;

  const gridLines=[];
  if(grid && grid.on){
    const g=Math.max(4,grid.size||36);
    for(let x=g;x<meta.width;x+=g) gridLines.push(["v",x]);
    for(let y=g;y<meta.height;y+=g) gridLines.push(["h",y]);
  }
  const pageAnns=ann.filter(a=>a.page===pageNum && isVisible(a));
  const liveAnns=pageAnns.filter(a=>!isLocked(a));
  const lockedAnns=pageAnns.filter(a=>isLocked(a));

  return (
    <div className="pagewrap">
      <div className={"page "+(tool==="select"?(hoverT>=0&&!editing?"cursor-text":"cursor-select"):tool==="format"?"cursor-format":tool==="bucket"?"cursor-bucket":tool==="textedit"?"cursor-text":"cursor-draw")} style={{width:dispW*zoom,height:dispH*zoom}}>
        <canvas ref={canvasRef} style={{width:"100%",height:"100%"}}/>
        <svg ref={svgRef} className="ovl" viewBox={`0 0 ${dispW} ${dispH}`}
          onPointerDown={onDown} onPointerMove={onMove} onPointerUp={onUp} onDoubleClick={onDbl}
          onContextMenu={onCtx} onPointerLeave={()=>setCoord("—")}>
          <g ref={gRootRef} transform={rotTransform}>
            {gridLines.length>0 && (
              <g data-grid="1" pointerEvents="none">
                {gridLines.map((l,i)=> l[0]==="v"
                  ? <line key={"gv"+i} x1={l[1]} y1={0} x2={l[1]} y2={meta.height} stroke="#2f7fd6" strokeOpacity="0.20" strokeWidth={0.6/zoom}/>
                  : <line key={"gh"+i} x1={0} y1={l[1]} x2={meta.width} y2={l[1]} stroke="#2f7fd6" strokeOpacity="0.20" strokeWidth={0.6/zoom}/>)}
              </g>
            )}
            <g pointerEvents="none">
              {lockedAnns.map(a=> <AnnSvg key={a.id} a={{...a,scale}} hideText={a.id===editing}/>)}
            </g>
            <g pointerEvents={(tool==="select"||tool==="format")&&!editing?"auto":"none"}>
              {liveAnns.map(a=> <AnnSvg key={a.id} a={{...a,scale}} hideText={a.id===editing}/>)}
            </g>
            {tool==="textedit" && (
              <g pointerEvents="none">
                {textItems.map((it,i)=>(
                  <rect key={"te"+i} x={it.x} y={it.y-it.h*0.92}
                    width={Math.max(2,it.w)} height={Math.max(3,it.h*1.05)}
                    fill="#2fb2e8" fillOpacity="0.10" stroke="#2fb2e8" strokeOpacity="0.40"
                    strokeWidth={0.5/zoom}/>
                ))}
              </g>
            )}
            {hoverT>=0 && !editing && (tool==="select"||tool==="textedit") && textItems[hoverT] && (
              <g data-hov="1" pointerEvents="none">
                <rect x={textItems[hoverT].x-1} y={textItems[hoverT].y-textItems[hoverT].h*0.95}
                  width={Math.max(2,textItems[hoverT].w+2)} height={Math.max(3,textItems[hoverT].h*1.16)}
                  fill="#2fb2e8" fillOpacity="0.12"/>
                <line x1={textItems[hoverT].x} y1={textItems[hoverT].y+1.3}
                  x2={textItems[hoverT].x+textItems[hoverT].w} y2={textItems[hoverT].y+1.3}
                  stroke="#2fb2e8" strokeOpacity="0.8" strokeWidth={Math.max(0.5,1/zoom)}/>
              </g>
            )}
            <g pointerEvents="none">
              {draft && draft.page===pageNum && <AnnSvg a={{...draft,scale}} opacity={0.85}/>}
              {selAnns.map(a=>{ const bb=bbox(a.pts); return (
                <rect key={"o"+a.id} data-selo="1" x={bb[0]-2} y={bb[1]-2} width={bb[2]-bb[0]+4} height={bb[3]-bb[1]+4}
                  fill="none" stroke="#f0a92e" strokeWidth={1/zoom} strokeDasharray={(4/zoom)+" "+(3/zoom)} strokeOpacity="0.8"/>); })}
              {selAnns.length>1 && (()=>{ const gb=bbox([].concat.apply([],selAnns.map(a=>a.pts))); return (
                <rect data-selo="1" x={gb[0]-5} y={gb[1]-5} width={gb[2]-gb[0]+10} height={gb[3]-gb[1]+10}
                  fill="none" stroke="#f0a92e" strokeWidth={1.4/zoom} strokeOpacity="0.5"/>); })()}
              {marquee && (
                <rect data-marq="1" x={Math.min(marquee.x0,marquee.x1)} y={Math.min(marquee.y0,marquee.y1)}
                  width={Math.abs(marquee.x1-marquee.x0)} height={Math.abs(marquee.y1-marquee.y0)}
                  fill="#A8462A" fillOpacity={marquee.cross?0.08:0.13} stroke="#A8462A" strokeWidth={1/zoom}
                  strokeDasharray={marquee.cross?(4/zoom)+" "+(3/zoom):undefined}/>
              )}
            </g>
            <g>
              {selAnns.length===1 && !editing && tool==="select" && <Handles a={selAnns[0]} zoom={zoom}/>}
            </g>
            {editAnn && editAnn.page===pageNum && (
              <TextEditor a={editAnn} box={editBox} caretAt={caretAt}
                onChange={setText}
                onCommit={()=>{ setEditing(null); setCaretAt(null); }}
                onCancel={()=>{ setEditing(null); setCaretAt(null); }}/>
            )}
          </g>
        </svg>
        {scale!==DEFSCALE && <div className="calbadge">1 pt = {scale.factor.toPrecision(4)} {scale.unit}</div>}
      </div>
    </div>
  );
}

function AnnSvg({a,opacity,hideText}){
  const G=geom(a); const st=Object.assign({},DEFSTYLE,a.style);
  const bb=bbox(a.pts);
  return (
    <g opacity={opacity}>
      {G.fills.map((f,i)=><path key={"f"+i} d={ptsToD(f.pts,true)} fill={f.color} fillOpacity={f.op} stroke="none"/>)}
      {G.strokes.map((s,i)=> s.pts.length<2? null : (
        <g key={"s"+i}>
          <path d={ptsToD(s.pts,s.closed)} fill="none" stroke={st.stroke} strokeWidth={st.width} strokeOpacity={st.opacity}
            strokeLinejoin="round" strokeLinecap="round" strokeDasharray={st.dash? (st.dash*3)+" "+(st.dash*2):undefined}/>
          <path d={ptsToD(s.pts,s.closed)} fill="none" stroke="transparent" strokeWidth={Math.max(st.width,9)} style={{pointerEvents:"stroke"}}/>
        </g>
      ))}
      {G.arrows.map((t,i)=><path key={"a"+i} d={ptsToD(t,true)} fill={st.stroke} fillOpacity={st.opacity} stroke="none"/>)}
      {!hideText && G.texts.map((t,i)=>{
        const w=Math.max(...t.lines.map(l=>l.length))*t.size*0.55+8, h=t.lines.length*t.size*1.2+5;
        const deco=[t.underline?"underline":null, t.strike?"line-through":null].filter(Boolean).join(" ");
        const anchor = t.center ? "middle" : t.align==="center" ? "middle" : t.align==="right" ? "end" : "start";
        return (
          <g key={"t"+i} transform={t.rot ? "rotate("+t.rot.a+" "+t.rot.cx+" "+t.rot.cy+")" : undefined}>
            {t.badge && <rect x={t.x-(t.center?w/2:0)} y={t.y-(t.center?h/2:0)} width={w} height={h} rx="2"
              fill="#ffffff" fillOpacity="0.86" stroke={st.stroke} strokeWidth="0.5" strokeOpacity="0.5"/>}
            {t.lines.map((ln,li)=>{
              const y=t.badge&&t.center ? t.y-(t.lines.length*t.size*1.2)/2+t.size*0.95+li*t.size*1.2 : t.y+li*t.size*1.2;
              return <text key={li} x={t.x} y={y} fontFamily={FONTCSS[t.font||"sans"]} fontSize={t.size}
                fontWeight={t.bold?"bold":undefined} fontStyle={t.italic?"italic":undefined}
                textDecoration={deco||undefined}
                fill={t.color} fillOpacity={st.opacity} textAnchor={anchor} style={{pointerEvents:"none"}}>{ln}</text>;
            })}
          </g>
        );
      })}
      <rect data-id={a.id} x={bb[0]} y={bb[1]} width={Math.max(1,bb[2]-bb[0])} height={Math.max(1,bb[3]-bb[1])}
        fill="transparent" style={{pointerEvents:(a.type==="rect"&&!a.style.filled)||a.type==="ellipse"||a.type==="polygon"?"none":"fill"}}/>
    </g>
  );
}
function Handles({a,zoom}){
  const r=5/zoom; const bb=bbox(a.pts);
  const boxHandles=["rect","highlight","text","ellipse","ink","stamp","symbol","ptext"].includes(a.type);
  const pts= boxHandles ? [[bb[0],bb[1]],[bb[2],bb[1]],[bb[2],bb[3]],[bb[0],bb[3]]] : a.pts;
  const kind= boxHandles ? "box":"pt";
  return (
    <g>
      {pts.map((p,i)=>(
        <rect key={i} data-h={i} data-kind={kind} x={p[0]-r} y={p[1]-r} width={r*2} height={r*2}
          fill="#A8462A" stroke="#FFFFFF" strokeWidth={1.4/zoom} style={{cursor:"pointer"}}/>
      ))}
    </g>
  );
}

function KeysPane(){
  return (
    <div className="pane">
      {SHORTCUTS.map((r,i)=>(
        <div className="sec" key={i} style={r[0]?{}:{borderBottom:"none",paddingTop:0,paddingBottom:4}}>
          {r[0] && <h4>{r[0]}</h4>}
          <div className="hint" style={{fontFamily:"var(--mono)",fontSize:10.5,lineHeight:1.8,color:"var(--muted)"}}>{r[1]}</div>
        </div>
      ))}
      <div className="sec"><div className="hint">Shortcuts are ignored while you are typing in a field or editing text on the page, so Ctrl+Z still undoes your typing there rather than the drawing.</div></div>
    </div>
  );
}

function PropsPane({selAnns,one,tool,style,setStyle,lockTool,setLockTool,applyStyle,onChangeText,onChangeSubject,onChangeAuthor,onDelete,onDuplicate,
                    tolerance,setTolerance,stampText,setStampText,symKey,setSymKey}){
  const multi = selAnns.length>1;
  const st = one ? Object.assign({},DEFSTYLE,one.style)
    : multi ? Object.assign({},DEFSTYLE,selAnns[0].style) : style;

  /* Which style keys disagree across a multi-selection, so the panel can say
     "Mixed" instead of silently showing the first markup's value. */
  const mixed={};
  if(multi){
    ["stroke","fill","width","opacity","fillOpacity","dash","fontSize","cloudR",
     "arrowSize","rotation","filled","arrowStart","arrowEnd"].forEach(k=>{
      const v0=st[k];
      mixed[k]=selAnns.some(a=>Object.assign({},DEFSTYLE,a.style)[k]!==v0);
    });
  }
  const mv=(k,shown)=> mixed[k] ? "Mixed" : shown;

  /* For a multi-selection show the union of what the selected types support,
     minus the tool-configuration panels and minus noStroke unless every
     selected markup is strokeless. */
  const caps = one ? (CAPS[one.type]||{})
    : multi ? (function(){
        const u={};
        selAnns.forEach(a=>{ const c=CAPS[a.type]||{};
          for(const k in c) if(k!=="noStroke"&&k!=="bucket"&&k!=="stamp"&&k!=="symbol") u[k]=1; });
        if(selAnns.every(a=>(CAPS[a.type]||{}).noStroke)) u.noStroke=1;
        return u;
      })()
    : (tool!=="select" ? (CAPS[tool]||{}) : {stroke:1,dash:1,fill:1,font:1,arrow:1,cloud:1});

  const isText = one && (one.type==="text"||one.type==="callout"||one.type==="ptext"||one.type==="stamp");
  const kinds = multi ? Array.from(new Set(selAnns.map(a=>LABEL[a.type]))) : [];
  const title = one ? "Selected · "+LABEL[one.type]
    : multi ? selAnns.length+" markups selected"
    : tool!=="select" ? "Defaults · "+LABEL[tool] : "Defaults for next markup";

  return (
    <div className="pane">
      <div className="sec">
        <h4>{title}</h4>
        {multi && <div className="hint" style={{marginBottom:8}}>
          {kinds.join(", ")} &mdash; every change below applies to all {selAnns.length}.
        </div>}
        {!one && !multi && <div className="hint" style={{marginBottom:8}}>
          Nothing selected, so these set the look of the <b>next</b> markup you draw.
        </div>}
        <div className="row"><label>Color</label>
          <input type="color" value={st.stroke} onChange={e=>{applyStyle("stroke",e.target.value); applyStyle("fill",e.target.value);}}/>
          <div className="swatches">
            {PALETTE.map(c=><button key={c} className="sw" style={{background:c}} onClick={()=>{applyStyle("stroke",c);applyStyle("fill",c);}}/>)}
          </div>
        </div>
        {!caps.noStroke && <>
          <div className="row"><label>Line width</label><input type="range" min="0" max="12" step="0.5" value={st.width} onChange={e=>applyStyle("width",+e.target.value)}/><div className="val">{mv("width",st.width)}</div></div>
          <div className="row"><label>Line opacity</label><input type="range" min="0.1" max="1" step="0.05" value={st.opacity} onChange={e=>applyStyle("opacity",+e.target.value)}/><div className="val">{mv("opacity",Math.round(st.opacity*100)+"%")}</div></div>
        </>}
        {caps.dash && <div className="row"><label>Dash</label><input type="range" min="0" max="8" step="1" value={st.dash} onChange={e=>applyStyle("dash",+e.target.value)}/><div className="val">{mv("dash",st.dash||"—")}</div></div>}
        {caps.fill && <>
          <div className="row"><label>Fill</label><input type="color" value={st.fill} onChange={e=>applyStyle("fill",e.target.value)}/>
            {!caps.noStroke && <label className="chk"><input type="checkbox" checked={st.filled} onChange={e=>applyStyle("filled",e.target.checked)}/> Filled</label>}</div>
          <div className="row"><label>Fill opacity</label><input type="range" min="0" max="1" step="0.05" value={st.fillOpacity} onChange={e=>applyStyle("fillOpacity",+e.target.value)}/><div className="val">{mv("fillOpacity",Math.round(st.fillOpacity*100)+"%")}</div></div>
        </>}
        {caps.arrow && <>
          <div className="row">
            <label className="chk"><input type="checkbox" checked={st.arrowStart} onChange={e=>applyStyle("arrowStart",e.target.checked)}/> Start</label>
            <label className="chk"><input type="checkbox" checked={st.arrowEnd} onChange={e=>applyStyle("arrowEnd",e.target.checked)}/> End arrow</label>
          </div>
          <div className="row"><label>Arrow size</label><input type="range" min="4" max="60" step="1" value={st.arrowSize} onChange={e=>applyStyle("arrowSize",+e.target.value)}/><div className="val">{st.arrowSize}</div></div>
        </>}
        {caps.font && <div className="row"><label>Text size</label><input type="range" min="6" max="72" step="1" value={st.fontSize} onChange={e=>applyStyle("fontSize",+e.target.value)}/><div className="val">{mv("fontSize",st.fontSize)}</div></div>}
        {caps.font && <>
          <div className="row"><label>Font</label>
            <select value={st.font||"sans"} style={{fontFamily:FONTCSS[st.font||"sans"]}}
              onChange={e=>applyStyle("font",e.target.value)}>
              {FONTS.map(f=><option key={f.k} value={f.k} style={{fontFamily:f.css}}>{f.name}</option>)}
            </select>
          </div>
          <div className="row"><label>Style</label>
            <div className="seg">
              <button className={"segb"+(st.bold?" on":"")} title="Bold" style={{fontWeight:700}}
                onClick={()=>applyStyle("bold",!st.bold)}>B</button>
              <button className={"segb"+(st.italic?" on":"")} title="Italic" style={{fontStyle:"italic",fontFamily:"Georgia,serif"}}
                onClick={()=>applyStyle("italic",!st.italic)}>I</button>
              <button className={"segb"+(st.underline?" on":"")} title="Underline" style={{textDecoration:"underline"}}
                onClick={()=>applyStyle("underline",!st.underline)}>U</button>
              <button className={"segb"+(st.strike?" on":"")} title="Strike-through" style={{textDecoration:"line-through"}}
                onClick={()=>applyStyle("strike",!st.strike)}>S</button>
            </div>
          </div>
          <div className="row"><label>Align</label>
            <div className="seg">
              {[["left","Align left","M3 4h13M3 8h9M3 12h13M3 16h7"],
                ["center","Centre","M3 4h13M5 8h9M3 12h13M6 16h7"],
                ["right","Align right","M4 4h13M8 8h9M4 12h13M10 16h7"]].map(o=>(
                <button key={o[0]} className={"segb"+((st.align||"left")===o[0]?" on":"")} title={o[1]}
                  onClick={()=>applyStyle("align",o[0])}>
                  <svg viewBox="0 0 20 20"><path d={o[2]}/></svg>
                </button>
              ))}
            </div>
          </div>
          <div className="row"><label>Baseline</label>
            <div className="seg">
              <button className={"segb"+((st.baseline||"normal")==="normal"?" on":"")} title="Normal baseline"
                onClick={()=>applyStyle("baseline","normal")}>x</button>
              <button className={"segb"+(st.baseline==="super"?" on":"")} title="Superscript"
                onClick={()=>applyStyle("baseline","super")}>x&sup2;</button>
              <button className={"segb"+(st.baseline==="sub"?" on":"")} title="Subscript"
                onClick={()=>applyStyle("baseline","sub")}>x&#8322;</button>
            </div>
          </div>
          <div className="hint">Font, weight, underline, alignment and baseline apply to the whole text box &mdash; the note is styled as one block, not letter by letter.</div>
        </>}
        {caps.cloud && <div className="row"><label>Cloud arc</label><input type="range" min="3" max="30" step="1" value={st.cloudR} onChange={e=>applyStyle("cloudR",+e.target.value)}/><div className="val">{st.cloudR}</div></div>}
        {caps.rot && <>
          <div className="row"><label>Rotation</label>
            <input type="range" min="-180" max="180" step="1" value={st.rotation||0} onChange={e=>applyStyle("rotation",+e.target.value)}/>
            <div className="val">{mv("rotation",Math.round(st.rotation||0)+"°")}</div></div>
          <div className="row">
            <button className="tb" onClick={()=>applyStyle("rotation",0)}>0&deg;</button>
            <button className="tb" onClick={()=>applyStyle("rotation",(((st.rotation||0)-90)+540)%360-180)}>&minus;90&deg;</button>
            <button className="tb" onClick={()=>applyStyle("rotation",(((st.rotation||0)+90)+540)%360-180)}>+90&deg;</button>
          </div>
        </>}
      </div>

      {caps.bucket && (
        <div className="sec"><h4>Paint bucket</h4>
          <div className="row"><label>Tolerance</label>

function ListPane({ann,scales,selIds,layers,onBatch,onPick,onExport}){

/* =====================================================================
   SITEWORK — DXF site plan editor (isolated module, own closure)
   ===================================================================== */
const SiteworkApp = (function(){
const {PDFDocument,rgb,StandardFonts} = window.PDFLib;

const uid=()=>Math.random().toString(36).slice(2,10);
function dist(a,b){ return Math.hypot(b[0]-a[0],b[1]-a[1]); }
function bbox(pts){ const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]); return [Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys)]; }
function shoelace(pts){ let a=0; for(let i=0;i<pts.length;i++){ const p=pts[i],q=pts[(i+1)%pts.length]; a+=p[0]*q[1]-q[0]*p[1]; } return Math.abs(a)/2; }
function ptsToD(pts,close){ if(!pts.length) return ""; return "M "+pts.map(p=>p[0].toFixed(3)+" "+p[1].toFixed(3)).join(" L ")+(close?" Z":""); }
function isAxisRect(pts){
  if(pts.length!==4) return false;
  for(let i=0;i<4;i++){ const a=pts[i], b=pts[(i+1)%4];
    if(Math.abs(a[0]-b[0])>1e-6 && Math.abs(a[1]-b[1])>1e-6) return false; }
  return true;
}

const ACI_BASE={0:"#000000",1:"#ff0000",2:"#ffff00",3:"#00ff00",4:"#00ffff",5:"#4d7dff",6:"#ff00ff",
  7:"#dfe4ec",8:"#808080",9:"#bfbfbf"};
function aciColor(idx){
  if(idx==null) return "#dfe4ec";
  const i=Math.abs(idx);
  if(ACI_BASE[i]) return ACI_BASE[i];
  if(i>=250 && i<=255){ const t=(i-250)/5; const g=Math.round(60+t*180); return rgbHex(g,g,g); }
  const hue=(i*47)%360;
  return hslHex(hue, 62, 55);
}
function rgbHex(r,g,b){ return "#"+[r,g,b].map(v=>Math.max(0,Math.min(255,v|0)).toString(16).padStart(2,"0")).join(""); }
function hslHex(h,s,l){
  s/=100; l/=100;
  const k=n=>(n+h/30)%12, a=s*Math.min(l,1-l);
  const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  return rgbHex(Math.round(f(0)*255),Math.round(f(8)*255),Math.round(f(4)*255));
}
function closestAci(hex){
  let best=7,bd=1e9;
  for(let i=0;i<256;i++){ const c=aciColor(i); const d=hexDist(c,hex); if(d<bd){bd=d;best=i;} }
  return best;
}
function hexDist(a,b){ const pa=hexToRgb(a), pb=hexToRgb(b); return Math.hypot(pa[0]-pb[0],pa[1]-pb[1],pa[2]-pb[2]); }
function hexToRgb(h){ h=h.replace("#",""); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
function hexToRgb01(hex){ const p=hexToRgb(hex); return [p[0]/255,p[1]/255,p[2]/255]; }

function parseDxf(text){
  const raw=text.split(/\r\n|\r|\n/);
  const lines=[]; for(let i=0;i+1<raw.length;i+=2){ lines.push([parseInt(raw[i].trim(),10), (raw[i+1]||"").replace(/\r$/,"")]); }
  let i=0; const n=lines.length;
  const layers={};
  const entities=[];
  let section=null;
  function peek(){ return lines[i]; }
  function next(){ return lines[i++]; }

  while(i<n){
    const [code,val]=next();
    if(code===0 && val==="SECTION"){ const [,v2]=next(); section=v2; continue; }
    if(code===0 && val==="ENDSEC"){ section=null; continue; }
    if(code===0 && val==="EOF") break;

    if(section==="TABLES" && code===0 && val==="LAYER"){
      let name=null,color=7;
      while(i<n){ const [c,v]=peek(); if(c===0) break; next(); if(c===2) name=v; else if(c===62) color=parseInt(v,10); }
      if(name) layers[name]={color};
      continue;
    }
    if(section==="ENTITIES" && code===0 && val==="POLYLINE"){
      let layer="0", flags=0;
      while(i<n){ const [c,v]=peek(); if(c===0) break; next(); if(c===8) layer=v; else if(c===70) flags=parseInt(v,10)||0; }
      const pts=[];
      while(i<n && peek()[0]===0 && peek()[1]==="VERTEX"){
        next(); let x=0,y=0;
        while(i<n){ const [c,v]=peek(); if(c===0) break; next(); if(c===10) x=parseFloat(v); else if(c===20) y=parseFloat(v); }
        pts.push([x,y]);
      }
      if(i<n && peek()[0]===0 && peek()[1]==="SEQEND") next();
      if(pts.length>=2) entities.push({id:uid(),kind:"poly",layer,pts,closed:!!(flags&1)});
      continue;
    }
    if(section==="ENTITIES" && code===0 && val==="LWPOLYLINE"){
      let layer="0", flags=0, verts=[]; let pendingX=null;
      while(i<n){
        const [c,v]=peek(); if(c===0) break; next();
        if(c===8) layer=v; else if(c===70) flags=parseInt(v,10)||0;
        else if(c===10) pendingX=parseFloat(v);
        else if(c===20){ verts.push([pendingX, parseFloat(v)]); pendingX=null; }
      }
      if(verts.length>=2) entities.push({id:uid(),kind:"poly",layer,pts:verts,closed:!!(flags&1)});
      continue;
    }
    if(section==="ENTITIES" && code===0 && val==="TEXT"){
      let layer="0", x=0,y=0,h=2.5,txt="",rot=0;
      while(i<n){
        const [c,v]=peek(); if(c===0) break; next();
        if(c===8) layer=v; else if(c===10) x=parseFloat(v); else if(c===20) y=parseFloat(v);
        else if(c===40) h=parseFloat(v); else if(c===1) txt=v; else if(c===50) rot=parseFloat(v)||0;
      }
      entities.push({id:uid(),kind:"text",layer,pts:[[x,y]],text:txt,height:h,rotation:rot});
      continue;
    }
  }
  return {layers, entities};
}

function writeDxf(entities, layerMeta){
  const L=[]; const g=(c,v)=>{ L.push(String(c)); L.push(String(v)); };
  g(0,"SECTION"); g(2,"HEADER"); g(9,"$ACADVER"); g(1,"AC1009"); g(9,"$INSUNITS"); g(70,6); g(0,"ENDSEC");
  g(0,"SECTION"); g(2,"TABLES");
  const names=Object.keys(layerMeta);
  g(0,"TABLE"); g(2,"LAYER"); g(70,names.length);
  names.forEach(nm=>{ g(0,"LAYER"); g(2,nm); g(70,0); g(62,layerMeta[nm].color||7); g(6,"CONTINUOUS"); });
  g(0,"ENDTAB"); g(0,"ENDSEC");
  g(0,"SECTION"); g(2,"BLOCKS"); g(0,"ENDSEC");
  g(0,"SECTION"); g(2,"ENTITIES");
  entities.forEach(e=>{
    if(e.kind==="poly"){
      g(0,"POLYLINE"); g(8,e.layer); g(66,1); g(70, e.closed?1:0);
      e.pts.forEach(p=>{ g(0,"VERTEX"); g(8,e.layer); g(10,p[0].toFixed(4)); g(20,p[1].toFixed(4)); g(30,0); });
      g(0,"SEQEND");
    }else if(e.kind==="text"){
      g(0,"TEXT"); g(8,e.layer); g(10,e.pts[0][0].toFixed(4)); g(20,e.pts[0][1].toFixed(4));
      g(30,0); g(40,e.height||2.5); g(1,e.text||""); g(50,e.rotation||0);
    }
  });
  g(0,"ENDSEC"); g(0,"EOF");
  return L.join("\n")+"\n";
}

const ICON={
  select:'<path d="M4 3l7 16 2.2-6.4L20 10.2z"/>',
  pan:'<path d="M12 3v9M12 3l-2.5 2.5M12 3l2.5 2.5"/><path d="M4 12h9M4 12l2.5-2.5M4 12l2.5 2.5"/><path d="M12 21v-9"/><path d="M20 12h-9"/>',
